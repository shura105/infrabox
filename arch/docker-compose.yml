services:

  archivator:
    build: ./archivator
    container_name: infrabox-arch
    restart: unless-stopped
    networks:
      - infrabox-net
    environment:
      TZ: Europe/Kyiv
      PYTHONUNBUFFERED: 1
      REDIS_HOST: ${REDIS_HOST:-infrabox-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      ARCH_SYNC_INTERVAL: "600"   # секунд між записами на диск (10 хв)
      ARCH_MAX_DAYS: "4"          # скільки діб відновлювати з диска в RAM при старті
      LOG_LEVEL: "INFO"           # INFO=файл+консоль, WARNING=тільки консоль
    volumes:
      - ./archivator/config:/app/config
      - ./archivator/data:/app/data-disk     # диск: постійне сховище
      - ../log:/app/log
      - ../core/service/config:/app/core_config:ro
      - ./archivator/app/modules/writer.py:/app/modules/writer.py:ro
      - ./archivator/app/modules/volume.py:/app/modules/volume.py:ro
      - ./archivator/sync-start.sh:/app/sync-start.sh:ro
    tmpfs:
      - /app/data:size=512m,mode=0755        # апаратний максимум; м'який ліміт — arch_ram_budget_mb в sys_params
    entrypoint: ["/bin/sh", "/app/sync-start.sh"]

  arch-backend:
    build: ./backend
    container_name: infrabox-arch-backend
    restart: unless-stopped
    networks:
      - infrabox-net
    environment:
      TZ: Europe/Kyiv
      PYTHONUNBUFFERED: 1
      ARCH_URL: http://infrabox-arch:8100
      REDIS_HOST: ${REDIS_HOST:-infrabox-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - ../log:/app/log

  arch-ui:
    image: nginx:stable-alpine
    container_name: infrabox-arch-ui
    restart: unless-stopped
    networks:
      - infrabox-net
    environment:
      TZ: Europe/Kyiv
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  infrabox-net:
    external: true
