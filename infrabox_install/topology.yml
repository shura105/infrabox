# topology.yml — карта розгортання Infrabox
# Джерело правди про те, що де запущено і як налаштовано.
# Генерується майстром при першій установці, редагується вручну
# або через майстер при змінах. Зберігати в безпечному місці.
#
# УВАГА: не зберігати SSH-ключі тут — тільки шляхи до них.

version: "1"

# ── Система ──────────────────────────────────────────────────────────────────

system:
  name:        "Infrabox"
  description: "Система моніторингу та управління розумним будинком"
  timezone:    "Europe/Kyiv"
  repo:        "https://github.com/shura105/infrabox.git"
  branch:      "feat/infrabox-ui"

# ── Вузли (фізичні або віртуальні машини) ────────────────────────────────────

nodes:
  homeServ2:
    host:        "homeServ2.local"          # або IP: 192.168.1.105
    user:        "shura"
    ssh_key:     "~/.ssh/id_ed25519"        # шлях на машині адміна
    arch:        "arm/v7"
    os:          "armbian/debian-12"
    deploy_dir:  "/home/shura/infrabox"     # куди клоновано репо
    role:        "primary"

# ── Підсистеми ────────────────────────────────────────────────────────────────
# Кожна підсистема = окремий docker compose (свій workdir у репо).
# containers: перелік контейнерів, які запускає ця підсистема.

subsystems:

  core:
    node:     "homeServ2"
    workdir:  "core"                        # відносно deploy_dir
    description: "Redis, MQTT-брокери, обробка точок, авторизація, симулятор, selfdiagnostic"
    containers:
      - infrabox-redis
      - infrabox-mosquitto-real
      - infrabox-mosquitto-sim
      - infrabox-auth
      - infrabox-core
      - infrabox-simulator
      - infrabox-selfdiagnostic
    ports_exposed:
      - { host: 1883, container: 1883, service: "mosquitto-real", proto: "mqtt" }
      - { host: 1884, container: 1883, service: "mosquitto-sim",  proto: "mqtt" }
    env:
      JWT_SECRET:        "__CHANGE_ME__"    # обов'язково змінити при інсталяції
      JWT_EXPIRE_HOURS:  "24"
      DROP_ID:           "homeServ-1"       # ідентифікатор вузла в системі

  ui:
    node:     "homeServ2"
    workdir:  "ui"
    description: "Frontend (nginx+HTTPS), backend API, WebSocket"
    containers:
      - infrabox-web
      - infrabox-backend
    ports_exposed:
      - { host: 80,  container: 80,  service: "web", proto: "http"  }
      - { host: 443, container: 443, service: "web", proto: "https" }

  arch:
    node:     "homeServ2"
    workdir:  "arch"
    description: "Архіватор: запис історії, backend та UI для трендів"
    containers:
      - infrabox-arch
      - infrabox-arch-backend
      - infrabox-arch-ui
    ports_exposed: []                       # доступ тільки через nginx (ui)

  adm:
    node:     "homeServ2"
    workdir:  "adm"
    description: "Адміністративний сервіс: контейнери, хост, конфігурація"
    containers:
      - infrabox-adm
    ports_exposed: []                       # доступ тільки через nginx (ui)

# ── Зовнішні сервіси на вузлах (не частина infrabox) ─────────────────────────
# Фіксуємо щоб враховувати при перевірці портів і ресурсів.

external_services:
  homeServ2:
    - name: "portainer"
      container: "portainer"
      ports: [8000, 9000, 9443]
      note: "Docker UI — встановлений окремо, infrabox не керує"

# ── Docker-мережа ─────────────────────────────────────────────────────────────

docker_network:
  name:   "infrabox-net"
  driver: "bridge"
  # Створюється вручну або скриптом перед першим docker compose up:
  # docker network create infrabox-net

# ── Порядок розгортання ───────────────────────────────────────────────────────
# core має бути першим (Redis потрібен іншим підсистемам).

deploy_order:
  - core
  - arch
  - ui
  - adm

# ── Порядок видалення (зворотній до розгортання) ─────────────────────────────

undeploy_order:
  - adm
  - ui
  - arch
  - core

# ── Дані (volumes і директорії) ───────────────────────────────────────────────
# Важливо при міграції і деінсталяції: що видаляти, що зберігати.

data:
  # Docker named volume — не bind-path, керується через docker volume
  - type:        "docker_volume"
    name:        "core_redis-data"
    description: "Redis AOF дані (points, стан системи)"
    critical:    true                       # питати перед видаленням
    backup_cmd:  "docker run --rm -v core_redis-data:/data -v $(pwd):/backup alpine tar czf /backup/redis-backup.tar.gz /data"

  # Bind-mount директорії (відносно deploy_dir)
  - type:        "bind"
    path:        "core/mosquitto/mosquitto-real/data"
    description: "MQTT real broker persistence"
    critical:    false

  - type:        "bind"
    path:        "core/mosquitto/mosquitto-sim/data"
    description: "MQTT sim broker persistence"
    critical:    false

  - type:        "bind"
    path:        "arch/archivator/data"
    description: "Архів значень параметрів (SQLite томи)"
    critical:    true

  - type:        "bind"
    path:        "ui/data"
    description: "Конфігурація UI: project.json, screens/*.json"
    critical:    true

  - type:        "bind"
    path:        "adm/data"
    description: "Дані адмін-сервісу: subsystems.json"
    critical:    false

  - type:        "bind"
    path:        "log"
    description: "Спільні логи всіх підсистем (core, arch, etc.)"
    critical:    false
