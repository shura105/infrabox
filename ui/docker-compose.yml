services:

  backend:
    build: ./backend
    container_name: infrabox-backend
    restart: unless-stopped
    networks:
      - infrabox-net
    environment:
      # адресу core прокидає 3_deploy у .env (docker compose читає його автоматично):
      #   на core-вузлі — infrabox-redis (docker-DNS); на іншому — host core (LAN/WG)
      REDIS_HOST: ${REDIS_HOST:-infrabox-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CORE_URL:   ${CORE_URL:-}          # порожній = майстер екранів; заданий = репліка
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build: ./frontend
    container_name: infrabox-web
    restart: unless-stopped
    networks:
      - infrabox-net
    ports:
      - "80:80"     # HTTP → redirect to HTTPS
      - "443:443"   # HTTPS — єдина зовнішня точка входу
    volumes:
      - ./frontend/html:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/ssl:/etc/nginx/ssl:ro

networks:
  infrabox-net:
    external: true
