<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrabox — Обладнання</title>
    <script>window.REQUIRED_ROLE = "admin";</script>
    <script src="/auth.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117; color: #c9d1d9;
            font-family: system-ui, sans-serif; font-size: 14px;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* ── header ─────────────────────────────────────────────── */
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; background: #161b22; border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }
        .logo { font-size: 16px; font-weight: 600; color: #58a6ff; text-decoration: none; }
        .hdr-left  { display: flex; align-items: center; gap: 12px; }
        .hdr-right { display: flex; align-items: center; gap: 12px; }
        .hdr-title { font-size: 13px; color: #8b949e; }
        .hdr-user  { font-size: 12px; color: #8b949e; }
        .btn {
            padding: 5px 14px; border-radius: 6px; border: 1px solid #30363d;
            background: #21262d; color: #c9d1d9; font-size: 13px; cursor: pointer;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #30363d; }
        .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .btn-primary:hover { background: #388bfd; }

        /* ── layout ─────────────────────────────────────────────── */
        main {
            flex: 1; display: flex; min-height: 0;
        }

        /* left column — device list */
        .sidebar {
            width: 260px; flex-shrink: 0;
            background: #0d1117; border-right: 1px solid #30363d;
            display: flex; flex-direction: column;
        }
        .sidebar-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-bottom: 1px solid #21262d;
        }
        .sidebar-head .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; }
        .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }

        /* toggle "Редагувати" active state */
        .btn-toggle.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

        /* device row */
        .device-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 6px; cursor: pointer;
            border: 1px solid transparent;
        }
        .device-item:hover { background: #161b22; }
        .device-item.selected { background: #161b22; border-color: #30363d; }
        .device-main { flex: 1; min-width: 0; }
        .device-name { font-size: 13px; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .device-meta { font-size: 11px; color: #8b949e; }

        /* per-item CRUD actions — visible only in edit mode */
        .device-actions { display: none; gap: 4px; flex-shrink: 0; }
        .sidebar-list.editing .device-actions { display: flex; }
        .sidebar-list.editing .device-item { cursor: default; }
        .act {
            width: 26px; height: 26px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 6px; border: 1px solid #30363d; background: #21262d;
            color: #c9d1d9; font-size: 13px; cursor: pointer;
        }
        .act:hover { background: #30363d; }
        .act.danger:hover { background: #b62324; border-color: #f85149; color: #fff; }

        /* "add device" affordance — visible only in edit mode */
        .add-device {
            display: none; width: 100%; margin-top: 4px;
            padding: 9px 10px; border-radius: 6px;
            border: 1px dashed #30363d; background: transparent;
            color: #8b949e; font-size: 13px; cursor: pointer;
            align-items: center; justify-content: center; gap: 6px;
        }
        .sidebar-list.editing .add-device { display: flex; }
        .add-device:hover { border-color: #58a6ff; color: #58a6ff; }

        /* empty hint */
        .list-empty { padding: 16px 10px; font-size: 12px; color: #484f58; text-align: center; line-height: 1.5; }

        /* inline add-device form */
        .add-form { padding: 6px 4px 4px; }
        .add-input {
            width: 100%; padding: 8px 10px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; margin-bottom: 8px;
        }
        .add-input:focus { outline: none; border-color: #58a6ff; }
        .add-form-row { display: flex; gap: 6px; }
        .add-form-row .btn { flex: 1; justify-content: center; }
        .add-error { color: #f85149; font-size: 12px; margin-top: 8px; min-height: 14px; line-height: 1.4; }

        /* кнопки користувацьких блоків коду (ліва панель на вкладці «Код») */
        .block-btn { flex: 1; justify-content: flex-start; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

        /* right column — workspace */
        .workspace {
            flex: 1; min-height: 0; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .ws-toolbar {
            flex-shrink: 0; display: flex; align-items: center;
            gap: 12px; padding: 10px 24px; border-bottom: 1px solid #21262d;
        }
        .ws-tb-slot { flex: 1; display: flex; align-items: center; min-width: 0; }
        .ws-tb-left   { justify-content: flex-start; }
        .ws-tb-center { justify-content: center; }
        .ws-tb-right  { justify-content: flex-end; }
        .ws-tb-title  { font-size: 14px; font-weight: 600; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ws-content {
            flex: 1; overflow-y: auto; padding: 24px 32px;
            display: flex; flex-direction: column;
        }

        /* workspace head: device title + thematic tabs */
        .ws-head {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #21262d;
        }
        .ws-title { font-size: 18px; font-weight: 600; color: #e6edf3; }
        .ws-tabs  { display: flex; gap: 8px; }
        .ws-tab {
            padding: 6px 16px; border-radius: 6px; border: 1px solid #30363d;
            background: #21262d; color: #c9d1d9; font-size: 13px; cursor: pointer;
        }
        .ws-tab:hover { background: #30363d; }
        .ws-tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .ws-body { flex: 1; }
        .ws-placeholder { color: #8b949e; font-size: 13px; line-height: 1.6; }

        /* overview — усе одразу: опис, схема, код */
        .ov-grid  { display: flex; flex-direction: column; gap: 16px; max-width: 760px; }
        .ov-block { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px 20px; }
        .ov-block h3 {
            font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
            color: #8b949e; font-weight: 600; margin-bottom: 12px;
        }
        .ov-desc  { font-size: 13px; color: #c9d1d9; line-height: 1.6; white-space: pre-wrap; }
        .ov-muted { font-size: 13px; color: #484f58; }
        .ov-scheme-img { max-width: 100%; display: block; border: 1px solid #30363d; border-radius: 8px; }
        .ov-scheme-empty {
            height: 160px; border: 1px dashed #30363d; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #484f58; font-size: 13px;
        }
        .dl-link {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 6px;
            background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
            font-size: 13px; text-decoration: none;
        }
        .dl-link:hover { background: #30363d; border-color: #58a6ff; color: #58a6ff; }

        /* thematic editors */
        .editor { max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
        .editor-text {
            width: 100%; min-height: 300px; resize: vertical;
            padding: 14px 16px; border-radius: 10px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-family: inherit; font-size: 13px; line-height: 1.6;
        }
        .editor-text:focus { outline: none; border-color: #58a6ff; }
        .editor-actions { display: flex; align-items: center; gap: 12px; }
        .editor-status { font-size: 13px; color: #3fb950; }
        .editor-status.err { color: #f85149; }

        /* scheme editor — вибір апаратного забезпечення */
        .scheme-editor { max-width: 760px; display: flex; flex-direction: column; gap: 22px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; font-weight: 600; }
        .hw-select {
            max-width: 440px; padding: 10px 12px; border-radius: 8px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 13px;
        }
        .hw-select:focus { outline: none; border-color: #58a6ff; }

        .img-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .img-cell {
            width: 200px; height: 150px; border-radius: 8px; border: 1px solid #30363d;
            background: #e9e2f5;                       /* світло-бузковий фон */
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .img-cell img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
        .img-pick { display: flex; flex-direction: column; gap: 6px; }
        .pick-lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #c9d1d9; cursor: pointer; }
        .pick-lbl input { width: 15px; height: 15px; }

        /* lightbox */
        .lightbox {
            position: fixed; inset: 0; z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 32px;
            background: rgba(1,4,9,.85); cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; background: #e9e2f5; }

        /* pins table — задіяні порти */
        .pins-wrap { border: 1px solid #30363d; border-radius: 10px; overflow-x: auto; }
        .pins-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .pins-table th {
            text-align: left; padding: 10px 12px; background: #161b22;
            color: #8b949e; font-weight: 600; font-size: 12px;
            text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #30363d;
        }
        .pins-table td { padding: 6px 8px; border-bottom: 1px solid #21262d; vertical-align: middle; }
        .pins-table tr:last-child td { border-bottom: none; }
        .pins-table td:last-child, .pins-table th:last-child { width: 44px; text-align: center; }
        .pins-empty { color: #484f58; text-align: center; padding: 16px !important; }
        .cell-inp, .cell-sel {
            width: 100%; padding: 7px 9px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; font-family: inherit;
        }
        .cell-inp:focus, .cell-sel:focus { outline: none; border-color: #58a6ff; }
        .cell-fn { font-size: 13px; color: #484f58; padding: 2px 4px; line-height: 1.4; }
        .cell-sel[data-f="pin"] { min-width: 110px; }
        .cell-sel[data-f="function"] { min-width: 150px; }
        .cell-txt {
            width: 100%; min-width: 200px; padding: 7px 9px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; font-family: inherit; line-height: 1.4;
            resize: vertical; overflow: hidden; min-height: 34px; display: block;
        }
        .cell-txt:focus { outline: none; border-color: #58a6ff; }

        /* program editor — конфігурація формування коду */
        .program-editor { max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
        .inp {
            width: 100%; max-width: 440px; padding: 10px 12px; border-radius: 8px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; font-family: inherit;
        }
        .inp:focus { outline: none; border-color: #58a6ff; }
        .cfg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; max-width: 640px; }
        .cfg-grid .inp { max-width: none; }
        .chk {
            display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
            color: #c9d1d9; text-transform: none; letter-spacing: 0; font-weight: 400;
        }
        .chk input { width: 16px; height: 16px; }
        select.inp { max-width: none; }

        /* логічні зони конфігурації */
        .config-section {
            background: #161b22; border: 1px solid #30363d; border-radius: 10px;
            padding: 18px 20px; display: flex; flex-direction: column; gap: 16px;
        }
        .section-title { font-size: 13px; font-weight: 600; color: #e6edf3; }
        .sig-zones { display: flex; flex-direction: column; gap: 14px; }
        .sig-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 10px;
            padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
        }
        .sig-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .sig-title { font-size: 14px; font-weight: 600; color: #e6edf3; }
        .sig-del { padding: 4px 10px; font-size: 12px; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

        /* редактор коду */
        .code-editor { display: flex; flex-direction: column; gap: 14px; }
        .code-palette { display: flex; flex-wrap: wrap; gap: 8px; }

        /* overlay-редактор із підсвіткою синтаксису */
        .ce-wrap { position: relative; height: 460px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
        .ce-wrap.modal-ce { height: 60vh; }
        .ce-wrap:focus-within { border-color: #58a6ff; }
        .ce-hl, .ce-ta {
            margin: 0; position: absolute; inset: 0; box-sizing: border-box;
            padding: 14px 16px; border: 0;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px; line-height: 1.5; white-space: pre; overflow: auto; tab-size: 2;
        }
        .ce-hl { z-index: 1; pointer-events: none; color: #e6edf3; background: #0d1117; }
        .ce-hl code { font: inherit; }
        .ce-ta { z-index: 2; background: transparent; color: transparent; caret-color: #e6edf3; resize: none; }
        .ce-ta:focus { outline: none; }
        /* токени підсвітки */
        .tok-cm  { color: #8b949e; font-style: italic; }
        .tok-pp  { color: #ff7b72; }
        .tok-str { color: #a5d6ff; }
        .tok-num { color: #79c0ff; }
        .tok-kw  { color: #ff7b72; }
        .tok-bi  { color: #d2a8ff; }

        /* рядок користувацького блоку в лівій панелі */
        .block-row { display: flex; gap: 4px; margin-bottom: 6px; }

        /* модалка редагування блоку */
        .modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(1,4,9,.7); padding: 24px; }
        .modal-box { width: min(880px, 95vw); max-height: 92vh; display: flex; flex-direction: column; gap: 14px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 18px 20px; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .modal-title { font-size: 15px; font-weight: 600; color: #e6edf3; }
        #blockModalEditor { overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        /* секція у модалці вкраплення */
        .sec-inject { display: flex; flex-direction: column; gap: 8px; }
        .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .sec-label { font-size: 13px; font-weight: 600; color: #e6edf3; }
        .ce-wrap.sec-ce { height: 140px; }

        /* empty states */
        .empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            text-align: center; color: #484f58;
        }
        .empty .icon  { font-size: 52px; opacity: .3; }
        .empty .title { font-size: 16px; font-weight: 600; color: #8b949e; }
        .empty .sub   { font-size: 13px; max-width: 340px; line-height: 1.5; }
    </style>
</head>
<body>

<header>
    <div class="hdr-left">
        <a class="logo" href="/">⬡ Infrabox</a>
        <span class="hdr-title">Конструктор обладнання</span>
    </div>
    <div class="hdr-right">
        <span class="hdr-user" id="headerUser"></span>
        <a class="btn" href="/constructor">← Конструктор</a>
        <button class="btn" onclick="authLogout()">Вийти</button>
    </div>
</header>

<main>
    <!-- ── ліва колонка: перелік пристроїв ─────────────────────── -->
    <aside class="sidebar" id="deviceSidebar">
        <div class="sidebar-head">
            <span class="lbl">Пристрої</span>
            <button class="btn btn-toggle" id="btnEdit" title="Редагувати список">✎ Редагувати</button>
        </div>
        <div class="sidebar-list" id="deviceList">
            <!-- список пристроїв рендериться скриптом -->
        </div>
    </aside>

    <!-- ── ліва колонка (на вкладці «Код»): користувацькі блоки ─── -->
    <aside class="sidebar" id="codeSidebar" style="display:none">
        <div class="sidebar-head">
            <span class="lbl">Блоки коду</span>
            <button class="btn btn-primary" id="btnNewBlock" title="Створити блок">＋ Новий блок</button>
        </div>
        <div class="sidebar-list" id="blockList">
            <!-- користувацькі блоки рендеряться скриптом -->
        </div>
    </aside>

    <!-- ── права колонка: робочий простір ──────────────────────── -->
    <section class="workspace">
        <div class="ws-toolbar">
            <div class="ws-tb-slot ws-tb-left" id="wsTbLeft"></div>
            <div class="ws-tb-slot ws-tb-center" id="wsTbCenter"></div>
            <div class="ws-tb-slot ws-tb-right"><a class="btn" href="/constructor-knowledge">📚 База знань</a></div>
        </div>
        <div class="ws-content" id="wsContent">
            <!-- вміст рендериться скриптом -->
        </div>
    </section>
</main>

<!-- збільшене зображення -->
<div class="lightbox" id="lightbox"><img alt="Зображення"></div>

<!-- редагування коду блоку -->
<div class="modal" id="blockModal" style="display:none">
    <div class="modal-box">
        <div class="modal-head">
            <span class="modal-title" id="blockModalTitle">Блок</span>
            <button class="btn" id="blockModalClose" title="Закрити">✕</button>
        </div>
        <div id="blockModalEditor"></div>
        <div class="form-actions">
            <button class="btn btn-primary" id="btnBlockSave">💾 Зберегти</button>
            <button class="btn" id="btnBlockCancel">Скасувати</button>
            <span class="editor-status" id="blockModalStatus"></span>
        </div>
    </div>
</div>

<script>
    // ── ім'я користувача в хедері ──────────────────────────────
    document.getElementById("headerUser").textContent =
        authUser().display_name || authUser().role;

    // ── стан ───────────────────────────────────────────────────
    const API      = "/lowlevel/api";
    let devices    = [];       // завантажуються з бекенду
    let selectedId = null;
    let editMode   = false;
    let adding     = false;    // показана inline-форма додавання

    // ── обгортка над fetch (auth + помилки) ─────────────────────
    async function apiJson(method, path, body) {
        const opts = { method, headers: { ...authHeaders() } };
        if (body !== undefined) {
            opts.headers["Content-Type"] = "application/json";
            opts.body = JSON.stringify(body);
        }
        const r = await fetch(API + path, opts);
        if (!r.ok) {
            let msg = "Помилка " + r.status;
            try { const j = await r.json(); if (j.detail) msg = j.detail; } catch {}
            throw new Error(msg);
        }
        const ct = r.headers.get("content-type") || "";
        return ct.includes("application/json") ? r.json() : null;
    }

    async function loadDevices() {
        try {
            const data = await apiJson("GET", "/devices");
            devices = data.devices || [];
        } catch (e) {
            devices = [];
            console.error("loadDevices:", e.message);
        }
        if (selectedId && !devices.find(d => d.id === selectedId)) {
            selectedId = null; editorSection = null;
        }
        renderDeviceList();
        renderWorkspace();
    }

    const listEl = document.getElementById("deviceList");
    const btnEdit = document.getElementById("btnEdit");
    const wsEl   = document.getElementById("wsContent");
    const boardLabel = { esp32: "ESP32", esp8266: "ESP8266" };

    // тематичні розділи пристрою: кнопки → сторінки редагування
    let editorSection = null;   // null = оглядове поле; інакше id відкритого редактора
    const SECTIONS = [
        { id: "desc",    label: "Опис" },
        { id: "scheme",  label: "Схема" },
        { id: "program", label: "Програма" },
        { id: "code",    label: "Код" },
    ];

    // ── рендер списку пристроїв ─────────────────────────────────
    function renderDeviceList() {
        listEl.classList.toggle("editing", editMode);
        listEl.innerHTML = "";

        if (devices.length === 0) {
            const empty = document.createElement("div");
            empty.className = "list-empty";
            empty.textContent = editMode
                ? "Ще немає пристроїв. Натисніть «Додати пристрій»."
                : "Ще немає пристроїв.";
            listEl.appendChild(empty);
        }

        for (const d of devices) {
            const item = document.createElement("div");
            item.className = "device-item" + (d.id === selectedId ? " selected" : "");
            item.innerHTML = `
                <div class="device-main">

    // вставка тексту блоку в основний код (за курсором)
    function insertIntoCode(text) {
        const area = document.getElementById("codeArea");
        if (!area) return;
        const start = area.selectionStart ?? area.value.length;
        const end   = area.selectionEnd ?? area.value.length;
        area.value = area.value.slice(0, start) + text + area.value.slice(end);
        const pos = start + text.length;
        area.selectionStart = area.selectionEnd = pos;
        area.dispatchEvent(new Event("input"));   // оновити підсвітку
        area.focus();
    }

    // ── секції основної програми (для посекторного вкраплення) ──
    const CODE_SECTIONS = [
        { id: "includes",  label: "Includes",  header: "// --- Includes ---" },
        { id: "config",    label: "Конфіг",    header: "// --- Конфіг ---" },
        { id: "globals",   label: "Глобальні", header: "// --- Глобальні ---" },
        { id: "functions", label: "Функції",   header: "// --- Функції ---" },
        { id: "setup",     label: "setup()",   func: "setup" },
        { id: "loop",      label: "loop()",    func: "loop" },
    ];

    // кінець top-level секції = початок наступного маркера секції
    function topSectionEnd(text, sectionId) {
        const sec = CODE_SECTIONS.find(s => s.id === sectionId);
        const start = text.indexOf(sec.header);
        if (start < 0) return -1;
        const after = start + sec.header.length;
        let end = text.length;
        CODE_SECTIONS.forEach(s => {
            let pos = -1;
            if (s.header) pos = text.indexOf(s.header, after);
            else if (s.func) {
                const m = new RegExp("void\\s+" + s.func + "\\s*\\(").exec(text.slice(after));
                if (m) pos = after + m.index;
            }
            if (pos >= 0 && pos < end) end = pos;
        });
        return end;
    }

    // індекс закривної } тіла функції (setup/loop)
    function funcBodyEnd(text, funcName) {
        const m = new RegExp("void\\s+" + funcName + "\\s*\\([^)]*\\)\\s*\\{").exec(text);
        if (!m) return -1;
        let i = m.index + m[0].length, depth = 1;
        while (i < text.length && depth > 0) {
            const ch = text[i];
            if (ch === "{") depth++;
            else if (ch === "}") { depth--; if (depth === 0) return i; }
            i++;
        }
        return -1;
    }

    // вкраплення фрагмента в кінець секції основного коду
    function injectIntoSection(sectionId, fragment) {
        const area = document.getElementById("codeArea");
        if (!area) return false;
        const frag = String(fragment || "").replace(/\s+$/, "");
        if (!frag.trim()) return false;
        const sec = CODE_SECTIONS.find(s => s.id === sectionId);
        let text = area.value;

        if (sec.func) {
            const idx = funcBodyEnd(text, sec.func);
            if (idx < 0) { alert(`Секцію «${sec.label}» не знайдено — спершу вставте блок «${sec.label}».`); return false; }
            const indented = frag.split("\n").map(l => l ? "  " + l : l).join("\n");
            const before = text.slice(0, idx).replace(/[ \t]*$/, "");
            const nl = before.endsWith("\n") ? "" : "\n";
            text = before + nl + indented + "\n" + text.slice(idx);
        } else {
            const idx = topSectionEnd(text, sectionId);
            if (idx < 0) { alert(`Секцію «${sec.label}» не знайдено — спершу вставте блок «${sec.label}».`); return false; }
            const before = text.slice(0, idx).replace(/\s+$/, "");
            text = before + "\n" + frag + "\n\n" + text.slice(idx);
        }
        area.value = text;
        area.dispatchEvent(new Event("input"));
        return true;
    }

    // ── підсвітка синтаксису (Arduino/C, самодостатня) ──────────
    const CODE_KW = new Set(["void","int","float","double","bool","boolean","char","byte","word","long","short","unsigned","signed","const","constexpr","static","volatile","if","else","for","while","do","switch","case","default","break","continue","return","true","false","null","NULL","struct","class","enum","typedef","new","delete","sizeof","public","private","uint8_t","uint16_t","uint32_t","uint64_t","int8_t","int16_t","int32_t","size_t","String"]);
    const CODE_BI = new Set(["setup","loop","pinMode","digitalWrite","digitalRead","analogRead","analogWrite","delay","delayMicroseconds","millis","micros","Serial","attachInterrupt","digitalPinToInterrupt","HIGH","LOW","INPUT","OUTPUT","INPUT_PULLUP","RISING","FALLING","CHANGE","WiFi","PubSubClient"]);

    function highlightCode(src) {
        const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const rules = [
            [/^\/\/[^\n]*/,            "cm"],
            [/^\/\*[\s\S]*?\*\//,      "cm"],
            [/^"(?:\\.|[^"\\])*"/,     "str"],
            [/^'(?:\\.|[^'\\])*'/,     "str"],
            [/^\d[\d.xXa-fA-F]*/,      "num"],
            [/^[A-Za-z_]\w*/,          "word"],
        ];
        let out = "", i = 0;
        while (i < src.length) {
            const rest = src.slice(i);
            // препроцесор — лише на початку рядка
            if ((i === 0 || src[i - 1] === "\n")) {
                const pp = rest.match(/^[ \t]*#[^\n]*/);
                if (pp) { out += `<span class="tok-pp">${esc(pp[0])}</span>`; i += pp[0].length; continue; }
            }
            let matched = false;
            for (const [re, cls] of rules) {
                const m = rest.match(re);
                if (m) {
                    let text = m[0], klass = cls;
                    if (cls === "word") klass = CODE_KW.has(text) ? "kw" : (CODE_BI.has(text) ? "bi" : null);
                    out += klass ? `<span class="tok-${klass}">${esc(text)}</span>` : esc(text);
                    i += text.length; matched = true; break;
                }
            }
            if (!matched) { out += esc(src[i]); i++; }
        }
        return out;
    }

    // overlay-редактор коду: textarea (прозорий) + <pre> з підсвіткою
    function buildCodeArea(value) {
        const wrap = document.createElement("div");
        wrap.className = "ce-wrap";
        const pre = document.createElement("pre");
        pre.className = "ce-hl";
        pre.setAttribute("aria-hidden", "true");
        const code = document.createElement("code");
        pre.appendChild(code);
        const ta = document.createElement("textarea");
        ta.className = "ce-ta";
        ta.spellcheck = false;
        ta.value = value || "";
        wrap.appendChild(pre);
        wrap.appendChild(ta);

        const sync = () => { code.innerHTML = highlightCode(ta.value) + "\n"; };
        ta.addEventListener("input", sync);
        ta.addEventListener("scroll", () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
        ta.addEventListener("keydown", (e) => {
            if (e.key === "Tab") {
                e.preventDefault();
                const s = ta.selectionStart, en = ta.selectionEnd;
                ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(en);
                ta.selectionStart = ta.selectionEnd = s + 2;
                sync();
            }
        });
        sync();
        return { el: wrap, textarea: ta, getValue: () => ta.value };
    }

    function renderBlockList() {
        const list = document.getElementById("blockList");
        if (!list) return;
        const dev = devices.find(x => x.id === selectedId);
        const blocks = (dev && dev.code_blocks) || [];
        list.innerHTML = "";
        if (blocks.length === 0) {
            list.innerHTML = `<div class="list-empty">Блоків ще немає. Натисніть «＋ Новий блок».</div>`;
            return;
        }
        blocks.forEach((b, i) => {
            const row = document.createElement("div");
            row.className = "block-row";
            row.innerHTML = `
                <button class="btn block-btn" data-act="open" title="Відкрити (вкраплення по секціях)">${escapeHtml(b.name || "(без назви)")}</button>
                <button class="act danger" data-act="del" title="Видалити блок">🗑</button>`;
            row.querySelector('[data-act="open"]').addEventListener("click", () => openBlockModal(i));
            row.querySelector('[data-act="del"]').addEventListener("click", () => deleteCodeBlock(i));
            list.appendChild(row);
        });
    }

    async function saveCodeBlocks(blocks) {
        const dev = devices.find(x => x.id === selectedId);
        if (!dev) return null;
        const updated = await apiJson("PUT", `/devices/${encodeURIComponent(dev.id)}/code_blocks`, { blocks });
        const i = devices.findIndex(x => x.id === updated.id);
        if (i >= 0) devices[i] = updated;
        return updated;
    }

    async function newCodeBlock() {
        const dev = devices.find(x => x.id === selectedId);
        if (!dev) return;
        const name = (prompt("Назва блоку:") || "").trim();
        if (!name) return;
        const blocks = (dev.code_blocks || []).concat([{ name, sections: {} }]);
        try { await saveCodeBlocks(blocks); renderBlockList(); }
        catch (e) { alert(e.message); }
    }

    async function deleteCodeBlock(index) {
        const dev = devices.find(x => x.id === selectedId);
        if (!dev) return;
        const blocks = dev.code_blocks || [];
        const b = blocks[index];
        if (!b) return;
        if (!confirm(`Видалити блок «${b.name || ""}»?`)) return;
        try { await saveCodeBlocks(blocks.filter((_, j) => j !== index)); renderBlockList(); }
        catch (e) { alert(e.message); }
    }

    // модалка блоку: фрагменти по секціях + кнопка «Вставити» на кожну секцію
    function openBlockModal(index) {
        const dev = devices.find(x => x.id === selectedId);
        const blocks = (dev && dev.code_blocks) || [];
        const b = blocks[index];
        if (!b) return;

        document.getElementById("blockModalTitle").textContent = "Блок: " + (b.name || "");
        const host = document.getElementById("blockModalEditor");
        host.innerHTML = "";
        const bsecs = b.sections || {};
        const editors = {};
        CODE_SECTIONS.forEach(sec => {
            const wrap = document.createElement("div");
            wrap.className = "sec-inject";
            const head = document.createElement("div");
            head.className = "sec-head";
            head.innerHTML = `<span class="sec-label">${sec.label}</span>
                <button class="btn" data-inject="${sec.id}">↳ Вставити в ${sec.label}</button>`;
            const ed = buildCodeArea(bsecs[sec.id] || "");
            ed.el.classList.add("sec-ce");
            wrap.appendChild(head);
            wrap.appendChild(ed.el);
            host.appendChild(wrap);
            editors[sec.id] = ed;
            head.querySelector("[data-inject]").addEventListener("click", () => injectIntoSection(sec.id, ed.getValue()));
        });

        const modal  = document.getElementById("blockModal");
        const status = document.getElementById("blockModalStatus");
        status.className = "editor-status"; status.textContent = "";
        modal.style.display = "flex";

        const close = () => { modal.style.display = "none"; };
        document.getElementById("blockModalClose").onclick = close;
        document.getElementById("btnBlockCancel").onclick  = close;
        document.getElementById("btnBlockSave").onclick = async () => {
            status.className = "editor-status"; status.textContent = "Збереження…";
            const sections = {};
            CODE_SECTIONS.forEach(sec => sections[sec.id] = editors[sec.id].getValue());
            const updated = blocks.map((x, j) => j === index ? { name: x.name, sections } : x);
            try { await saveCodeBlocks(updated); renderBlockList(); status.textContent = "✓ Збережено"; }
            catch (e) { status.className = "editor-status err"; status.textContent = e.message; }
        };
    }

    function renderWorkspace() {
        const d = devices.find(x => x.id === selectedId);

            <button class="dl-link" data-edit="code">⬇ Код пристрою</button>

    // сторінка редагування розділу (опис / схема / програма / код)
    function renderEditor(d, section) {
        const label = (SECTIONS.find(s => s.id === section) || {}).label || section;
        // панель: ← Назад (зліва) | назва (центр) | База знань (справа)
        setToolbar(
            `<button class="btn" id="btnBackOverview">← Назад</button>`,
            `<span class="ws-tb-title">${escapeHtml(d.name)} — ${label}</span>`
        );
        document.getElementById("btnBackOverview")
            .addEventListener("click", () => { editorSection = null; renderWorkspace(); });

        const body = document.getElementById("wsBody");
        if (section === "desc")    return renderDescEditor(d, body);
        if (section === "scheme")  return renderSchemeEditor(d, body);
        if (section === "program") return renderProgramEditor(d, body);
        if (section === "code")    return renderCodeEditor(d, body);

    }

    // хелпер-коментар: налаштування Arduino IDE + зведення конфігурації
    function buildHelperComment(d, ctx) {
        const oneLine = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
        const prog = d.program || {};
        const wifi = prog.wifi || {};
        const mqtt = prog.mqtt || {};
        const platform = (ctx && ctx.platform) || "";
        const ctype = (ctx && ctx.controllerType) || "";
        const modeLbl = { input: "вхід", output: "вихід", hiz: "високий опір" };
        const typeLbl = { analog_in: "аналоговий вхід", discrete_in: "дискретний вхід", control_out: "керуючий вихід" };
        const sep = "=".repeat(58), dash = "-".repeat(58);

        const L = ["/* " + sep];
        // ── налаштування Arduino IDE (меню «Інструменти») ──
        L.push(" *  Налаштування Arduino IDE (меню «Інструменти»):");
        if (ctype) L.push(" *    Контролер: " + oneLine(ctype));
        if (platform === "esp8266") {
            L.push(" *    Плата: NodeMCU 1.0 (ESP-12E) / Generic ESP8266");
            L.push(" *    Частота CPU: 80 MHz");
            L.push(" *    Flash Size: 4MB" + (prog.ota ? " (FS:2MB — з розділом OTA)" : " (FS:2MB)"));
            L.push(" *    Upload Speed: 115200");
        } else {
            L.push(" *    Плата: ESP32 Dev Module (варіант під ваш контролер)");
            L.push(" *    Частота CPU: 240 MHz");
            L.push(" *    Flash: QIO, 80 MHz, 4MB");
            L.push(" *    Схема пам'яті (Partition): Default 4MB with spiffs" + (prog.ota ? " (з розділом OTA)" : ""));
            L.push(" *    Upload Speed: 921600");
            if (!platform) L.push(" *    (платформа не вказана — показано типові для ESP32)");
        }
        L.push(" * " + dash);
        L.push(" *  Пристрій: " + oneLine(d.name || d.id));
        if (prog.purpose) L.push(" *  Призначення: " + oneLine(prog.purpose));
        L.push(" *  Підключення: " + (prog.connection === "ethernet" ? "Ethernet (шилд)" : "WiFi"));
        if ((prog.connection || "wifi") === "wifi") {
            L.push(" *  WiFi SSID: " + oneLine(wifi.ssid || ""));
            L.push(" *  WiFi пароль: " + oneLine(wifi.pass || ""));
        }
        L.push(" *  MQTT: " + oneLine(mqtt.host || "") + ":" + (mqtt.port || 1883) + ", client=" + oneLine(mqtt.client_id || d.id));
        L.push(" *  OTA: " + (prog.ota ? "так" : "ні"));

        const pins = d.pins || [];
        if (pins.length) {
            L.push(" * " + dash, " *  Задіяні порти:");
            pins.forEach(p => L.push(" *    " + [oneLine(p.pin), oneLine(p.function), oneLine(p.purpose), modeLbl[p.mode] || oneLine(p.mode)].filter(Boolean).join(" | ")));
        }

        const sigs = prog.signals || [];
        if (sigs.length) {
            L.push(" * " + dash, " *  Сигнали:");
            sigs.forEach(s => {
                const t = typeLbl[s.type] || s.type;
                const poll = s.poll === "interrupt" ? "переривання" : `таймер ${s.interval_ms || 1000}мс`;
                L.push(" *    [" + t + "] " + oneLine(s.pin || "?") + " -> точка " + (s.point_id ?? "?") + " (" + poll + ")");
            });
        }

        const custom = prog.custom || [];
        if (custom.length) {
            L.push(" * " + dash, " *  Додатковий функціонал:");
            custom.forEach(c => {
                const pinList = (c.pins || []).map(p => oneLine(p.pin) + (p.comment ? ` (${oneLine(p.comment)})` : "")).filter(Boolean).join(", ");
                L.push(" *    " + oneLine(c.name || "(без назви)") + (pinList ? ": " + pinList : ""));
            });
        }

        L.push(" * " + sep + " */");
        return L.join("\n") + "\n\n";
    }

    // "GPIO4" -> 4, "IO34" -> 34, "4" -> 4
    function pinToNumber(pin) {
        const m = String(pin || "").match(/\d+/);
        return m ? parseInt(m[0]) : null;
    }
    const cstr = s => String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    const sigTag = s => (s.point_id != null && s.point_id !== "") ? s.point_id : "x";

    // блок «Includes» — за платформою контролера, типом підключення, OTA
    function buildIncludesBlock(d, ctx) {
        const platform = (ctx && ctx.platform) || "";
        const prog = d.program || {};
        const conn = prog.connection || "wifi";
        const L = ["// --- Includes ---"];
        if (conn === "ethernet") {
            L.push("#include <SPI.h>");
            L.push("#include <Ethernet.h>");
        } else if (platform === "esp8266") {
            L.push("#include <ESP8266WiFi.h>");
        } else {
            if (!platform) L.push("// платформа не вказана — використано WiFi.h (ESP32)");
            L.push("#include <WiFi.h>");
        }
        L.push("#include <PubSubClient.h>");
        if (prog.ota) {
            if (platform === "esp8266") {
                L.push("#include <ESP8266mDNS.h>");
                L.push("#include <WiFiUdp.h>");
            }
            L.push("#include <ArduinoOTA.h>");
        }
        return L.join("\n") + "\n\n";
    }

    // блок «Конфіг» — параметри підставляються з налаштувань пристрою
    function buildConfigBlock(d) {
        const prog = d.program || {};
        const wifi = prog.wifi || {};
        const mqtt = prog.mqtt || {};
        const q = s => String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
        const L = ["// --- Конфіг ---"];
        if ((prog.connection || "wifi") === "wifi") {
            L.push(`const char* WIFI_SSID = "${q(wifi.ssid)}";`);
            L.push(`const char* WIFI_PASS = "${q(wifi.pass)}";`);
        }
        L.push(`const char* MQTT_HOST = "${q(mqtt.host || "homeServ2.local")}";`);
        L.push(`const uint16_t MQTT_PORT = ${parseInt(mqtt.port) || 1883};`);
        L.push(`const char* MQTT_CLIENT_ID = "${q(mqtt.client_id || d.id)}";`);
        return L.join("\n") + "\n\n";
    }

    // блок «Глобальні» — мережевий клієнт + MQTT + оголошення сигналів
    function buildGlobalsBlock(d, ctx) {
        const prog = d.program || {};
        const conn = prog.connection || "wifi";
        const pts  = (ctx && ctx.pointsById) || {};
        const L = ["// --- Глобальні ---"];
        L.push(conn === "ethernet" ? "EthernetClient net;" : "WiFiClient net;");
        L.push("PubSubClient mqtt(net);");

        const sigs = prog.signals || [];
        sigs.forEach(s => {
            const pid = s.point_id;
            const tag = sigTag(s);
            const num = pinToNumber(s.pin);
            const p = pts[pid];
            const topic = p ? `${p.object}/${p.system}/${p.pointname}/${p.id}` : `?/?/?/${pid}`;
            L.push("");
            L.push(`// сигнал: ${s.pin || "?"} -> точка ${pid ?? "?"}`);
            if (num != null) L.push(`const int PIN_${tag} = ${num};`);
            L.push(`const char* TOPIC_${tag} = "${cstr(topic)}";`);
            L.push(`int last_${tag} = -1;`);
            if (s.poll === "timer") L.push(`unsigned long lastPoll_${tag} = 0;`);
            else                    L.push(`volatile bool flag_${tag} = false;`);
        });
        return L.join("\n") + "\n\n";
    }

    // блок «Функції» — стандартні хелпери Infrabox + ISR для переривань
    function buildFunctionsBlock(d, ctx) {
        const irq = (d.program && d.program.signals || []).filter(s => s.poll === "interrupt");
        const L = ["// --- Функції ---"];
        L.push("void ensureMqtt() {");
        L.push("  if (!mqtt.connected()) mqtt.connect(MQTT_CLIENT_ID);");
        L.push("}");
        L.push("");
        L.push("void publishPoint(const char* topic, int id, int value) {");
        L.push("  char payload[64];");
        L.push('  snprintf(payload, sizeof(payload), "{\\"id\\":%d,\\"value\\":%d,\\"ts\\":%lu}", id, value, millis() / 1000);');
        L.push("  mqtt.publish(topic, payload);");
        L.push("}");
        irq.forEach(s => {
            const tag = sigTag(s);
            L.push("");
            L.push(`void IRAM_ATTR isr_${tag}() { flag_${tag} = true; }`);
        });
        return L.join("\n") + "\n\n";
    }

    // блок «setup()» — підключення, MQTT, OTA, піни/переривання
    function buildSetupBlock(d, ctx) {
        const prog = d.program || {};
        const conn = prog.connection || "wifi";
        const sigs = prog.signals || [];
        const L = ["void setup() {", "  Serial.begin(115200);", ""];
        if (conn === "ethernet") {
            L.push("  byte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };");
            L.push("  Ethernet.begin(mac);   // DHCP");
        } else {
            L.push("  WiFi.begin(WIFI_SSID, WIFI_PASS);");
            L.push('  while (WiFi.status() != WL_CONNECTED) { delay(500); Serial.print("."); }');
            L.push('  Serial.println("\\nWiFi OK");');
        }
        L.push("  mqtt.setServer(MQTT_HOST, MQTT_PORT);");
        if (prog.ota) {
            L.push("  ArduinoOTA.setHostname(MQTT_CLIENT_ID);");
            L.push("  ArduinoOTA.begin();");
        }
        if (sigs.length) {
            L.push("");
            sigs.forEach(s => {
                const tag = sigTag(s);
                L.push(`  pinMode(PIN_${tag}, INPUT);`);
                if (s.poll === "interrupt")
                    L.push(`  attachInterrupt(digitalPinToInterrupt(PIN_${tag}), isr_${tag}, CHANGE);`);
            });
        }
        L.push("}");
        return L.join("\n") + "\n\n";
    }

    // блок «loop()» — MQTT keepalive, опитування дискретів, публікація
    function buildLoopBlock(d, ctx) {
        const prog = d.program || {};
        const sigs = prog.signals || [];
        const L = ["void loop() {"];
        if (prog.ota) L.push("  ArduinoOTA.handle();");
        L.push("  ensureMqtt();");
        L.push("  mqtt.loop();");
        if (sigs.length) L.push("  unsigned long now = millis();");
        sigs.forEach(s => {
            const tag = sigTag(s);
            const pid = (s.point_id != null && s.point_id !== "") ? s.point_id : 0;
            L.push("");
            if (s.poll === "interrupt") {
                L.push(`  if (flag_${tag}) {`);
                L.push(`    flag_${tag} = false;`);
            } else {
                const iv = parseInt(s.interval_ms) || 1000;
                L.push(`  if (now - lastPoll_${tag} >= ${iv}) {`);
                L.push(`    lastPoll_${tag} = now;`);
            }
            L.push(`    int v = digitalRead(PIN_${tag});`);
            L.push(`    if (v != last_${tag}) {`);
            L.push(`      last_${tag} = v;`);
            L.push(`      publishPoint(TOPIC_${tag}, ${pid}, v);`);
            L.push("    }");
            L.push("  }");
        });
        L.push("}");
        return L.join("\n") + "\n\n";
    }

            <div class="scheme-editor">
                <div class="field">
                    <label>Апаратне забезпечення</label>
                    <select class="hw-select" id="hwSelect">${options}</select>
                    <span class="editor-status" id="hwStatus"></span>
                </div>
                ${kbHint}
                <div id="hwPreview"></div>

                <div class="field">
                    <label>Задіяні порти</label>
                    <div class="pins-wrap">
                        <table class="pins-table">
                            <thead><tr>
                                <th>Пін</th><th>Функціонал</th><th>Призначення</th><th>Режим</th><th></th>
                            </tr></thead>
                            <tbody id="pinsBody"></tbody>
                        </table>
                    </div>
                    <div><button class="btn" id="btnAddPin">＋ Додати рядок</button></div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" id="btnSavePins">💾 Зберегти порти</button>
                    <span class="editor-status" id="pinsStatus"></span>
                </div>
            </div>`;

        const sel      = document.getElementById("hwSelect");
        const statusEl = document.getElementById("hwStatus");

        sel.addEventListener("change", async () => {
            statusEl.className = "editor-status";
            statusEl.textContent = "Збереження…";
            try {
                const dev = await apiJson("PUT", `/devices/${encodeURIComponent(d.id)}/hardware`, { hardware: sel.value || null });
                const i = devices.findIndex(x => x.id === dev.id);
                if (i >= 0) devices[i] = dev;
                d = dev;
                statusEl.textContent = "✓ Збережено";
                renderHwPreview(sel.value, kbList, d);
                renderPinsTable();   // піни контролера змінились → оновити список у таблиці
            } catch (e) {
                statusEl.className = "editor-status err";
                statusEl.textContent = e.message;
            }
        });

        renderHwPreview(d.hardware, kbList, d);

        // ── таблиця задіяних портів ──────────────────────────────
        const MODES = [["", "—"], ["input", "Вхід"], ["output", "Вихід"], ["hiz", "Високий опір"]];
        let pins = (d.pins || []).map(p => ({
            pin: p.pin || "", function: p.function || "", purpose: p.purpose || "", mode: p.mode || ""
        }));

        function optionList(items, val) {
            return items.map(it => {
                const [v, l] = Array.isArray(it) ? it : [it, it || "—"];
                return `<option value="${escapeHtml(v)}"${v === (val || "") ? " selected" : ""}>${escapeHtml(l)}</option>`;
            }).join("");
        }

        // піни обраного контролера з бази знань
        function currentKbPins() {
            const eq = kbList.find(x => x.id === sel.value);
            return eq ? (eq.pins || []) : [];
        }
        // перелік конкретних функцій піна (розбитий з рядка функціоналу БЗ)
        function pinFunctions(kbPins, pinName) {
            const kp = kbPins.find(x => x.pin === pinName);
            if (!kp || !kp.function) return [];
            return kp.function.split(",").map(s => s.trim()).filter(Boolean);
        }
        function autoGrow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

        function renderPinsTable() {
            const kbPins = currentKbPins();
            const tb = document.getElementById("pinsBody");
            if (pins.length === 0) {
                tb.innerHTML = `<tr><td colspan="5" class="pins-empty">Портів не додано. Натисніть «Додати рядок».</td></tr>`;
                return;
            }
            tb.innerHTML = "";
            pins.forEach((p, i) => {
                // "Пін": список пінів контролера з БЗ (або текст, якщо їх нема)
                let pinCell;
                if (kbPins.length) {
                    const opts = [`<option value="">—</option>`].concat(
                        kbPins.map(kp => `<option value="${escapeHtml(kp.pin)}"${kp.pin === p.pin ? " selected" : ""}>${escapeHtml(kp.pin)}</option>`)
                    ).join("");
                    pinCell = `<select class="cell-sel" data-f="pin">${opts}</select>`;
                } else {
                    pinCell = `<input class="cell-inp" data-f="pin" value="${escapeHtml(p.pin)}" placeholder="напр. GPIO4">`;
                }

                // "Функціонал": одна конкретна функція з доступних для цього піна
                const fns = pinFunctions(kbPins, p.pin);
                let fnCell;
                if (fns.length) {
                    const opts = [`<option value="">—</option>`].concat(
                        fns.map(f => `<option value="${escapeHtml(f)}"${f === p.function ? " selected" : ""}>${escapeHtml(f)}</option>`)
                    ).join("");
                    fnCell = `<select class="cell-sel" data-f="function">${opts}</select>`;
                } else {
                    fnCell = `<div class="cell-fn">—</div>`;
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${pinCell}</td>
                    <td>${fnCell}</td>
                    <td><textarea class="cell-txt" data-f="purpose" rows="1" placeholder="призначення">${escapeHtml(p.purpose)}</textarea></td>
                    <td><select class="cell-sel" data-f="mode">${optionList(MODES, p.mode)}</select></td>
                    <td><button class="act danger" data-act="del" title="Видалити рядок">🗑</button></td>`;

                const pinEl = tr.querySelector('[data-f="pin"]');
                if (pinEl.tagName === "SELECT") {
                    pinEl.addEventListener("change", e => { pins[i].pin = e.target.value; pins[i].function = ""; renderPinsTable(); });
                } else {
                    pinEl.addEventListener("input", e => pins[i].pin = e.target.value);
                }
                const fnEl = tr.querySelector('[data-f="function"]');
                if (fnEl) fnEl.addEventListener("change", e => pins[i].function = e.target.value);
                const purposeEl = tr.querySelector('[data-f="purpose"]');
                purposeEl.addEventListener("input", e => { pins[i].purpose = e.target.value; autoGrow(e.target); });
                tr.querySelector('[data-f="mode"]').addEventListener("change", e => pins[i].mode = e.target.value);
                tr.querySelector('[data-act="del"]').addEventListener("click", () => { pins.splice(i, 1); renderPinsTable(); });
                tb.appendChild(tr);
                autoGrow(purposeEl);
            });
        }

        document.getElementById("btnAddPin").addEventListener("click", () => {
            pins.push({ pin: "", purpose: "", protocol: "", mode: "" });
            renderPinsTable();
        });

        document.getElementById("btnSavePins").addEventListener("click", async () => {
            const st = document.getElementById("pinsStatus");
            st.className = "editor-status"; st.textContent = "Збереження…";
            try {
                const dev = await apiJson("PUT", `/devices/${encodeURIComponent(d.id)}/pins`, { pins });
                const i = devices.findIndex(x => x.id === dev.id);
                if (i >= 0) devices[i] = dev;
                d = dev;
                st.textContent = "✓ Збережено";
            } catch (e) { st.className = "editor-status err"; st.textContent = e.message; }
        });

        renderPinsTable();
    }

    // показ схеми обраного контролера + вибір зображення схеми пристрою
    async function renderHwPreview(hwId, kbList, d) {
        const prev = document.getElementById("hwPreview");
        if (!prev) return;
        const eq = kbList.find(x => x.id === hwId);
        if (!eq) { prev.innerHTML = ""; return; }

        const imgs = eq.images || [];
        if (imgs.length === 0) {
            prev.innerHTML = `<div class="ov-muted">Для «${escapeHtml(eq.type)}» немає схем у базі знань.</div>`;
            return;
        }
        prev.innerHTML = `
            <div class="field">
                <label>Схема — ${escapeHtml(eq.type)}</label>
                <div class="ov-muted" style="margin-bottom:2px">Позначте зображення, яке буде схемою пристрою в огляді.</div>
                <div class="img-grid" id="hwImgs"></div>
            </div>`;
        const grid = document.getElementById("hwImgs");
        for (const name of imgs) {
            const url = await kbImageURL(eq.id, name);
            const wrap = document.createElement("div");
            wrap.className = "img-pick";
            wrap.innerHTML = `
                <div class="img-cell"><img src="${url || ""}" alt=""></div>
                <label class="pick-lbl"><input type="checkbox" ${name === d.scheme_image ? "checked" : ""}> Схема пристрою</label>`;
            if (url) wrap.querySelector("img").addEventListener("click", () => openLightbox(url));
            wrap.querySelector("input").addEventListener("change", async (e) => {
                const chosen = e.target.checked ? name : "";
                // один вибір: зняти інші галочки
                grid.querySelectorAll("input[type=checkbox]").forEach(cb => { if (cb !== e.target) cb.checked = false; });
                try {
                    const dev = await apiJson("PUT", `/devices/${encodeURIComponent(d.id)}/scheme_image`, { image: chosen || null });
                    const i = devices.findIndex(x => x.id === dev.id);
                    if (i >= 0) devices[i] = dev;
                    d.scheme_image = dev.scheme_image || "";
                } catch (err) { alert(err.message); e.target.checked = !e.target.checked; }
            });
            grid.appendChild(wrap);
        }
    }

    async function kbImageURL(eqId, name) {
        const r = await fetch(`${API}/knowledge/${encodeURIComponent(eqId)}/images/${encodeURIComponent(name)}`,
                              { headers: { ...authHeaders() } });
        if (!r.ok) return null;
        return URL.createObjectURL(await r.blob());
    }

    // редактор опису
    function renderDescEditor(d, body) {
        body.innerHTML = `
            <div class="editor">
                <textarea class="editor-text" id="descText"
                    placeholder="Опис пристрою: призначення, розташування, нотатки…">${escapeHtml(d.description || "")}</textarea>
                <div class="editor-actions">
                    <button class="btn btn-primary" id="btnSaveDesc">💾 Зберегти</button>
                    <span class="editor-status" id="descStatus"></span>
                </div>
            </div>`;

        const statusEl = document.getElementById("descStatus");
        document.getElementById("btnSaveDesc").addEventListener("click", async () => {
            const text = document.getElementById("descText").value;
            statusEl.className = "editor-status";
            statusEl.textContent = "Збереження…";
            try {
                const dev = await apiJson("PUT", `/devices/${encodeURIComponent(d.id)}/description`, { text });
                const i = devices.findIndex(x => x.id === dev.id);
                if (i >= 0) devices[i] = dev;
                statusEl.textContent = "✓ Збережено";
            } catch (e) {
                statusEl.className = "editor-status err";
                statusEl.textContent = e.message;
            }
        });
    }

    function emptyStateHtml() {
        return `
            <div class="empty">
                <div class="icon">⚙</div>
                <div class="title">Пристрій не обрано</div>
                <div class="sub">
                    Оберіть пристрій ліворуч або створіть новий, щоб налаштувати
                    канали та прив'язати їх до точок системи.
                </div>
            </div>`;
    }

    function escapeHtml(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ── CRUD-обробники ──────────────────────────────────────────
    function selectDevice(id) {
        selectedId = id;
        editorSection = null;
        renderDeviceList();
        renderWorkspace();
    }

    // Create — POST /devices (створює папку проєкту на сервері)
    async function submitAdd(name, errEl) {
        errEl.textContent = "";
        try {
            const dev = await apiJson("POST", "/devices", { name });
            adding = false;
            await loadDevices();
            selectDevice(dev.id);
        } catch (e) {
            errEl.textContent = e.message;
        }
    }

    function editDevice(id) {
        // TODO (Update): перейменування пристрою — визначимо наступним кроком
    }

    // Delete — DELETE /devices/{id} (видаляє папку проєкту)
    async function deleteDevice(id) {
        const d = devices.find(x => x.id === id);
        if (!d) return;
        if (!confirm(`Видалити пристрій «${d.name}»? Папку проєкту буде видалено.`)) return;
        try {
            await apiJson("DELETE", "/devices/" + encodeURIComponent(id));
            if (selectedId === id) { selectedId = null; editorSection = null; }
            await loadDevices();
        } catch (e) {
            alert(e.message);
        }
    }

    // ── перемикач "Редагувати" ──────────────────────────────────
    btnEdit.addEventListener("click", () => {
        editMode = !editMode;
        if (!editMode) adding = false;
        btnEdit.classList.toggle("active", editMode);
        btnEdit.innerHTML = editMode ? "✓ Готово" : "✎ Редагувати";
        renderDeviceList();
    });

    // ── лайтбокс (збільшене зображення схеми) ───────────────────
    const lightbox = document.getElementById("lightbox");
    function openLightbox(src) {
        lightbox.querySelector("img").src = src;
        lightbox.classList.add("show");
    }
    lightbox.addEventListener("click", () => lightbox.classList.remove("show"));
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") lightbox.classList.remove("show");
    });

    document.getElementById("btnNewBlock").addEventListener("click", newCodeBlock);

    // ── старт ───────────────────────────────────────────────────
    renderWorkspace();   // empty-state до завантаження
    loadDevices();
</script>
</body>
