<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrabox — Обладнання</title>
    <script>window.REQUIRED_ROLE = "admin";</script>
    <script src="/auth.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117; color: #c9d1d9;
            font-family: system-ui, sans-serif; font-size: 14px;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* ── header ─────────────────────────────────────────────── */
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; background: #161b22; border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }
        .logo { font-size: 16px; font-weight: 600; color: #58a6ff; text-decoration: none; }
        .hdr-left  { display: flex; align-items: center; gap: 12px; }
        .hdr-right { display: flex; align-items: center; gap: 12px; }
        .hdr-title { font-size: 13px; color: #8b949e; }
        .hdr-user  { font-size: 12px; color: #8b949e; }
        .btn {
            padding: 5px 14px; border-radius: 6px; border: 1px solid #30363d;
            background: #21262d; color: #c9d1d9; font-size: 13px; cursor: pointer;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #30363d; }
        .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .btn-primary:hover { background: #388bfd; }

        /* ── layout ─────────────────────────────────────────────── */
        main {
            flex: 1; display: flex; min-height: 0;
        }

        /* left column — device list */
        .sidebar {
            width: 260px; flex-shrink: 0;
            background: #0d1117; border-right: 1px solid #30363d;
            display: flex; flex-direction: column;
        }
        .sidebar-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-bottom: 1px solid #21262d;
        }
        .sidebar-head .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; }
        .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }

        /* toggle "Редагувати" active state */
        .btn-toggle.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

        /* device row */
        .device-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 6px; cursor: pointer;
            border: 1px solid transparent;
        }
        .device-item:hover { background: #161b22; }
        .device-item.selected { background: #161b22; border-color: #30363d; }
        .device-main { flex: 1; min-width: 0; }
        .device-name { font-size: 13px; color: #e6edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .device-meta { font-size: 11px; color: #8b949e; }

        /* per-item CRUD actions — visible only in edit mode */
        .device-actions { display: none; gap: 4px; flex-shrink: 0; }
        .sidebar-list.editing .device-actions { display: flex; }
        .sidebar-list.editing .device-item { cursor: default; }
        .act {
            width: 26px; height: 26px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 6px; border: 1px solid #30363d; background: #21262d;
            color: #c9d1d9; font-size: 13px; cursor: pointer;
        }
        .act:hover { background: #30363d; }
        .act.danger:hover { background: #b62324; border-color: #f85149; color: #fff; }

        /* "add device" affordance — visible only in edit mode */
        .add-device {
            display: none; width: 100%; margin-top: 4px;
            padding: 9px 10px; border-radius: 6px;
            border: 1px dashed #30363d; background: transparent;
            color: #8b949e; font-size: 13px; cursor: pointer;
            align-items: center; justify-content: center; gap: 6px;
        }
        .sidebar-list.editing .add-device { display: flex; }
        .add-device:hover { border-color: #58a6ff; color: #58a6ff; }

        /* empty hint */
        .list-empty { padding: 16px 10px; font-size: 12px; color: #484f58; text-align: center; line-height: 1.5; }

        /* inline add-device form */
        .add-form { padding: 6px 4px 4px; }
        .add-input {
            width: 100%; padding: 8px 10px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; margin-bottom: 8px;
        }
        .add-input:focus { outline: none; border-color: #58a6ff; }
        .add-form-row { display: flex; gap: 6px; }
        .add-form-row .btn { flex: 1; justify-content: center; }
        .add-error { color: #f85149; font-size: 12px; margin-top: 8px; min-height: 14px; line-height: 1.4; }

        /* right column — workspace */
        .workspace {
            flex: 1; min-height: 0; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .ws-toolbar {
            flex-shrink: 0; display: flex; align-items: center;
            justify-content: flex-end; gap: 8px;
            padding: 10px 24px; border-bottom: 1px solid #21262d;
        }
        .ws-content {
            flex: 1; overflow-y: auto; padding: 24px 32px;
            display: flex; flex-direction: column;
        }

        /* workspace head: device title + thematic tabs */
        .ws-head {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #21262d;
        }
        .ws-title { font-size: 18px; font-weight: 600; color: #e6edf3; }
        .ws-tabs  { display: flex; gap: 8px; }
        .ws-tab {
            padding: 6px 16px; border-radius: 6px; border: 1px solid #30363d;
            background: #21262d; color: #c9d1d9; font-size: 13px; cursor: pointer;
        }
        .ws-tab:hover { background: #30363d; }
        .ws-tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .ws-body { flex: 1; }
        .ws-placeholder { color: #8b949e; font-size: 13px; line-height: 1.6; }

        /* overview — усе одразу: опис, схема, код */
        .ov-grid  { display: flex; flex-direction: column; gap: 16px; max-width: 760px; }
        .ov-block { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px 20px; }
        .ov-block h3 {
            font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
            color: #8b949e; font-weight: 600; margin-bottom: 12px;
        }
        .ov-desc  { font-size: 13px; color: #c9d1d9; line-height: 1.6; white-space: pre-wrap; }
        .ov-muted { font-size: 13px; color: #484f58; }
        .ov-scheme-img { max-width: 100%; display: block; border: 1px solid #30363d; border-radius: 8px; }
        .ov-scheme-empty {
            height: 160px; border: 1px dashed #30363d; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #484f58; font-size: 13px;
        }
        .dl-link {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 6px;
            background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
            font-size: 13px; text-decoration: none;
        }
        .dl-link:hover { background: #30363d; border-color: #58a6ff; color: #58a6ff; }

        /* thematic editors */
        .editor { max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
        .editor-text {
            width: 100%; min-height: 300px; resize: vertical;
            padding: 14px 16px; border-radius: 10px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-family: inherit; font-size: 13px; line-height: 1.6;
        }
        .editor-text:focus { outline: none; border-color: #58a6ff; }
        .editor-actions { display: flex; align-items: center; gap: 12px; }
        .editor-status { font-size: 13px; color: #3fb950; }
        .editor-status.err { color: #f85149; }

        /* scheme editor — вибір апаратного забезпечення */
        .scheme-editor { max-width: 760px; display: flex; flex-direction: column; gap: 22px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; font-weight: 600; }
        .hw-select {
            max-width: 440px; padding: 10px 12px; border-radius: 8px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 13px;
        }
        .hw-select:focus { outline: none; border-color: #58a6ff; }

        .img-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .img-cell {
            width: 200px; height: 150px; border-radius: 8px; border: 1px solid #30363d;
            background: #e9e2f5;                       /* світло-бузковий фон */
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .img-cell img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: zoom-in; }

        /* lightbox */
        .lightbox {
            position: fixed; inset: 0; z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 32px;
            background: rgba(1,4,9,.85); cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; background: #e9e2f5; }

        /* pins table — задіяні порти */
        .pins-wrap { border: 1px solid #30363d; border-radius: 10px; overflow-x: auto; }
        .pins-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .pins-table th {
            text-align: left; padding: 10px 12px; background: #161b22;
            color: #8b949e; font-weight: 600; font-size: 12px;
            text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #30363d;
        }
        .pins-table td { padding: 6px 8px; border-bottom: 1px solid #21262d; vertical-align: middle; }
        .pins-table tr:last-child td { border-bottom: none; }
        .pins-table td:last-child, .pins-table th:last-child { width: 44px; text-align: center; }
        .pins-empty { color: #484f58; text-align: center; padding: 16px !important; }
        .cell-inp, .cell-sel {
            width: 100%; padding: 7px 9px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; font-family: inherit;
        }
        .cell-inp:focus, .cell-sel:focus { outline: none; border-color: #58a6ff; }
        .cell-fn { font-size: 13px; color: #484f58; padding: 2px 4px; line-height: 1.4; }
        .cell-sel[data-f="pin"] { min-width: 110px; }
        .cell-sel[data-f="function"] { min-width: 150px; }
        .cell-txt {
            width: 100%; min-width: 200px; padding: 7px 9px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; font-family: inherit; line-height: 1.4;
            resize: vertical; overflow: hidden; min-height: 34px; display: block;
        }
        .cell-txt:focus { outline: none; border-color: #58a6ff; }

        /* empty states */
        .empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            text-align: center; color: #484f58;
        }
        .empty .icon  { font-size: 52px; opacity: .3; }
        .empty .title { font-size: 16px; font-weight: 600; color: #8b949e; }
        .empty .sub   { font-size: 13px; max-width: 340px; line-height: 1.5; }
    </style>
</head>
<body>

<header>
    <div class="hdr-left">
        <a class="logo" href="/">⬡ Infrabox</a>
        <span class="hdr-title">Конструктор обладнання</span>
    </div>
    <div class="hdr-right">
        <span class="hdr-user" id="headerUser"></span>
        <a class="btn" href="/constructor">← Конструктор</a>
        <button class="btn" onclick="authLogout()">Вийти</button>
    </div>
</header>

<main>
    <!-- ── ліва колонка: перелік пристроїв ─────────────────────── -->
    <aside class="sidebar">
        <div class="sidebar-head">
            <span class="lbl">Пристрої</span>
            <button class="btn btn-toggle" id="btnEdit" title="Редагувати список">✎ Редагувати</button>
        </div>
        <div class="sidebar-list" id="deviceList">
            <!-- список пристроїв рендериться скриптом -->
        </div>
    </aside>

    <!-- ── права колонка: робочий простір ──────────────────────── -->
    <section class="workspace">
        <div class="ws-toolbar">
            <a class="btn" href="/constructor-knowledge">📚 База знань</a>
        </div>
        <div class="ws-content" id="wsContent">
            <!-- вміст рендериться скриптом -->
        </div>
    </section>
</main>

<!-- збільшене зображення -->
<div class="lightbox" id="lightbox"><img alt="Зображення"></div>

<script>
    // ── ім'я користувача в хедері ──────────────────────────────
    document.getElementById("headerUser").textContent =
        authUser().display_name || authUser().role;

    // ── стан ───────────────────────────────────────────────────
    const API      = "/lowlevel/api";
    let devices    = [];       // завантажуються з бекенду
    let selectedId = null;
    let editMode   = false;
    let adding     = false;    // показана inline-форма додавання

    // ── обгортка над fetch (auth + помилки) ─────────────────────
    async function apiJson(method, path, body) {
        const opts = { method, headers: { ...authHeaders() } };
        if (body !== undefined) {
            opts.headers["Content-Type"] = "application/json";
            opts.body = JSON.stringify(body);
        }
        const r = await fetch(API + path, opts);
        if (!r.ok) {
            let msg = "Помилка " + r.status;
            try { const j = await r.json(); if (j.detail) msg = j.detail; } catch {}
            throw new Error(msg);
        }
        const ct = r.headers.get("content-type") || "";
        return ct.includes("application/json") ? r.json() : null;
    }

    async function loadDevices() {
        try {
            const data = await apiJson("GET", "/devices");
            devices = data.devices || [];
        } catch (e) {
            devices = [];
            console.error("loadDevices:", e.message);
        }
        if (selectedId && !devices.find(d => d.id === selectedId)) {
            selectedId = null; editorSection = null;
        }
        renderDeviceList();
        renderWorkspace();
    }

    const listEl = document.getElementById("deviceList");
    const btnEdit = document.getElementById("btnEdit");
    const wsEl   = document.getElementById("wsContent");
    const boardLabel = { esp32: "ESP32", esp8266: "ESP8266" };

    // тематичні розділи пристрою: кнопки → сторінки редагування
    let editorSection = null;   // null = оглядове поле; інакше id відкритого редактора
    const SECTIONS = [
        { id: "desc",    label: "Опис" },
        { id: "scheme",  label: "Схема" },
        { id: "program", label: "Програма" },
    ];

    // ── рендер списку пристроїв ─────────────────────────────────
    function renderDeviceList() {
        listEl.classList.toggle("editing", editMode);
        listEl.innerHTML = "";

        if (devices.length === 0) {
            const empty = document.createElement("div");
            empty.className = "list-empty";
            empty.textContent = editMode
                ? "Ще немає пристроїв. Натисніть «Додати пристрій»."
                : "Ще немає пристроїв.";
            listEl.appendChild(empty);
        }

        for (const d of devices) {
            const item = document.createElement("div");
            item.className = "device-item" + (d.id === selectedId ? " selected" : "");
            item.innerHTML = `
                <div class="device-main">
                    <div class="device-name">${d.name}</div>
                    <div class="device-meta">${d.board ? (boardLabel[d.board] || d.board) : d.id}</div>
                </div>
                <div class="device-actions">
                    <button class="act" data-act="edit"   title="Редагувати">✎</button>
                    <button class="act danger" data-act="delete" title="Видалити">🗑</button>
                </div>`;

            // вибір пристрою (лише поза edit-режимом)
            item.querySelector(".device-main").addEventListener("click", () => {
                if (editMode) return;
                selectDevice(d.id);
            });
            // дії CRUD
            item.querySelector('[data-act="edit"]').addEventListener("click", () => editDevice(d.id));
            item.querySelector('[data-act="delete"]').addEventListener("click", () => deleteDevice(d.id));

            listEl.appendChild(item);
        }

        // "Додати пристрій" — окремий CRUD-елемент, видимий у edit-режимі
        if (editMode && adding) {
            listEl.appendChild(renderAddForm());
        } else {
            const addBtn = document.createElement("button");
            addBtn.className = "add-device";
            addBtn.innerHTML = "＋ Додати пристрій";
            addBtn.addEventListener("click", () => { adding = true; renderDeviceList(); });
            listEl.appendChild(addBtn);
        }
    }

    // inline-форма створення пристрою (назва латиницею)
    function renderAddForm() {
        const wrap = document.createElement("div");
        wrap.className = "add-form";
        wrap.innerHTML = `
            <input class="add-input" type="text" placeholder="Назва (латиницею)" autocomplete="off">
            <div class="add-form-row">
                <button class="btn btn-primary" data-act="create">Створити</button>
                <button class="btn" data-act="cancel" title="Скасувати">✕</button>
            </div>
            <div class="add-error"></div>`;

        const input = wrap.querySelector(".add-input");
        const errEl = wrap.querySelector(".add-error");

        const submit = () => submitAdd(input.value, errEl);
        wrap.querySelector('[data-act="create"]').addEventListener("click", submit);
        wrap.querySelector('[data-act="cancel"]').addEventListener("click", () => {
            adding = false; renderDeviceList();
        });
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter")  submit();
            if (e.key === "Escape") { adding = false; renderDeviceList(); }
        });

        setTimeout(() => input.focus(), 0);
        return wrap;
    }

    // ── робочий простір (центральне поле) ───────────────────────
    function renderWorkspace() {
        const d = devices.find(x => x.id === selectedId);
        if (!d)            { wsEl.innerHTML = emptyStateHtml(); return; }
        if (editorSection) { renderEditor(d, editorSection);   return; }
        renderOverview(d);
    }

    // оглядове поле — усе одразу: опис, схема, посилання на код
    function renderOverview(d) {
        const buttons = SECTIONS.map(s =>
            `<button class="ws-tab" data-edit="${s.id}">${s.label}</button>`
        ).join("");

        const descHtml = d.description
            ? `<div class="ov-desc">${escapeHtml(d.description)}</div>`
            : `<div class="ov-muted">Опис не додано.</div>`;

        const schemeHtml = d.scheme
            ? `<img class="ov-scheme-img" src="${d.scheme}" alt="Схема">`
            : `<div class="ov-scheme-empty">Схему не додано</div>`;

        const programHtml = `
            <a class="dl-link" href="/lowlevel/api/devices/${encodeURIComponent(d.id)}/firmware" download>⬇ Завантажити код</a>
            <div class="ov-muted" style="margin-top:8px">Arduino-скетч (.ino) для прошивки пристрою.</div>`;

        wsEl.innerHTML = `
            <div class="ws-head">
                <div class="ws-title">${escapeHtml(d.name)}</div>
                <div class="ws-tabs">${buttons}</div>
            </div>
            <div class="ws-body">
                <div class="ov-grid">
                    <div class="ov-block"><h3>Опис</h3>${descHtml}</div>
                    <div class="ov-block"><h3>Схема</h3>${schemeHtml}</div>
                    <div class="ov-block"><h3>Програма</h3>${programHtml}</div>
                </div>
            </div>`;

        wsEl.querySelectorAll("[data-edit]").forEach(btn =>
            btn.addEventListener("click", () => { editorSection = btn.dataset.edit; renderWorkspace(); })
        );
    }

    // сторінка редагування розділу (опис / схема / програма)
    function renderEditor(d, section) {
        const label = (SECTIONS.find(s => s.id === section) || {}).label || section;
        wsEl.innerHTML = `
            <div class="ws-head">
                <div class="ws-title">${escapeHtml(d.name)} — ${label}</div>
                <button class="btn" id="btnBackOverview">← Назад</button>
            </div>
            <div class="ws-body" id="wsBody"></div>`;
        document.getElementById("btnBackOverview")
            .addEventListener("click", () => { editorSection = null; renderWorkspace(); });

        const body = document.getElementById("wsBody");
        if (section === "desc")   return renderDescEditor(d, body);
        if (section === "scheme") return renderSchemeEditor(d, body);
        // TODO: program — наповнимо далі
        body.innerHTML = `<div class="ws-placeholder">Сторінка редагування «${label}» — наповнимо далі.</div>`;
    }

    // редактор схеми — вибір апаратного забезпечення з бази знань
    async function renderSchemeEditor(d, body) {
        body.innerHTML = `<div class="ws-placeholder">Завантаження бази знань…</div>`;

        let kbList = [];
        try {
            const data = await apiJson("GET", "/knowledge");
            kbList = data.equipment || [];
        } catch (e) {
            body.innerHTML = `<div class="ws-placeholder">Помилка завантаження бази знань: ${e.message}</div>`;
            return;
        }

        const options = [`<option value="">— не обрано —</option>`].concat(
            kbList.map(eq => `<option value="${eq.id}"${eq.id === d.hardware ? " selected" : ""}>${escapeHtml(eq.type)}</option>`)
        ).join("");

        const kbHint = kbList.length === 0
            ? `<div class="ov-muted">База знань порожня. <a class="dl-link" href="/constructor-knowledge">Додати обладнання</a>.</div>`
            : "";

        body.innerHTML = `
            <div class="scheme-editor">
                <div class="field">
                    <label>Апаратне забезпечення</label>
                    <select class="hw-select" id="hwSelect">${options}</select>
                    <span class="editor-status" id="hwStatus"></span>
                </div>
                ${kbHint}
                <div id="hwPreview"></div>

                <div class="field">
                    <label>Задіяні порти</label>
                    <div class="pins-wrap">
                        <table class="pins-table">
                            <thead><tr>
                                <th>Пін</th><th>Функціонал</th><th>Призначення</th><th>Режим</th><th></th>
                            </tr></thead>
                            <tbody id="pinsBody"></tbody>
                        </table>
                    </div>
                    <div><button class="btn" id="btnAddPin">＋ Додати рядок</button></div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" id="btnSavePins">💾 Зберегти порти</button>
                    <span class="editor-status" id="pinsStatus"></span>
                </div>
            </div>`;

        const sel      = document.getElementById("hwSelect");
        const statusEl = document.getElementById("hwStatus");

        sel.addEventListener("change", async () => {
            statusEl.className = "editor-status";
            statusEl.textContent = "Збереження…";
            try {
                const dev = await apiJson("PUT", `/devices/${encodeURIComponent(d.id)}/hardware`, { hardware: sel.value || null });
                const i = devices.findIndex(x => x.id === dev.id);
                if (i >= 0) devices[i] = dev;
                d = dev;
                statusEl.textContent = "✓ Збережено";
                renderHwPreview(sel.value, kbList);
                renderPinsTable();   // піни контролера змінились → оновити список у таблиці
            } catch (e) {
                statusEl.className = "editor-status err";
                statusEl.textContent = e.message;
            }
        });

        renderHwPreview(d.hardware, kbList);

        // ── таблиця задіяних портів ──────────────────────────────
        const MODES = [["", "—"], ["input", "Вхід"], ["output", "Вихід"], ["hiz", "Високий опір"]];
        let pins = (d.pins || []).map(p => ({
            pin: p.pin || "", function: p.function || "", purpose: p.purpose || "", mode: p.mode || ""
        }));

        function optionList(items, val) {
            return items.map(it => {
                const [v, l] = Array.isArray(it) ? it : [it, it || "—"];
                return `<option value="${escapeHtml(v)}"${v === (val || "") ? " selected" : ""}>${escapeHtml(l)}</option>`;
            }).join("");
        }

        // піни обраного контролера з бази знань
        function currentKbPins() {
            const eq = kbList.find(x => x.id === sel.value);
            return eq ? (eq.pins || []) : [];
        }
        // перелік конкретних функцій піна (розбитий з рядка функціоналу БЗ)
        function pinFunctions(kbPins, pinName) {
            const kp = kbPins.find(x => x.pin === pinName);
            if (!kp || !kp.function) return [];
            return kp.function.split(",").map(s => s.trim()).filter(Boolean);
        }
        function autoGrow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

        function renderPinsTable() {
            const kbPins = currentKbPins();
            const tb = document.getElementById("pinsBody");
            if (pins.length === 0) {
                tb.innerHTML = `<tr><td colspan="5" class="pins-empty">Портів не додано. Натисніть «Додати рядок».</td></tr>`;
                return;
            }
            tb.innerHTML = "";
            pins.forEach((p, i) => {
                // "Пін": список пінів контролера з БЗ (або текст, якщо їх нема)
                let pinCell;
                if (kbPins.length) {
                    const opts = [`<option value="">—</option>`].concat(
                        kbPins.map(kp => `<option value="${escapeHtml(kp.pin)}"${kp.pin === p.pin ? " selected" : ""}>${escapeHtml(kp.pin)}</option>`)
                    ).join("");
                    pinCell = `<select class="cell-sel" data-f="pin">${opts}</select>`;
                } else {
                    pinCell = `<input class="cell-inp" data-f="pin" value="${escapeHtml(p.pin)}" placeholder="напр. GPIO4">`;
                }

                // "Функціонал": одна конкретна функція з доступних для цього піна
                const fns = pinFunctions(kbPins, p.pin);
                let fnCell;
                if (fns.length) {
                    const opts = [`<option value="">—</option>`].concat(
                        fns.map(f => `<option value="${escapeHtml(f)}"${f === p.function ? " selected" : ""}>${escapeHtml(f)}</option>`)
                    ).join("");
                    fnCell = `<select class="cell-sel" data-f="function">${opts}</select>`;
                } else {
                    fnCell = `<div class="cell-fn">—</div>`;
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${pinCell}</td>
                    <td>${fnCell}</td>
                    <td><textarea class="cell-txt" data-f="purpose" rows="1" placeholder="призначення">${escapeHtml(p.purpose)}</textarea></td>
                    <td><select class="cell-sel" data-f="mode">${optionList(MODES, p.mode)}</select></td>
                    <td><button class="act danger" data-act="del" title="Видалити рядок">🗑</button></td>`;

                const pinEl = tr.querySelector('[data-f="pin"]');
                if (pinEl.tagName === "SELECT") {
                    pinEl.addEventListener("change", e => { pins[i].pin = e.target.value; pins[i].function = ""; renderPinsTable(); });
                } else {
                    pinEl.addEventListener("input", e => pins[i].pin = e.target.value);
                }
                const fnEl = tr.querySelector('[data-f="function"]');
                if (fnEl) fnEl.addEventListener("change", e => pins[i].function = e.target.value);
                const purposeEl = tr.querySelector('[data-f="purpose"]');
                purposeEl.addEventListener("input", e => { pins[i].purpose = e.target.value; autoGrow(e.target); });
                tr.querySelector('[data-f="mode"]').addEventListener("change", e => pins[i].mode = e.target.value);
                tr.querySelector('[data-act="del"]').addEventListener("click", () => { pins.splice(i, 1); renderPinsTable(); });
                tb.appendChild(tr);
                autoGrow(purposeEl);
            });
        }

        document.getElementById("btnAddPin").addEventListener("click", () => {
            pins.push({ pin: "", purpose: "", protocol: "", mode: "" });
            renderPinsTable();
        });

        document.getElementById("btnSavePins").addEventListener("click", async () => {
            const st = document.getElementById("pinsStatus");
            st.className = "editor-status"; st.textContent = "Збереження…";
            try {
                const dev = await apiJson("PUT", `/devices/${encodeURIComponent(d.id)}/pins`, { pins });
                const i = devices.findIndex(x => x.id === dev.id);
                if (i >= 0) devices[i] = dev;
                d = dev;
                st.textContent = "✓ Збережено";
            } catch (e) { st.className = "editor-status err"; st.textContent = e.message; }
        });

        renderPinsTable();
    }

    // показ схеми обраного контролера (зображення з бази знань)
    async function renderHwPreview(hwId, kbList) {
        const prev = document.getElementById("hwPreview");
        if (!prev) return;
        const eq = kbList.find(x => x.id === hwId);
        if (!eq) { prev.innerHTML = ""; return; }

        const imgs = eq.images || [];
        if (imgs.length === 0) {
            prev.innerHTML = `<div class="ov-muted">Для «${escapeHtml(eq.type)}» немає схем у базі знань.</div>`;
            return;
        }
        prev.innerHTML = `
            <div class="field">
                <label>Схема — ${escapeHtml(eq.type)}</label>
                <div class="img-grid" id="hwImgs"></div>
            </div>`;
        const grid = document.getElementById("hwImgs");
        for (const name of imgs) {
            const url = await kbImageURL(eq.id, name);
            const cell = document.createElement("div");
            cell.className = "img-cell";
            cell.innerHTML = `<img src="${url || ""}" alt="">`;
            if (url) cell.querySelector("img").addEventListener("click", () => openLightbox(url));
            grid.appendChild(cell);
        }
    }

    async function kbImageURL(eqId, name) {
        const r = await fetch(`${API}/knowledge/${encodeURIComponent(eqId)}/images/${encodeURIComponent(name)}`,
                              { headers: { ...authHeaders() } });
        if (!r.ok) return null;
        return URL.createObjectURL(await r.blob());
    }

    // редактор опису
    function renderDescEditor(d, body) {
        body.innerHTML = `
            <div class="editor">
                <textarea class="editor-text" id="descText"
                    placeholder="Опис пристрою: призначення, розташування, нотатки…">${escapeHtml(d.description || "")}</textarea>
                <div class="editor-actions">
                    <button class="btn btn-primary" id="btnSaveDesc">💾 Зберегти</button>
                    <span class="editor-status" id="descStatus"></span>
                </div>
            </div>`;

        const statusEl = document.getElementById("descStatus");
        document.getElementById("btnSaveDesc").addEventListener("click", async () => {
            const text = document.getElementById("descText").value;
            statusEl.className = "editor-status";
            statusEl.textContent = "Збереження…";
            try {
                const dev = await apiJson("PUT", `/devices/${encodeURIComponent(d.id)}/description`, { text });
                const i = devices.findIndex(x => x.id === dev.id);
                if (i >= 0) devices[i] = dev;
                statusEl.textContent = "✓ Збережено";
            } catch (e) {
                statusEl.className = "editor-status err";
                statusEl.textContent = e.message;
            }
        });
    }

    function emptyStateHtml() {
        return `
            <div class="empty">
                <div class="icon">⚙</div>
                <div class="title">Пристрій не обрано</div>
                <div class="sub">
                    Оберіть пристрій ліворуч або створіть новий, щоб налаштувати
                    канали та прив'язати їх до точок системи.
                </div>
            </div>`;
    }

    function escapeHtml(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ── CRUD-обробники ──────────────────────────────────────────
    function selectDevice(id) {
        selectedId = id;
        editorSection = null;
        renderDeviceList();
        renderWorkspace();
    }

    // Create — POST /devices (створює папку проєкту на сервері)
    async function submitAdd(name, errEl) {
        errEl.textContent = "";
        try {
            const dev = await apiJson("POST", "/devices", { name });
            adding = false;
            await loadDevices();
            selectDevice(dev.id);
        } catch (e) {
            errEl.textContent = e.message;
        }
    }

    function editDevice(id) {
        // TODO (Update): перейменування пристрою — визначимо наступним кроком
    }

    // Delete — DELETE /devices/{id} (видаляє папку проєкту)
    async function deleteDevice(id) {
        const d = devices.find(x => x.id === id);
        if (!d) return;
        if (!confirm(`Видалити пристрій «${d.name}»? Папку проєкту буде видалено.`)) return;
        try {
            await apiJson("DELETE", "/devices/" + encodeURIComponent(id));
            if (selectedId === id) { selectedId = null; editorSection = null; }
            await loadDevices();
        } catch (e) {
            alert(e.message);
        }
    }

    // ── перемикач "Редагувати" ──────────────────────────────────
    btnEdit.addEventListener("click", () => {
        editMode = !editMode;
        if (!editMode) adding = false;
        btnEdit.classList.toggle("active", editMode);
        btnEdit.innerHTML = editMode ? "✓ Готово" : "✎ Редагувати";
        renderDeviceList();
    });

    // ── лайтбокс (збільшене зображення схеми) ───────────────────
    const lightbox = document.getElementById("lightbox");
    function openLightbox(src) {
        lightbox.querySelector("img").src = src;
        lightbox.classList.add("show");
    }
    lightbox.addEventListener("click", () => lightbox.classList.remove("show"));
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") lightbox.classList.remove("show");
    });

    // ── старт ───────────────────────────────────────────────────
    renderWorkspace();   // empty-state до завантаження
    loadDevices();
</script>
</body>
</html>
