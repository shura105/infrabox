<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrabox — База знань</title>
    <script>window.REQUIRED_ROLE = "admin";</script>
    <script src="/auth.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117; color: #c9d1d9;
            font-family: system-ui, sans-serif; font-size: 14px;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* ── header ─────────────────────────────────────────────── */
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; background: #161b22; border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }
        .logo { font-size: 16px; font-weight: 600; color: #58a6ff; text-decoration: none; }
        .hdr-left  { display: flex; align-items: center; gap: 12px; }
        .hdr-right { display: flex; align-items: center; gap: 12px; }
        .hdr-title { font-size: 13px; color: #8b949e; }
        .hdr-user  { font-size: 12px; color: #8b949e; }
        .btn {
            padding: 5px 14px; border-radius: 6px; border: 1px solid #30363d;
            background: #21262d; color: #c9d1d9; font-size: 13px; cursor: pointer;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: #30363d; }
        .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .btn-primary:hover { background: #388bfd; }
        .btn.danger:hover { background: #b62324; border-color: #f85149; color: #fff; }

        /* ── layout ─────────────────────────────────────────────── */
        main { flex: 1; display: flex; min-height: 0; }

        /* left column — equipment list */
        .sidebar {
            width: 260px; flex-shrink: 0;
            background: #0d1117; border-right: 1px solid #30363d;
            display: flex; flex-direction: column;
        }
        .sidebar-head {
            padding: 12px 16px; border-bottom: 1px solid #21262d;
            font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e;
        }
        .sidebar-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .add-eq-btn { width: 100%; justify-content: center; }

        .eq-list { display: flex; flex-direction: column; gap: 4px; }
        .eq-item {
            padding: 9px 12px; border-radius: 6px; cursor: pointer;
            border: 1px solid transparent; font-size: 13px; color: #c9d1d9;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .eq-item:hover { background: #161b22; }
        .eq-item.selected { background: #161b22; border-color: #30363d; color: #e6edf3; }
        .list-empty { padding: 12px; font-size: 12px; color: #484f58; text-align: center; line-height: 1.5; }

        /* right column — content */
        .content { flex: 1; overflow-y: auto; padding: 32px; display: flex; flex-direction: column; }

        .empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            text-align: center; color: #484f58;
        }
        .empty .icon  { font-size: 52px; opacity: .3; }
        .empty .title { font-size: 16px; font-weight: 600; color: #8b949e; }
        .empty .sub   { font-size: 13px; max-width: 380px; line-height: 1.5; }

        /* form / view */
        .panel { max-width: 820px; display: flex; flex-direction: column; gap: 18px; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .panel-title { font-size: 18px; font-weight: 600; color: #e6edf3; }

        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8b949e; font-weight: 600; }
        .inp, .txt {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-family: inherit; font-size: 13px;
        }
        .txt { min-height: 120px; resize: vertical; line-height: 1.6; }
        .inp:focus, .txt:focus { outline: none; border-color: #58a6ff; }

        /* ── image field (default light-lilac background so SVG text is readable) ── */
        .img-drop {
            border: 1px dashed #30363d; border-radius: 10px; padding: 14px;
            display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
        }
        .img-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .img-cell {
            position: relative; width: 170px; height: 130px;
            border-radius: 8px; border: 1px solid #30363d;
            background: #e9e2f5;                         /* світло-бузковий фон */
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .img-cell img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
        .img-del {
            position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
            border: none; border-radius: 6px; background: rgba(13,17,23,.75); color: #fff;
            font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .img-del:hover { background: #b62324; }
        .img-empty { color: #484f58; font-size: 13px; }

        /* lightbox — збільшене зображення */
        .lightbox {
            position: fixed; inset: 0; z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 32px;
            background: rgba(1,4,9,.85); cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img {
            max-width: 95vw; max-height: 95vh; object-fit: contain;
            border-radius: 8px; background: #e9e2f5;    /* бузковий фон і при збільшенні */
        }

        .form-actions { display: flex; align-items: center; gap: 12px; }
        .form-actions.actions-split { justify-content: space-between; }
        .left-actions { display: flex; align-items: center; gap: 12px; }
        .form-status { font-size: 13px; color: #3fb950; }
        .form-status.err { color: #f85149; }

        .view-info { font-size: 13px; color: #c9d1d9; line-height: 1.6; white-space: pre-wrap; }
        .view-muted { font-size: 13px; color: #484f58; }

        /* pins table — піни контролера */
        .pins-wrap { border: 1px solid #30363d; border-radius: 10px; overflow-x: auto; }
        .pins-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .pins-table th {
            text-align: left; padding: 10px 12px; background: #161b22;
            color: #8b949e; font-weight: 600; font-size: 12px;
            text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #30363d;
        }
        .pins-table td { padding: 6px 8px; border-bottom: 1px solid #21262d; vertical-align: middle; }
        .pins-table tr:last-child td { border-bottom: none; }
        .pins-table td:last-child, .pins-table th:last-child { width: 44px; text-align: center; }
        .pins-empty { color: #484f58; text-align: center; padding: 16px !important; }
        .cell-inp {
            width: 100%; padding: 7px 9px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
            font-size: 13px; font-family: inherit;
        }
        .cell-inp:focus { outline: none; border-color: #58a6ff; }
        .act {
            width: 28px; height: 28px; padding: 0; display: inline-flex;
            align-items: center; justify-content: center; border-radius: 6px;
            border: 1px solid #30363d; background: #21262d; color: #c9d1d9;
            font-size: 13px; cursor: pointer;
        }
        .act:hover { background: #30363d; }
        .act.danger:hover { background: #b62324; border-color: #f85149; color: #fff; }
    </style>
</head>
<body>

<header>
    <div class="hdr-left">
        <a class="logo" href="/">⬡ Infrabox</a>
        <span class="hdr-title">База знань</span>
    </div>
    <div class="hdr-right">
        <span class="hdr-user" id="headerUser"></span>
        <a class="btn" href="/constructor-equipment">← Обладнання</a>
        <button class="btn" onclick="authLogout()">Вийти</button>
    </div>
</header>

<main>
    <aside class="sidebar">
        <div class="sidebar-head">Обладнання</div>
        <div class="sidebar-body">
            <button class="btn btn-primary add-eq-btn" id="btnAddEq">＋ Додати обладнання</button>
            <div class="eq-list" id="eqList"></div>
        </div>
    </aside>

    <section class="content" id="content"></section>
</main>

<!-- збільшене зображення -->
<div class="lightbox" id="lightbox"><img alt="Зображення"></div>

<script>
    document.getElementById("headerUser").textContent =
        authUser().display_name || authUser().role;

    // ── стан ────────────────────────────────────────────────────
    const API      = "/lowlevel/api";
    let equipment  = [];
    let selectedId = null;
    let mode       = "empty";   // empty | view | add

    const listEl    = document.getElementById("eqList");
    const contentEl = document.getElementById("content");
    document.getElementById("btnAddEq").addEventListener("click", () => {
        mode = "add"; selectedId = null; renderList(); renderContent();
    });

    // ── fetch-хелпери (auth + помилки) ──────────────────────────
    async function apiJson(method, path, body) {
        const opts = { method, headers: { ...authHeaders() } };
        if (body !== undefined) {
            opts.headers["Content-Type"] = "application/json";
            opts.body = JSON.stringify(body);
        }
        const r = await fetch(API + path, opts);
        if (!r.ok) throw new Error(await errMsg(r));
        const ct = r.headers.get("content-type") || "";
        return ct.includes("application/json") ? r.json() : null;
    }
    async function apiUploadMany(path, files) {
        const fd = new FormData();
        for (const f of files) fd.append("files", f);
        const r = await fetch(API + path, { method: "POST", headers: { ...authHeaders() }, body: fd });
        if (!r.ok) throw new Error(await errMsg(r));
        return r.json();
    }
    async function imageURL(id, name) {
        const r = await fetch(`${API}/knowledge/${encodeURIComponent(id)}/images/${encodeURIComponent(name)}`,
                              { headers: { ...authHeaders() } });
        if (!r.ok) return null;
        return URL.createObjectURL(await r.blob());
    }
    async function errMsg(r) {
        let msg = "Помилка " + r.status;
        try { const j = await r.json(); if (j.detail) msg = j.detail; } catch {}
        return msg;
    }

    // ── дані ────────────────────────────────────────────────────
    async function loadEquipment() {
        try {
            const data = await apiJson("GET", "/knowledge");
            equipment = data.equipment || [];
        } catch (e) { equipment = []; console.error(e.message); }
        if (selectedId && !equipment.find(x => x.id === selectedId)) {
            selectedId = null; if (mode === "view") mode = "empty";
        }
        renderList(); renderContent();
    }

    // ── список ──────────────────────────────────────────────────
    function renderList() {
        listEl.innerHTML = "";
        if (equipment.length === 0) {
            const e = document.createElement("div");
            e.className = "list-empty";
            e.textContent = "Ще немає обладнання.";
            listEl.appendChild(e);
            return;
        }
        for (const eq of equipment) {
            const item = document.createElement("div");
            item.className = "eq-item" + (eq.id === selectedId ? " selected" : "");
            item.textContent = eq.type;
            item.title = eq.type;
            item.addEventListener("click", () => { selectedId = eq.id; mode = "view"; renderList(); renderContent(); });
            listEl.appendChild(item);
        }
    }

    // ── контент ─────────────────────────────────────────────────
    function renderContent() {
        if (mode === "add")  return renderAddForm();
        if (mode === "view") return renderView();
        contentEl.innerHTML = `
            <div class="empty">
                <div class="icon">📚</div>
                <div class="title">База знань</div>
                <div class="sub">
                    Додавайте типи обладнання (контролери), їхні схеми та допоміжну інформацію.
                    Натисніть «Додати обладнання» або оберіть запис ліворуч.
                </div>
            </div>`;
    }

    // ── форма додавання ─────────────────────────────────────────
    function renderAddForm() {
        let pendingFiles = [];

        contentEl.innerHTML = `
            <div class="panel">
                <div class="panel-head"><div class="panel-title">Нове обладнання</div></div>

                <div class="field">
                    <label>Тип обладнання</label>
                    <input class="inp" id="eqType" type="text" placeholder="Напр. ESP32 DevKit v1" autocomplete="off">
                </div>

                <div class="field">
                    <label>Зображення</label>
                    <div class="img-drop">
                        <div>
                            <button class="btn" id="btnPick" type="button">＋ Додати зображення</button>
                            <input type="file" id="eqImages" accept="image/png,image/jpeg,image/svg+xml,image/gif,image/webp" multiple hidden>
                        </div>
                        <div class="img-grid" id="pendGrid"></div>
                    </div>
                </div>

                <div class="field">
                    <label>Додаткова інформація</label>
                    <textarea class="txt" id="eqInfo" placeholder="Піни, характеристики, нотатки…"></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" id="btnSaveEq">💾 Зберегти</button>
                    <button class="btn" id="btnCancelEq">Скасувати</button>
                    <span class="form-status" id="eqStatus"></span>
                </div>
            </div>`;

        const fileInp = document.getElementById("eqImages");
        const grid    = document.getElementById("pendGrid");

        function renderPend() {
            grid.innerHTML = "";
            pendingFiles.forEach((f, i) => {
                const src = URL.createObjectURL(f);
                const cell = document.createElement("div");
                cell.className = "img-cell";
                cell.innerHTML = `<img src="${src}" alt=""><button class="img-del" title="Прибрати">✕</button>`;
                cell.querySelector("img").addEventListener("click", () => openLightbox(src));
                cell.querySelector(".img-del").addEventListener("click", () => { pendingFiles.splice(i, 1); renderPend(); });
                grid.appendChild(cell);
            });
        }

        document.getElementById("btnPick").addEventListener("click", () => fileInp.click());
        fileInp.addEventListener("change", () => {
            for (const f of fileInp.files) pendingFiles.push(f);
            fileInp.value = "";
            renderPend();
        });

        document.getElementById("btnCancelEq").addEventListener("click", () => {
            mode = selectedId ? "view" : "empty"; renderContent();
        });

        document.getElementById("btnSaveEq").addEventListener("click", async () => {
            const statusEl = document.getElementById("eqStatus");
            const type = document.getElementById("eqType").value.trim();
            const info = document.getElementById("eqInfo").value;
            statusEl.className = "form-status";
            statusEl.textContent = "Збереження…";
            try {
                const rec = await apiJson("POST", "/knowledge", { type, info });
                if (pendingFiles.length) await apiUploadMany(`/knowledge/${encodeURIComponent(rec.id)}/images`, pendingFiles);
                selectedId = rec.id; mode = "view";
                await loadEquipment();
            } catch (e) {
                statusEl.className = "form-status err";
                statusEl.textContent = e.message;
            }
        });
    }

    // ── перегляд запису ─────────────────────────────────────────
    async function renderView() {
        const eq = equipment.find(x => x.id === selectedId);
        if (!eq) { mode = "empty"; return renderContent(); }

        let pins = (eq.pins || []).map(p => ({ pin: p.pin || "", function: p.function || "" }));

        contentEl.innerHTML = `
            <div class="panel">
                <div class="panel-head">
                    <div class="panel-title" id="viewTitle">${escapeHtml(eq.type)}</div>
                </div>

                <div class="field">
                    <label>Тип обладнання</label>
                    <input class="inp" id="editType" type="text" value="${escapeHtml(eq.type)}" autocomplete="off">
                </div>

                <div class="field">
                    <label>Платформа</label>
                    <select class="inp" id="editPlatform">
                        <option value=""${!eq.platform ? " selected" : ""}>— не вказано —</option>
                        <option value="esp32"${eq.platform === "esp32" ? " selected" : ""}>ESP32</option>
                        <option value="esp8266"${eq.platform === "esp8266" ? " selected" : ""}>ESP8266</option>
                    </select>
                </div>

                <div class="field">
                    <label>Зображення</label>
                    <div class="img-grid" id="viewImages"></div>
                    <div class="form-actions">
                        <button class="btn" id="btnMore">＋ Додати зображення</button>
                        <input type="file" id="moreImages" accept="image/png,image/jpeg,image/svg+xml,image/gif,image/webp" multiple hidden>
                        <span class="form-status" id="imgStatus"></span>
                    </div>
                </div>

                <div class="field">
                    <label>Піни контролера</label>
                    <div class="pins-wrap">
                        <table class="pins-table">
                            <thead><tr>
                                <th>Пін</th><th>Функціонал (виробника)</th><th></th>
                            </tr></thead>
                            <tbody id="kbPinsBody"></tbody>
                        </table>
                    </div>
                    <div><button class="btn" id="btnAddKbPin">＋ Додати рядок</button></div>
                </div>

                <div class="field">
                    <label>Додаткова інформація</label>
                    <textarea class="txt" id="editInfo" placeholder="Характеристики, нотатки, посилання…">${escapeHtml(eq.info || "")}</textarea>
                </div>

                <div class="form-actions actions-split">
                    <div class="left-actions">
                        <button class="btn btn-primary" id="btnSaveEq">💾 Зберегти</button>
                        <span class="form-status" id="saveStatus"></span>
                    </div>
                    <button class="btn danger" id="btnDelEq">🗑 Видалити</button>
                </div>
            </div>`;

        document.getElementById("btnDelEq").addEventListener("click", () => deleteEquipment(eq.id));

        // збереження типу + додаткової інформації
        document.getElementById("btnSaveEq").addEventListener("click", async () => {
            const st = document.getElementById("saveStatus");
            const type = document.getElementById("editType").value.trim();
            const platform = document.getElementById("editPlatform").value;
            const info = document.getElementById("editInfo").value;
            st.className = "form-status"; st.textContent = "Збереження…";
            try {
                const rec = await apiJson("PUT", `/knowledge/${encodeURIComponent(eq.id)}`, { type, platform, info, pins });
                const i = equipment.findIndex(x => x.id === rec.id);
                if (i >= 0) equipment[i] = rec;
                document.getElementById("viewTitle").textContent = rec.type;
                renderList();
                st.textContent = "✓ Збережено";
            } catch (e) { st.className = "form-status err"; st.textContent = e.message; }
        });

        const grid = document.getElementById("viewImages");
        const imgs = eq.images || [];
        if (imgs.length === 0) {
            grid.innerHTML = `<div class="img-empty">Зображень немає.</div>`;
        } else {
            for (const name of imgs) {
                const url = await imageURL(eq.id, name);
                const cell = document.createElement("div");
                cell.className = "img-cell";
                cell.innerHTML = `<img src="${url || ""}" alt=""><button class="img-del" title="Видалити">✕</button>`;
                if (url) cell.querySelector("img").addEventListener("click", () => openLightbox(url));
                cell.querySelector(".img-del").addEventListener("click", () => deleteImage(eq.id, name));
                grid.appendChild(cell);
            }
        }

        const moreInp = document.getElementById("moreImages");
        document.getElementById("btnMore").addEventListener("click", () => moreInp.click());
        moreInp.addEventListener("change", async () => {
            const files = [...moreInp.files];
            moreInp.value = "";
            if (!files.length) return;
            const st = document.getElementById("imgStatus");
            st.className = "form-status"; st.textContent = "Завантаження…";
            try {
                await apiUploadMany(`/knowledge/${encodeURIComponent(eq.id)}/images`, files);
                await loadEquipment();
            } catch (e) { st.className = "form-status err"; st.textContent = e.message; }
        });

        // ── піни контролера ──────────────────────────────────────
        function renderKbPinsTable() {
            const tb = document.getElementById("kbPinsBody");
            if (pins.length === 0) {
                tb.innerHTML = `<tr><td colspan="3" class="pins-empty">Пінів не додано. Натисніть «Додати рядок».</td></tr>`;
                return;
            }
            tb.innerHTML = "";
            pins.forEach((p, i) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><input class="cell-inp" data-f="pin" value="${escapeHtml(p.pin)}" placeholder="напр. GPIO4"></td>
                    <td><input class="cell-inp" data-f="function" value="${escapeHtml(p.function)}" placeholder="напр. GPIO, ADC1_CH0, Touch"></td>
                    <td><button class="act danger" data-act="del" title="Видалити рядок">🗑</button></td>`;
                tr.querySelector('[data-f="pin"]').addEventListener("input", e => pins[i].pin = e.target.value);
                tr.querySelector('[data-f="function"]').addEventListener("input", e => pins[i].function = e.target.value);
                tr.querySelector('[data-act="del"]').addEventListener("click", () => { pins.splice(i, 1); renderKbPinsTable(); });
                tb.appendChild(tr);
            });
        }
        document.getElementById("btnAddKbPin").addEventListener("click", () => {
            pins.push({ pin: "", function: "" });
            renderKbPinsTable();
        });
        renderKbPinsTable();
    }

    async function deleteImage(id, name) {
        if (!confirm("Видалити це зображення?")) return;
        try {
            await apiJson("DELETE", `/knowledge/${encodeURIComponent(id)}/images/${encodeURIComponent(name)}`);
            await loadEquipment();
        } catch (e) { alert(e.message); }
    }

    async function deleteEquipment(id) {
        const eq = equipment.find(x => x.id === id);
        if (!eq) return;
        if (!confirm(`Видалити обладнання «${eq.type}» з бази знань?`)) return;
        try {
            await apiJson("DELETE", "/knowledge/" + encodeURIComponent(id));
            if (selectedId === id) { selectedId = null; mode = "empty"; }
            await loadEquipment();
        } catch (e) { alert(e.message); }
    }

    function escapeHtml(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // ── лайтбокс (збільшене зображення) ─────────────────────────
    const lightbox = document.getElementById("lightbox");
    function openLightbox(src) {
        lightbox.querySelector("img").src = src;
        lightbox.classList.add("show");
    }
    lightbox.addEventListener("click", () => lightbox.classList.remove("show"));
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") lightbox.classList.remove("show");
    });

    // ── старт ───────────────────────────────────────────────────
    renderContent();
    loadEquipment();
</script>
</body>
</html>
