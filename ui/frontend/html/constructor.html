        get gridImg() {
            return `linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px)`;
        },
        cvBgImage() {
            const layers = [];
            if (this.sc.snap) layers.push(this.gridImg);
            if (this.sc.bgImage) layers.push(`url(${this.sc.bgImage})`);
            return layers.length ? layers.join(',') : 'none';
        },
        cvBgSize() {
            const sizes = [];
            if (this.sc.snap) sizes.push(`${this.sc.grid}px ${this.sc.grid}px`, `${this.sc.grid}px ${this.sc.grid}px`);
            if (this.sc.bgImage) sizes.push('100% 100%');
            return sizes.join(',') || 'auto';
        },
        get selEl()     { return (this._selIdx >= 0 && this._selIdx < this.els.length) ? this.els[this._selIdx] : {}; },
        selectEl(id) {
            this.sel = id ?? null;
            this._selIdx = id ? this.els.findIndex(e => e.id === id) : -1;
            // back-fill scale fields for legacy elements (treat current size
            // as the 100% base — user can rescale relative from there)
            if (this._selIdx >= 0) {
                const e = this.els[this._selIdx];
                if (e.baseW == null) e.baseW = e.w;
                if (e.baseH == null) e.baseH = e.h;
                if (e.scale == null) e.scale = 100;
            }
            this.selIndQ = 'GOOD'; this.selLevelColor = 'colorGood'; this.selGaugeColor = 'colorGood'; this.selCtrlColor = 'colorManual';
        },
        screenType(s)    { return s?.screenType || 'pc'; },
        screenTypeCfg(s) { return this.SCREEN_TYPES[this.screenType(s)] || this.SCREEN_TYPES.pc; },
        screenColor(s)   { return this.screenTypeCfg(s).color; },
        get screenTypeList() {
            return Object.entries(this.SCREEN_TYPES).map(([key, v]) => ({ key, ...v }));
        },
        get allScreenNums() {
            const s = new Set(this.project.screens.map(s => s.screenNum).filter(n => n > 0));
            return [...s].sort((a, b) => a - b);
        },
        get allDeviceTypes() {
            const s = new Set(this.project.screens.map(s => s.deviceType || 1));
            return [...s].sort((a, b) => a - b);
        },
        // Flat column list (screenType × deviceType). Header and body iterate this
        // same array, so columns can't drift out of alignment.
        get tableColumns() {
            const cols = [];
            for (const st of this.screenTypeList)
                for (const dt of this.allDeviceTypes)
                    cols.push({ key: st.key + '-' + dt, stKey: st.key, color: st.color, dt });
            return cols;
        },
        tableCell(screenNum, sType, deviceType) {
            return this.project.screens.find(s =>
                s.screenNum === screenNum &&
                (s.screenType || 'pc') === sType &&
                (s.deviceType || 1) === deviceType
            ) || null;
        },
        nextId(type) {
            const cfg = this.SCREEN_TYPES[type];
            if (!cfg) return 'X1';
            const prefix = cfg.prefix;
            const re = new RegExp(`^${prefix}(\\d+)$`);
            const nums = this.project.screens
                .map(s => { const m = s.id.match(re); return m ? parseInt(m[1]) : 0; })
                .filter(n => n > 0);
            return prefix + ((nums.length ? Math.max(...nums) : 0) + 1);
        },
        sameTypeScreens(type) {
            return this.project.screens.filter(s => this.screenType(s) === type);
        },

            if (this.mode !== 'elements') return 'pc';
            const s = this.project.screens.find(s => s.id === this.sc?.id);

        sZoom(e) {
            if (!e.ctrlKey) return;
            const delta = e.deltaY < 0 ? 1.1 : 0.9;
            this._sScale = Math.min(3, Math.max(0.2, this._sScale * delta));

        async init() {
            window.addEventListener("resize", () => this.updateScale());
            document.addEventListener("keydown", e => {
                if (e.key === "Escape") { this.ctxClose(); return; }
                if ((e.key==="Delete"||e.key==="Backspace") &&
                    !["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)) {
                    if (this.mode==="elements" && this.sel) this.delEl();
                }
            });
            document.addEventListener("click", () => this.ctxClose());
            // load project and points list in parallel — points needed for
            // bistable point_id dropdown to show the bound point on first click
            await Promise.all([this.loadProject(), this.loadAllPoints()]);
        },

        async loadAllPoints() {
            try {
                const res = await fetch("/adm/api/points", { headers: authHeaders() });
                if (res.ok) this.allPoints = await res.json();
            } catch(e) { console.error("loadAllPoints:", e); }
        },

        // Apply selEl.scale (%) to baseW/baseH proportionally. Direct W/H
        // edits should call setElW/setElH which re-anchor the base.
        applyScale() {
            if (this._selIdx < 0) return;
            const el = this.els[this._selIdx];
            const k = (el.scale || 100) / 100;
            if (!(k > 0)) return;
            if (el.baseW == null) el.baseW = el.w;
            if (el.baseH == null) el.baseH = el.h;
            el.w = Math.min(1, Math.max(0.005, el.baseW * k));
            el.h = Math.min(1, Math.max(0.005, el.baseH * k));
        },
        // Direct W/H edits re-anchor the base and reset scale to 100% so the
        // percentage field always reflects "from current size".
        setElW(px) {
            if (this._selIdx < 0) return;
            const el = this.els[this._selIdx];
            el.w = px / this.sc.width;
            el.baseW = el.w; el.baseH = el.h; el.scale = 100;
        },
        setElH(px) {
            if (this._selIdx < 0) return;
            const el = this.els[this._selIdx];
            el.h = px / this.sc.height;
            el.baseW = el.w; el.baseH = el.h; el.scale = 100;
        },

        setStatus(msg, ok=true) { this.status = { msg, ok }; },

        setElTarget(target) {
            if (this._selIdx >= 0 && this._selIdx < this.els.length)
                this.els[this._selIdx].target = target;
        },

        // ── indicator quality colors ───────────────────────────────────────────
        _indKeys(q) {
            return { GOOD:   ['color',       'borderColor'],
                     WARN:   ['colorWarn',   'borderColorWarn'],
                     ALARM:  ['colorAlarm',  'borderColorAlarm'],
                     UNCERT: ['colorUncert', 'borderColorUncert'] }[q] || ['color','borderColor'];
        },
        indFill(el, q)   { const [k] = this._indKeys(q);    return el[k]   || '#888'; },
        indBorder(el, q) { const [, k] = this._indKeys(q);  return el[k]   || '#555'; },
        setIndFill(el, q, v)   { const [k] = this._indKeys(q);   el[k] = v; },
        setIndBorder(el, q, v) { const [, k] = this._indKeys(q); el[k] = v; },

        // ── bistable helpers ──────────────────────────────────────────────────
        // Constructor has no live point data — render in OFF state with quality
        // colours that show what user will see at runtime. Same renderer is
        // shared by the runtime viewer (index.html) which passes real value/q.
        bistableSvg(el, value, quality) {
            // value: 0|1|null  quality: GOOD|WARN|ALARM|UNCERT|NODATA|INIT
            const isOn = value === 1;
            const valid = (value === 0 || value === 1);
            const isAlarm = quality === "ALARM";
            const isWarn  = quality === "WARN";
            const noData  = !valid || quality === "NODATA" || quality === "UNCERT" || quality === "INIT";

            // colors from element (with safe fallbacks for legacy elements)

            const cOff    = el.colorOff    || "#484f58";
            const cWarn   = el.colorWarn   || "#f0ad4e";

            const cUncert = el.colorUncert || "#8b949e";
            const cStroke = el.colorBorder || "#8b949e";

            const accent = noData    ? cUncert
                         : isAlarm   ? cAlarm
                         : isWarn    ? cWarn
                         : isOn      ? cOn

            const dash = noData ? `stroke-dasharray="3,3"` : ``;

            switch (el.type) {
                case "bi_pump": return `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <line x1="0" y1="50" x2="18" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <line x1="82" y1="50" x2="100" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <circle cx="50" cy="50" r="32" fill="${bg}" stroke="${accent}" stroke-width="3" ${dash}/>
                        <path d="M50,22 Q70,50 50,78" stroke="${accent}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <path d="M22,50 Q50,30 78,50" stroke="${accent}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="4" fill="${accent}"/>
                    </svg>`;

                case "bi_motor": return `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <line x1="0" y1="50" x2="22" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <line x1="78" y1="50" x2="100" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <rect x="22" y="22" width="56" height="56" rx="6" fill="${bg}" stroke="${accent}" stroke-width="3" ${dash}/>
                        <text x="50" y="62" text-anchor="middle" fill="${accent}" font-size="34" font-weight="700" font-family="system-ui">M</text>

                case "bi_valve": {

                    // open is two outlines pointing outward
                    const blade = isOn
                        ? `<polygon points="20,30 50,50 20,70" fill="none" stroke="${accent}" stroke-width="3"/>
                           <polygon points="80,30 50,50 80,70" fill="none" stroke="${accent}" stroke-width="3"/>`
                        : `<polygon points="20,30 50,50 20,70" fill="${accent}" stroke="${accent}" stroke-width="2"/>
                           <polygon points="80,30 50,50 80,70" fill="${accent}" stroke="${accent}" stroke-width="2"/>`;
                    return `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">

                        <line x1="80" y1="50" x2="100" y2="50" stroke="${pipe}" stroke-width="3"/>
                        ${blade}
                        <line x1="50" y1="50" x2="50" y2="20" stroke="${accent}" stroke-width="2.5"/>

                        ? `<line x1="60" y1="35" x2="90" y2="35" stroke="${accent}" stroke-width="3"/>`

                    return `
                    <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <rect x="6" y="20" width="40" height="22" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <text x="26" y="36" text-anchor="middle" fill="${accent}" font-size="14" font-weight="600" font-family="system-ui">~</text>
                        <circle cx="60" cy="35" r="3" fill="${accent}"/>
                        <circle cx="90" cy="35" r="3" fill="${accent}"/>
                        ${contact}
                    </svg>`;
                }

                case "bi_reed": {
                    // glass tube with two reeds; closed when ON
                    const reedR = isOn
                        ? `<line x1="55" y1="20" x2="80" y2="20" stroke="${accent}" stroke-width="3"/>`
                        : `<line x1="55" y1="20" x2="80" y2="14" stroke="${accent}" stroke-width="3"/>`;
                    return `
                    <svg viewBox="0 0 100 40" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <rect x="8" y="6" width="84" height="28" rx="14" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <line x1="0" y1="20" x2="20" y2="20" stroke="${pipe}" stroke-width="2.5"/>
                        <line x1="80" y1="20" x2="100" y2="20" stroke="${pipe}" stroke-width="2.5"/>
                        <line x1="20" y1="20" x2="45" y2="20" stroke="${accent}" stroke-width="3"/>
                        ${reedR}
                    </svg>`;
                }

                case "bi_optical": {
                    // beam visible when ON (path clear), absent when OFF (blocked)
                    const beam = isOn
                        ? `<line x1="22" y1="25" x2="78" y2="25" stroke="${accent}" stroke-width="3" stroke-linecap="round"/>`
                        : `<line x1="22" y1="25" x2="48" y2="25" stroke="${accent}" stroke-width="2.5" stroke-dasharray="4,4"/>`;
                    return `
                    <svg viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <rect x="0"  y="10" width="22" height="30" rx="3" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <rect x="78" y="10" width="22" height="30" rx="3" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <circle cx="20" cy="25" r="3" fill="${accent}"/>
                        <circle cx="80" cy="25" r="3" fill="${accent}"/>
                        ${beam}
                    </svg>`;
                }
            }
            return "";

        // Constructor preview: pick the state being edited in the colour
        // dropdown so the user sees colorOn / colorWarn / etc. immediately.
        // Non-selected elements always show OFF.
        bistableSvgPreview(el) {
            let v = 0;
            let q = el.point_id ? "GOOD" : "NODATA";
            const isSelected = this._selIdx >= 0 && this.els[this._selIdx]?.id === el.id;
            if (isSelected) {
                const sel = this.selBiColor;
                if      (sel === 'colorOn')     { v = 1; q = "GOOD"; }
                else if (sel === 'colorOff')    { v = 0; q = "GOOD"; }
                else if (sel === 'colorWarn')   { v = 1; q = "WARN"; }
                else if (sel === 'colorAlarm')  { v = 1; q = "ALARM"; }
                else if (sel === 'colorUncert') { q = "UNCERT"; }
            }
            return this.bistableSvg(el, v, q);
        },
        // Look up the bound discrete point label for the current value

        // ── bi_image: pick which user-uploaded image fits current state ──────
        biImageSrc(el, value, quality) {
            if (quality === "ALARM" && el.imageAlarm) return el.imageAlarm;
            if ((quality === "UNCERT" || quality === "NODATA" || quality === "INIT") && el.imageUncert) return el.imageUncert;
            if (value === 1 && el.imageOn)  return el.imageOn;
            if (value === 0 && el.imageOff) return el.imageOff;
            return "";
        },
        biImageBgStyle(src) {
            if (!src) return "";
            return `background-image:url(${src});background-size:contain;background-repeat:no-repeat;background-position:center;`;
        },
        // Constructor preview: cycle the slot the user is most likely to have
        // configured first (Off → On → anything available), so the canvas
        // shows something even before binding a point.
        biImagePreview(el) {
            return el.imageOff || el.imageOn || el.imageUncert || el.imageAlarm || "";
        },
        // Upload helper for bi_image — slot is one of imageOn / imageOff / ...
        uploadBiImage(slot, e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                if (this._selIdx >= 0) this.els[this._selIdx][slot] = ev.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = "";

        // ── gauge helpers ─────────────────────────────────────────────────────
        _gaugeArcPath(cx, cy, r, a1, a2) {
            if (Math.abs(a2 - a1) < 0.1) return null;
            const rd = Math.PI / 180;
            const x1 = cx + r * Math.cos(a1*rd), y1 = cy + r * Math.sin(a1*rd);
            const x2 = cx + r * Math.cos(a2*rd), y2 = cy + r * Math.sin(a2*rd);
            const sw = ((a2 - a1) % 360 + 360) % 360;
            return `M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${sw>180?1:0} 1 ${x2.toFixed(2)},${y2.toFixed(2)}`;

        _gaugeValAngle(mn, mx, v) {
            return 135 + Math.min(1, Math.max(0, (v - mn) / ((mx - mn) || 1))) * 270;
        },
        _gaugeSVGHtml(el, value) {
            const cx=50, cy=56, r=36, aw=el.arcWidth||10, SA=135, EA=405;
            const mn=el.min, mx=el.max;
            const cG=el.colorGood||'#56d364', cW=el.colorWarn||'#f0ad4e', cA=el.colorAlarm||'#f47067';
            // chain-clamp so mn ≤ aMin ≤ wMin ≤ wMax ≤ aMax ≤ mx regardless of
            // how the thresholds are entered — zones stay well-formed (never inverted)
            const _cl=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
            const aMin=_cl(el.alarm_min??mn, mn,   mx);
            const wMin=_cl(el.warn_min ??aMin, aMin, mx);
            const wMax=_cl(el.warn_max ??mx,  wMin, mx);
            const aMax=_cl(el.alarm_max??wMax, wMax, mx);
            const zones=[];
            if(aMin>mn)   zones.push([mn,aMin,cA]);
            if(wMin>aMin) zones.push([aMin,wMin,cW]);
            zones.push([wMin,wMax,cG]);
            if(aMax>wMax) zones.push([wMax,aMax,cW]);
            if(mx>aMax)   zones.push([aMax,mx,cA]);
            const bgPath = this._gaugeArcPath(cx,cy,r,SA,EA);
            const zArcs = zones.map(([f,t,c])=>{
                const p=this._gaugeArcPath(cx,cy,r,this._gaugeValAngle(mn,mx,f),this._gaugeValAngle(mn,mx,t));
                return p?`<path d="${p}" fill="none" stroke="${c}" stroke-width="${aw}" stroke-linecap="butt"/>`:''
            }).join('');

            const nLen=r-aw/2-2;
            const nx1=(cx-5*Math.cos(ang)).toFixed(2), ny1=(cy-5*Math.sin(ang)).toFixed(2);
            const nx2=(cx+nLen*Math.cos(ang)).toFixed(2), ny2=(cy+nLen*Math.sin(ang)).toFixed(2);
            const nc=el.needleColor||'#e6edf3';
            const dispVal=isNaN(value)?'—':String(parseFloat(value.toFixed(2)));
            const vTxt=el.showValue?`<text x="${cx}" y="${cy+r-4}" text-anchor="middle" fill="${el.color||'#e6edf3'}" font-size="${el.fontSize||13}" font-family="system-ui,sans-serif" font-weight="600">${dispVal}</text>`:'';
            const lTxt=el.label?`<text x="${cx}" y="8" text-anchor="middle" fill="${el.labelColor||'#8b949e'}" font-size="${el.labelFontSize||11}" font-family="system-ui,sans-serif">${el.label}</text>`:'';
            return `<svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path d="${bgPath}" fill="none" stroke="#21262d" stroke-width="${aw}" stroke-linecap="butt"/>
              ${zArcs}
              <line x1="${nx1}" y1="${ny1}" x2="${nx2}" y2="${ny2}" stroke="${nc}" stroke-width="2" stroke-linecap="round"/>
              <circle cx="${cx}" cy="${cy}" r="3.5" fill="${nc}"/>
              ${vTxt}${lTxt}</svg>`;
        },
        cGaugeSVGHtml(el) {
            const e = this._gaugeEffEl(el);
            return this._gaugeSVGHtml(e, e.min + (e.max - e.min) * 0.6);
        },
        // Effective limits for a gauge: element's own when «Ручне налаштування границь»
        // is on, otherwise inherited from the bound point (allPoints) — mirrors the
        // live screen (_ptLim), so the preview shows what will actually render.
        _gaugeEffEl(el) {
            if (el.manualLimits) return el;
            const pt = this.allPoints.find(p => String(p.id) === String(el.point_id));
            if (!pt) return el;
            const n = (a, b) => { const v = parseFloat(a); return isNaN(v) ? b : v; };
            return { ...el,
                min:      n(pt.min, el.min),           max:      n(pt.max, el.max),
                warn_min: n(pt.warn_min, el.warn_min), warn_max: n(pt.warn_max, el.warn_max),
                alarm_min:n(pt.alarm_min, el.alarm_min), alarm_max:n(pt.alarm_max, el.alarm_max),
            };
        },

                         stroke="${el.strokeColor||'#58a6ff'}" stroke-width="${sw}"
                         opacity="${el.opacity??1}"/>
            </svg>`;
        },
        cLineSVGHtml(el) {
            const sw = el.strokeWidth || 2;
            const W  = Math.round(el.w * this.sc.width);
            const H  = Math.round(el.h * this.sc.height);
            const x1 = (el.x1??0)   / 100 * W, y1 = (el.y1??0)   / 100 * H;
            const x2 = (el.x2??100) / 100 * W, y2 = (el.y2??100) / 100 * H;
            const dash = el.dashed ? `stroke-dasharray="${el.dashLen||8},${el.dashGap||4}"` : '';
            return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" overflow="visible" xmlns="http://www.w3.org/2000/svg">
                <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"

        },
        cActiveLineSVGHtml(el) {
            const s   = this.alState;
            const sw  = el.strokeWidth || 4;
            const W   = Math.round(el.w * this.sc.width);
            const H   = Math.round(el.h * this.sc.height);
            const x1  = (el.x1??0)   / 100 * W, y1 = (el.y1??50) / 100 * H;
            const x2  = (el.x2??100) / 100 * W, y2 = (el.y2??50) / 100 * H;
            const color  = s ? (el.color1||'#56d364') : (el.color0||'#484f58');

                <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
                      stroke="${color}" stroke-width="${sw}" stroke-linecap="round" ${dash} style="${vis}"/>
            </svg>`;
        },
        cActiveArcSVGHtml(el) {
            const s    = this.alState;
            const sw   = el.strokeWidth || 4;
            const W    = Math.round(el.w * this.sc.width);
            const H    = Math.round(el.h * this.sc.height);

            const rxS  = rx.toFixed(2), ryS = ry.toFixed(2);

            const eff    = s ? (el.effect1||'static') : (el.effect0||'static');
            const dLen   = s ? (el.dashLen1||12) : (el.dashLen0||8);

            } else {

        },
        cArrowSVGHtml(el) {

                down:  `${h},${h}       ${100-h},${h}     50,${100-h}`,
                right: `${h},${h}       ${100-h},50        ${h},${100-h}`,

                         stroke="${el.strokeColor||'#58a6ff'}" stroke-width="${sw}"

        cArcSVGHtml(el) {

            if (span >= 360) {

        },

        // ── level helpers ──────────────────────────────────────────────────────
        cLevelFill(el, pct) {
            const color = el.colorGood || '#56d364';
            const scale = pct / 100;
            return el.type === 'level_v'
                ? `position:absolute;bottom:0;left:0;right:0;height:100%;background:${color};transform:scaleY(${scale});transform-origin:bottom center`
                : `position:absolute;top:0;left:0;bottom:0;width:100%;background:${color};transform:scaleX(${scale});transform-origin:left center`;
        },

        // ── API ────────────────────────────────────────────────────────────────
        async apiGet(path) {
            const r = await fetch(path, { headers: authHeaders() });
            if (r.status===404) return null;
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        },
        async apiPut(path, data) {
            const r = await fetch(path, {
                method:"PUT", headers:{...authHeaders(),"Content-Type":"application/json"},
                body: JSON.stringify(data),
            });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
        },
        async apiDelete(path) {
            const r = await fetch(path, { method:"DELETE", headers: authHeaders() });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
        },

        // ── project ────────────────────────────────────────────────────────────
        async loadProject() {
            try {
                const p = await this.apiGet("/api/project");
                if (p) {
                    this.decos   = p.decos   ?? [];
                    this.project = { screens: p.screens ?? [] };
                }
                // auto-assign screenNum and deviceType to existing screens
                const counters = {};
                this.project.screens.forEach(s => {
                    if (!s.screenNum) {
                        const m = s.id.match(/^[A-Za-z](\d+)$/);
                        if (m) { s.screenNum = parseInt(m[1]); }
                        else {
                            const t = s.screenType || 'pc';
                            counters[t] = (counters[t] || 0) + 1;
                            s.screenNum = counters[t];
                        }
                    }
                    if (!s.deviceType) s.deviceType = 1;
                });
                this.setStatus("Проект завантажено");
            } catch(e) { this.setStatus("Помилка: "+e.message, false); }
        },

        async saveProject() {
            await this.apiPut("/api/project", { ...this.project, decos: this.decos });
        },

        // Архів екранів → на диск користувача. Пакується стан НА СЕРВЕРІ,
        // тож незбережені правки сюди не потраплять — спершу «Зберегти».
        async downloadBackup() {
            try {
                this.setStatus("Готую резервну копію…");
                const r = await fetch("/api/backup", { headers: authHeaders() });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const blob = await r.blob();
                const cd   = r.headers.get("Content-Disposition") || "";
                const m    = cd.match(/filename="([^"]+)"/);
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement("a");
                a.href = url;
                a.download = m ? m[1] : "infrabox-screens.zip";
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                this.setStatus(`Резервну копію завантажено (${(blob.size/1024).toFixed(0)} КБ)`);
            } catch (e) { this.setStatus("Помилка: " + e.message, false); }
        },

        getScreenPath(id) {
            return id;  // плоска структура: screens/{id}/screen.json
        },

        cacheCurrentScreen() {
            if (!this.sc.id) return;
            this.screenCache[this.sc.id] = {
                screen:   JSON.parse(JSON.stringify(this.sc)),
                elements: JSON.parse(JSON.stringify(this.els)),
            };
        },

        async saveAll() {
            this.cacheCurrentScreen();
            // тільки екрани, що є в project — щоб не зберігати «примари» старих сесій
            const ids = Object.keys(this.screenCache)
                .filter(id => this.project.screens.some(s => s.id === id));
            let ok=0, fail=0;
            for (const id of ids) {
                try {
                    const path = this.getScreenPath(id);
                    await this.apiPut(`/api/screens/${path}`, this.screenCache[id]);
                    ok++;
                } catch { fail++; }
            }
            await this.saveProject();
            this.setStatus(fail ? `Збережено ${ok}, помилок ${fail}` : ids.length ? `Збережено ${ids.length} екранів` : "Проект збережено", !fail);
        },

        // ── structure: create ─────────────────────────────────────────────────
        openCreate(type = 'pc') {
            this._createType = type;
            document.getElementById("newTitle").value = "";
            document.getElementById("createErr").style.display = "none";
            this.createModal.open = true;
            this.$nextTick(() => document.getElementById("newTitle").focus());
        },

        async createScreen() {
            const id    = this.nextId(this._createType);
            const title = document.getElementById("newTitle").value.trim() || id;
            const err   = document.getElementById("createErr");

            // авто-позиція: просто по кількості екранів
            const count = this.project.screens.length;
            const x = (count % 10) * 200 + 40;
            const y = Math.floor(count / 10) * 120 + 40;

            const m = id.match(/^[A-Za-z](\d+)$/);
            const screenNum  = m ? parseInt(m[1]) : (this.project.screens.filter(s=>(s.screenType||'pc')===this._createType).length + 1);
            const deviceType = this._createDevType || 1;
            this.project.screens.push({ id, title, x, y, screenType: this._createType, screenNum, deviceType });
            this.createModal.open = false;
            this.selNodeId = id;

            // одразу створюємо директорію екрана + background/ на диску
            try {
                const path = this.getScreenPath(id);
                const initData = {
                    screen:   { id, title, width:1280, height:720, grid:20, snap:true, bg:"#1a1a2e", bgImage:"" },
                    elements: [],
                };
                await this.apiPut(`/api/screens/${path}`, initData);
                this.screenCache[id] = initData;
                this.setStatus(`Екран «${title}» створено`);
            } catch(e) {
                this.setStatus(`Екран «${title}» додано (збережіть вручну)`, false);
            }
        },

        // ── structure: delete ─────────────────────────────────────────────────
        confirmDeleteNode() {
            const node = this.selNode;
            if (!node) return;
            this.deleteModal = { open:true, node };
        },

        async doDelete() {
            const { node } = this.deleteModal;
            this.deleteModal.open = false;
            try {
                await this.apiDelete(`/api/screens/${this.getScreenPath(node.id)}`).catch(()=>{});
                this.project.screens = this.project.screens.filter(s=>s.id!==node.id);
                delete this.screenCache[node.id];
                await this.saveProject();
                if (this.selNodeId===node.id) this.selNodeId=null;
                this.setStatus(`Екран «${node.title}» видалено`);
            } catch(e) { this.setStatus("Помилка: "+e.message, false); }
        },

        // ── structure: node drag ──────────────────────────────────────────────
        nodeDown(e, node) {
            this.selNodeId = node.id;
            this.selDecoId = null;
            this._ndrag    = node;
            const r = document.getElementById("structCanvas").getBoundingClientRect();
            this._noff.x = e.clientX - r.left - (node.x||0);
            this._noff.y = e.clientY - r.top  - (node.y||0);
        },

        // ── deco ──────────────────────────────────────────────────────────────
        decodrag(e, type) { e.dataTransfer.setData("decoType", type); },

        decoDrop(e) {
            const type = e.dataTransfer.getData("decoType");
            if (!type) return;
            const r = document.getElementById("structCanvas").getBoundingClientRect();
            const x = this.snapV(e.clientX - r.left);
            const y = this.snapV(e.clientY - r.top);
            const id = "deco_" + Date.now();
            this.decos.push({ id, type, x, y, ...this.decoDefaults[type] });
            this.selDecoId = id;
            this.selNodeId = null;
        },

        decoDown(e, d) {
            this.selDecoId = d.id;
            this.selNodeId = null;
            this._ddrag = d;
            const r = document.getElementById("structCanvas").getBoundingClientRect();
            this._doff.x = e.clientX - r.left - d.x;
            this._doff.y = e.clientY - r.top  - d.y;
            // collect children inside group for block move
            if (d.type === 'group') {
                this._groupChildren = [
                    ...this.project.screens.filter(n => this._insideGroup(n, d)),
                    ...this.decos.filter(c => c.id !== d.id && this._insideGroup(c, d)),
                ].map(o => ({ obj: o, dx: o.x - d.x, dy: o.y - d.y }));
            } else {
                this._groupChildren = [];
            }
        },

        _insideGroup(obj, g) {
            return obj.x >= g.x && obj.y >= g.y &&
                   (obj.x + (obj.w||160)) <= (g.x + g.w) &&
                   (obj.y + (obj.h||56))  <= (g.y + g.h);
        },

        resizeDown(e, d, handle) {
            e.stopPropagation();
            this._rdrag = { deco: d, handle, startX: e.clientX, startY: e.clientY, startW: d.w, startH: d.h };
        },

        delDeco() {
            if (!this.selDecoId) return;
            this.decos = this.decos.filter(d => d.id !== this.selDecoId);
            this.selDecoId = null;
        },

        // ── open elements mode ────────────────────────────────────────────────
        async openElements(id) {
            this.cacheCurrentScreen();
            try {
                this.setStatus("Завантаження…");
                const node = this.project.screens.find(s=>s.id===id);
                if (this.screenCache[id]) {
                    this.sc  = this.screenCache[id].screen;
                    this.els = this.screenCache[id].elements;
                } else {
                    const path = this.getScreenPath(id);
                    const data = await this.apiGet(`/api/screens/${path}`);
                    if (data) {
                        this.sc  = data.screen;
                        this.els = data.elements;
                    } else {
                        this.sc  = { id, title:node?.title??id, width:1280, height:720, grid:20, snap:true, bg:"#1a1a2e", bgImage:"" };
                        this.els = [];
                    }
                    this.screenCache[id] = {
                        screen:   JSON.parse(JSON.stringify(this.sc)),
                        elements: JSON.parse(JSON.stringify(this.els)),
                    };
                }
                // міграція: старі дані мають x/y/w/h в пікселях (>1), конвертуємо в частки
                this.els.forEach(el => {
                    if (el.x > 1) el.x = el.x / this.sc.width;
                    if (el.y > 1) el.y = el.y / this.sc.height;
                    if (el.w > 1) el.w = el.w / this.sc.width;
                    if (el.h > 1) el.h = el.h / this.sc.height;
                });
                this._bgAspect = (this.sc.bgImage && this.sc.width > 0) ? this.sc.height / this.sc.width : null;
                this._refW = this.sc.width;
                this._refH = this.sc.height;
                this.sel = null;
                this._selIdx = -1;
                this.mode = "elements";
                this.setStatus(`Екран «${this.sc.title}»`);
                this.$nextTick(() => {
                    this.updateScale();
                    const _ca = document.getElementById('ca');
                    if (_ca && !_ca._zoomBound) {
                        _ca._zoomBound = true;
                        _ca.addEventListener('wheel', (e) => {
                            if (!e.ctrlKey) return;
                            e.preventDefault();
                            const step     = e.deltaY < 0 ? 0.1 : -0.1;
                            const oldScale = this._scale;
                            const newScale = Math.max(0.1, Math.min(4, parseFloat((oldScale + step).toFixed(2))));
                            if (newScale === oldScale) return;
                            const rect  = _ca.getBoundingClientRect();
                            const mx    = e.clientX - rect.left;
                            const my    = e.clientY - rect.top;
                            const ratio = newScale / oldScale;
                            _ca.scrollLeft = (_ca.scrollLeft + mx) * ratio - mx;
                            _ca.scrollTop  = (_ca.scrollTop  + my) * ratio - my;
                            this._scale = newScale;
                        }, { passive: false });
                    }
                });
            } catch(e) { this.setStatus("Помилка: "+e.message, false); }
        },

        // ── elements canvas ───────────────────────────────────────────────────
updateScale() {
            const ca = document.getElementById("ca");
            if (!ca) return;
            const sw = (ca.clientWidth  - 32) / this.sc.width;
            const sh = (ca.clientHeight - 32) / this.sc.height;
            this._scale = Math.min(sw, sh, 1);
        },

        snap(v, g) { return this.sc.snap ? Math.round(v/g)*g : Math.round(v); },

        palDrag(e, type) { e.dataTransfer.setData("elType", type); },

        drop(e) {
            const type = e.dataTransfer.getData("elType");
            if (!type) return;
            const cv = document.getElementById("cv");
            if (!cv) return;
            const r  = cv.getBoundingClientRect();
            const def = this.defaults[type];
            const xpx = this.snap((e.clientX - r.left) / this._scale - def.w / 2, this.sc.grid);
            const ypx = this.snap((e.clientY - r.top)  / this._scale - def.h / 2, this.sc.grid);
            const id = "el_" + Date.now();
            if (!this._refW) { this._refW = this.sc.width; this._refH = this.sc.height; }
            const refW = this._refW;
            const refH = this._refH;
            const wFrac = def.w / refW;
            const hFrac = def.h / refH;
            this.els.push({ id, type,
                x: Math.max(0, xpx / this.sc.width),
                y: Math.max(0, ypx / this.sc.height),
                ...def,
                w: wFrac, h: hFrac,
                // base dimensions captured at drop time — scale% is computed
                // relative to these so changing it remembers the percentage
                baseW: wFrac, baseH: hFrac,
                scale: 100,
            });
            this._selIdx = this.els.length - 1;
            this.sel = id;
        },

        endpointDown(e, el, point) {
            this.selectEl(el.id);
            // save canvas fractions of the FIXED (non-dragged) endpoint
            const fix = point === 'start'
                ? { x: el.x + (el.x2/100)*el.w, y: el.y + (el.y2/100)*el.h }
                : { x: el.x + (el.x1/100)*el.w, y: el.y + (el.y1/100)*el.h };
            this._epdrag = { el, point, fix };
        },

        // recompute bbox + relative coords from two canvas-fraction endpoints.
        // Always keeps ≥14px hit area centered on the line midpoint so horizontal
        // and vertical lines remain grabbable.
        _lineSetEndpoints(el, ax, ay, bx, by) {
            const padW = 7 / this.sc.width;
            const padH = 7 / this.sc.height;
            const lx = Math.min(ax, bx) - padW;
            const rx = Math.max(ax, bx) + padW;
            const ty = Math.min(ay, by) - padH;
            const dy = Math.max(ay, by) + padH;
            const nw = rx - lx, nh = dy - ty;
            el.x = lx; el.y = ty; el.w = nw; el.h = nh;
            el.x1 = Math.round((ax - lx) / nw * 100);
            el.y1 = Math.round((ay - ty) / nh * 100);
            el.x2 = Math.round((bx - lx) / nw * 100);
            el.y2 = Math.round((by - ty) / nh * 100);
        },

        // canvas-pixel getters for property panel
        epPx(el, which, axis) {
            const cf = which === 'start'
                ? { x: el.x + (el.x1/100)*el.w, y: el.y + (el.y1/100)*el.h }
                : { x: el.x + (el.x2/100)*el.w, y: el.y + (el.y2/100)*el.h };
            return Math.round(cf[axis] * (axis === 'x' ? this.sc.width : this.sc.height));
        },

        setEndpointPx(el, which, axis, px) {
            const ax = el.x + (el.x1/100)*el.w, ay = el.y + (el.y1/100)*el.h;
            const bx = el.x + (el.x2/100)*el.w, by = el.y + (el.y2/100)*el.h;
            const f  = px / (axis === 'x' ? this.sc.width : this.sc.height);
            let nax=ax, nay=ay, nbx=bx, nby=by;
            if (which === 'start') { if (axis==='x') nax=f; else nay=f; }
            else                   { if (axis==='x') nbx=f; else nby=f; }
            this._lineSetEndpoints(el, nax, nay, nbx, nby);
        },

        down(e, el) {
            this.selectEl(el.id);
            this._drag = el;
            if (el.type === 'group_box') {
                this._groupEls = this.els
                    .filter(c => c.id !== el.id && this._elInsideGroup(c, el))
                    .map(c => ({ el: c, dx: c.x - el.x, dy: c.y - el.y }));
            } else {
                this._groupEls = [];
            }
            const cv = document.getElementById("cv");
            const r  = cv.getBoundingClientRect();
            this._off.x = (e.clientX-r.left)/this._scale/this.sc.width  - el.x;
            this._off.y = (e.clientY-r.top) /this._scale/this.sc.height - el.y;
        },

        _elInsideGroup(el, grp) {
            return el.x         >= grp.x &&
                   el.y         >= grp.y &&
                   el.x + el.w  <= grp.x + grp.w &&
                   el.y + el.h  <= grp.y + grp.h;
        },

        // shared mousemove/mouseup
        onMove(e) {
            // якщо ліва кнопка миші не натиснута — скидаємо всі drag-стани
            if (!(e.buttons & 1)) {
                this._drag = null; this._ndrag = null;
                this._ddrag = null; this._rdrag = null; this._epdrag = null;
                return;
            }
            // endpoint drag (line / arrow) — free canvas movement, bbox auto-resizes
            if (this._epdrag) {
                const cv = document.getElementById("cv");
                if (!cv) return;
                const r  = cv.getBoundingClientRect();
                const { el, point, fix } = this._epdrag;
                const mx = Math.max(0, Math.min(1, (e.clientX - r.left) / this._scale / this.sc.width));
                const my = Math.max(0, Math.min(1, (e.clientY - r.top)  / this._scale / this.sc.height));
                if (point === 'start') this._lineSetEndpoints(el, mx, my, fix.x, fix.y);
                else                   this._lineSetEndpoints(el, fix.x, fix.y, mx, my);
                return;
            }
            // resize deco
            if (this._rdrag) {
                const { deco, handle, startX, startY, startW, startH } = this._rdrag;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (handle === 'br' || handle === 'mr') deco.w = Math.max(60, this.snapV(startW + dx));
                if (handle === 'br' || handle === 'bm') deco.h = Math.max(40, this.snapV(startH + dy));
                return;
            }
            // node drag (structure)
            if (this._ndrag) {
                const r = document.getElementById("structCanvas")?.getBoundingClientRect();
                if (!r) return;
                this._ndrag.x = Math.max(0, this.snapV(e.clientX - r.left - this._noff.x));
                this._ndrag.y = Math.max(0, this.snapV(e.clientY - r.top  - this._noff.y));
                return;
            }
            // deco drag (structure) + group children
            if (this._ddrag) {
                const r = document.getElementById("structCanvas")?.getBoundingClientRect();
                if (!r) return;
                const nx = Math.max(0, this.snapV(e.clientX - r.left - this._doff.x));
                const ny = Math.max(0, this.snapV(e.clientY - r.top  - this._doff.y));
                this._ddrag.x = nx;
                this._ddrag.y = ny;
                for (const c of this._groupChildren) {
                    c.obj.x = nx + c.dx;
                    c.obj.y = ny + c.dy;
                }
                return;
            }
            // element drag (elements mode)
            if (this._drag) {
                const cv = document.getElementById("cv");
                if (!cv) return;
                const r  = cv.getBoundingClientRect();
                const el = this._drag;
                // snap the element's top-left corner, not the cursor
                const curPxX = (e.clientX-r.left)/this._scale;
                const curPxY = (e.clientY-r.top) /this._scale;
                const xpx = this.snap(curPxX - this._off.x * this.sc.width,  this.sc.grid);
                const ypx = this.snap(curPxY - this._off.y * this.sc.height, this.sc.grid);
                const ox = el.x, oy = el.y;
                el.x = Math.max(0, Math.min(xpx/this.sc.width,  (this.sc.width  - el.w)/this.sc.width));
                el.y = Math.max(0, Math.min(ypx/this.sc.height, (this.sc.height - el.h)/this.sc.height));
                // move group_box children
                if (this._groupEls.length) {
                    const ddx = el.x - ox, ddy = el.y - oy;
                    for (const c of this._groupEls) {
                        c.el.x = Math.max(0, c.el.x + ddx);
                        c.el.y = Math.max(0, c.el.y + ddy);
                    }
                }
            }
        },

        onUp() { this._drag=null; this._ndrag=null; this._ddrag=null; this._rdrag=null; this._groupChildren=[]; this._groupEls=[]; this._epdrag=null; },

        ctxOpen(e, id) {
            this.selectEl(id);
            const menuW = 190, menuH = 160;
            const x = Math.min(e.clientX, window.innerWidth  - menuW);
            const y = Math.min(e.clientY, window.innerHeight - menuH);
            this._ctxMenu = { open:true, x, y, elId:id };
        },
        ctxClose() { this._ctxMenu.open = false; },
        ctxDuplicate() {
            const src = this.els.find(e => e.id === this._ctxMenu.elId);
            if (!src) return this.ctxClose();
            const copy = JSON.parse(JSON.stringify(src));
            copy.id = 'el_' + Date.now();
            copy.x  = Math.min(1 - copy.w, copy.x + 20 / this.sc.width);
            copy.y  = Math.min(1 - copy.h, copy.y + 20 / this.sc.height);
            if (copy.point_id != null) copy.point_id = 0;
            this.els.push(copy);
            this.selectEl(copy.id);
            this.ctxClose();
        },
        ctxDelete() {
            this.sel = this._ctxMenu.elId;
            this.delEl();
            this.ctxClose();
        },
        ctxToFront() {
            const idx = this.els.findIndex(e => e.id === this._ctxMenu.elId);
            if (idx >= 0) this.els.push(this.els.splice(idx, 1)[0]);
            this.ctxClose();
        },
        ctxToBack() {
            const idx = this.els.findIndex(e => e.id === this._ctxMenu.elId);
            if (idx >= 0) this.els.unshift(this.els.splice(idx, 1)[0]);
            this.ctxClose();
        },
        delEl() {
            if (!this.sel) return;
            this.els = this.els.filter(e=>e.id!==this.sel);
            this.sel = null;
            this._selIdx = -1;
        },

        fScale() { return this._refW > 0 ? this.sc.width / this._refW : 1; },

        resizeByWidth(newW) {
            if (!newW || newW < 1) return;
            this.sc.width = newW;
            if (this._bgAspect) this.sc.height = Math.round(newW * this._bgAspect);
            this.updateScale();
        },

        resizeByHeight(newH) {
            if (!newH || newH < 1) return;
            this.sc.height = newH;
            if (this._bgAspect) this.sc.width = Math.round(newH / this._bgAspect);
            this.updateScale();
        },

        loadBgImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                this.sc.bgImage = ev.target.result;
                // автоматично підганяємо розмір canvas під SVG
                if (file.type === 'image/svg+xml') {
                    try {
                        const svgText = atob(ev.target.result.split(',')[1]);
                        const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
                        const svg = doc.documentElement;
                        let w, h;
                        const vb = svg.getAttribute('viewBox');
                        if (vb) {
                            const p = vb.trim().split(/[\s,]+/);
                            w = parseFloat(p[2]); h = parseFloat(p[3]);
                        } else {
                            w = parseFloat(svg.getAttribute('width'));
                            h = parseFloat(svg.getAttribute('height'));
                        }
                        if (w > 0 && h > 0) {
                            this.sc.width  = Math.round(w);
                            this.sc.height = Math.round(h);
                            this._bgAspect = h / w;
                            this._refW = this.sc.width;
                            this._refH = this.sc.height;
                            this.$nextTick(() => this.updateScale());
                        }
                    } catch(_) {}
                }
            };
            reader.readAsDataURL(file);
            e.target.value = "";
        },

        typeName(t) {
            return { label:"Мітка", value:"Значення точки", nav_btn:"Навігація",
                     indicator:"Індикатор", rect:"Прямокутник",
                     group_box:"Група", ellipse:"Еліпс / Коло", line:"Лінія", arrow:"Стрілка", triangle:"Трикутник", arc:"Дуга",
                     active_line:"Активна лінія", active_arc:"Активна дуга",
                     ibox_screen:"Підсистема", ibox_link:"Веб-лінк",
                     level_v:"Рівень ↕", level_h:"Рівень ↔", gauge:"Прилад",
                     ctrl_opmode:"Режим роботи", ctrl_signal:"Управляючий сигнал", ctrl_btn:"Кнопка управління",
                     timer_elapsed:"Лічильник часу", timer_countdown:"Зворотній відлік", timer_bar:"Прогрес-таймер",
                     countdown_bar:"Відлік-бар", multi_timer:"Мультитаймер",
                     calc_box:"Розрахунковий", bi_image:"Зображення (бістабільне)" }[t]??t;
        },

        uploadIboxImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                if (this._selIdx >= 0) this.els[this._selIdx].svgImage = ev.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = "";
        },
    };
}
</script>

<!-- custom context menu -->
<div class="ctx-menu" x-show="_ctxMenu.open"
     :style="`left:${_ctxMenu.x}px;top:${_ctxMenu.y}px`"
     @click.stop x-cloak>
    <div class="ctx-item" @click="ctxDuplicate()">⧉ Дублювати</div>
    <div class="ctx-item" @click="ctxDelete()" style="color:#f47067">🗑 Видалити</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" @click="ctxToFront()">⬆ На передній план</div>
    <div class="ctx-item" @click="ctxToBack()">⬇ На задній план</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" @click="_showLayer=!_showLayer;ctxClose()">
        <span x-text="_showLayer ? '✓ Панель елементів' : '☰ Панель елементів'"></span>
    </div>
</div>
</body>
