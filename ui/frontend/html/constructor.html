<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrabox — Constructor</title>
    <script>window.REQUIRED_ROLE = "admin";</script>
    <script src="/auth.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        [x-cloak]{display:none!important}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif;font-size:13px;height:100vh;overflow:hidden;display:flex;flex-direction:column}

        /* ── toolbar ── */
        .tb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 14px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0}
        .tb-sep{width:1px;height:24px;background:#30363d;margin:0 2px;flex-shrink:0}
        .lbl{color:#8b949e;font-size:12px;white-space:nowrap}
        .sc-title{font-size:14px;font-weight:600;color:#e6edf3}
        .sc-badge{font-size:11px;color:#8b949e;background:#21262d;border:1px solid #30363d;border-radius:4px;padding:2px 6px}
        .mode-badge{font-size:11px;font-weight:600;border-radius:4px;padding:3px 9px;background:#1c3a5e;color:#58a6ff;border:1px solid #2d5a8e}

        .btn{padding:4px 11px;border-radius:5px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;line-height:1.6}
        .btn:hover{background:#30363d}
        .btn:disabled{opacity:.4;cursor:default}
        .btn-red{background:#3d1c1c;border-color:#6e2c2c;color:#f47067}
        .btn-red:hover{background:#4a2020}
        .btn-active{background:#1c2a3a;border-color:#2d5a8e;color:#58a6ff}

        /* ── screen table ── */
        .sc-table{border-collapse:collapse;min-width:100%;font-size:13px}
        .sc-table th{padding:7px 12px;text-align:center;border:1px solid #21262d;
                     font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
                     background:#0d1117;white-space:nowrap}
        .sc-table td{padding:5px 6px;border:1px solid #21262d;vertical-align:top;min-width:130px}
        .sc-table td.num-col{text-align:center;color:#8b949e;font-weight:700;font-size:14px;
                             background:#0d1117;width:40px;white-space:nowrap}
        .sc-cell{padding:6px 9px;border-radius:5px;border:1px solid #30363d;background:#161b22;
                 cursor:pointer;transition:border-color .15s,background .12s}
        .sc-cell:hover{background:#1c2128}
        .sc-cell.sc-cell-sel{background:#1c2128}
        .sc-cell-title{font-size:13px;font-weight:600;color:#e6edf3;white-space:nowrap;
                       overflow:hidden;text-overflow:ellipsis}
        .sc-cell-id{font-size:11px;color:#8b949e;font-family:monospace;margin-top:1px}
        .btn-pc{background:#1c2a3a;border-color:#2d5a8e;color:#58a6ff}.btn-pc:hover{background:#1e3045}
        .btn-rnd{background:#1a2e1a;border-color:#2d6e2d;color:#56d364}.btn-rnd:hover{background:#1e3a1e}
        .btn-mob{background:#2e2a1a;border-color:#6e5a2d;color:#e3b341}.btn-mob:hover{background:#3a341e}
        .snode-type{font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;flex-shrink:0}

        /* ── layout ── */
        .main{display:flex;flex:1;overflow:hidden}

        /* ── left panel (elements mode) ── */
        .palette{width:154px;flex-shrink:0;background:#161b22;border-right:1px solid #30363d;padding:10px 8px;display:flex;flex-direction:column;gap:5px;overflow-y:auto}
        .pal-title{font-size:13px;color:#58a6ff;font-weight:600;margin-bottom:4px;padding:3px 4px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;border-radius:4px}
        .pal-title:hover{color:#79c0ff;background:#21262d}
        .pal-title-arrow{font-size:10px;transition:transform .15s;display:inline-block;color:#8b949e}
        .pal-title.collapsed .pal-title-arrow{transform:rotate(-90deg)}
        .pal-group{display:flex;flex-direction:column;gap:4px}
        .pal-group+.pal-group{margin-top:6px}
        .pal-items{display:flex;flex-direction:column;gap:4px}
        .pal-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#1c2128;border:1px solid #30363d;border-radius:6px;cursor:grab;user-select:none;transition:background .12s,border-color .12s}
        .pal-item:hover{background:#21262d;border-color:#58a6ff;color:#58a6ff}
        .pal-item:active{cursor:grabbing;opacity:.7}
        .pal-icon{font-size:15px;width:18px;text-align:center}

        /* ── structure left panel ── */
        .struct-pal{width:130px;flex-shrink:0;background:#161b22;border-right:1px solid #30363d;
                    padding:10px 8px;display:flex;flex-direction:column;gap:5px;overflow-y:auto}

        /* ── structure canvas ── */
        .struct-area{flex:1;overflow:auto;background:#0a0e14;position:relative}
        .struct-canvas{position:relative;flex-shrink:0}
        .struct-canvas svg{position:absolute;inset:0;pointer-events:none;z-index:20}

        /* decoration elements */
        .deco{position:absolute;cursor:move;user-select:none}
        .deco.sel-deco{outline:2px solid #58a6ff;outline-offset:1px;z-index:11}
        .deco-group{width:100%;height:100%}
        .deco-label{width:100%;height:100%;display:flex;align-items:center;
                    font-weight:600;overflow:hidden;white-space:nowrap}
        /* arrow deco */
        .deco-arrow-line{position:absolute;top:50%;left:0;transform-origin:left center;height:0}
        .deco-arrow-head{position:absolute;top:50%;right:-1px;transform:translateY(-50%);
                         width:0;height:0;border-style:solid}
        /* resize handles */
        .rh{position:absolute;width:9px;height:9px;background:#58a6ff;border:1px solid #0d1117;
            border-radius:2px;z-index:30}
        .rh-br{bottom:-5px;right:-5px;cursor:se-resize}
        .rh-bm{bottom:-5px;left:calc(50% - 4px);cursor:s-resize}
        .rh-mr{top:calc(50% - 4px);right:-5px;cursor:e-resize}

        .snode{position:absolute;width:160px;cursor:move;user-select:none;z-index:5}
        .snode-inner{background:#161b22;border:2px solid #30363d;border-radius:8px;padding:10px 12px;transition:border-color .15s}
        .snode-inner:hover{border-color:#444}
        .snode.sel .snode-inner{border-color:#58a6ff;background:#1c2128}
        .snode-title{font-size:13px;font-weight:600;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .snode-id{font-size:11px;color:#8b949e;margin-top:2px}
        .snode.sel .snode-inner{border-color:inherit!important}
        /* .snode-hint removed */

        /* ── elements canvas ── */
        .canvas-area{flex:1;overflow:auto;background:#0a0e14;padding:16px;display:flex;align-items:flex-start;justify-content:flex-start}
        .canvas-col{display:flex;flex-direction:column;flex:1;overflow:hidden}
        .el-layer{flex-shrink:0;background:#161b22;border-top:1px solid #30363d;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:6px 8px;overflow-y:auto;max-height:120px}
        .el-layer::-webkit-scrollbar{width:4px}.el-layer::-webkit-scrollbar-track{background:transparent}.el-layer::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
        .el-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;background:#1c2333;border:1px solid #30363d;cursor:pointer;white-space:nowrap;font-size:11px;flex-shrink:0;user-select:none;color:#c9d1d9}
        .el-chip:hover{background:#243047;border-color:#58a6ff}
        .el-chip.el-active{background:#1c3a5e;border-color:#58a6ff;color:#58a6ff}
        .c-el{position:absolute;cursor:move;user-select:none;overflow:hidden}
        .c-el.sel{outline:2px solid #58a6ff;outline-offset:1px;z-index:10}
        .r-label{position:absolute;inset:0;display:flex;align-items:center;overflow:hidden}
        .r-value{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border:1px solid #333;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
        .r-navbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:5px;border:1px solid rgba(255,255,255,.15);font-weight:600;overflow:hidden}
        .r-indicator{position:absolute;inset:0;border-radius:50%}
        .r-level{position:absolute;inset:0;overflow:hidden;border-radius:4px}
        .r-level-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none;z-index:1}
        .r-gauge{position:absolute;inset:0;overflow:hidden}
        .r-rect{position:absolute;inset:0}
        .r-shape{position:absolute;inset:0;overflow:visible}
        .r-ibox{position:absolute;inset:0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;border:2px solid rgba(255,255,255,.12);transition:border-color .3s}
        .r-ibox-bg{flex:1;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:rgba(0,0,0,.2)}
        .r-ibox-foot{padding:3px 8px;background:rgba(0,0,0,.55);display:flex;align-items:center;gap:6px;flex-shrink:0}
        .r-ibox-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#484f58}
        .r-ibox-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

        /* ── props panel ── */
        .props{width:234px;flex-shrink:0;background:#161b22;border-left:1px solid #30363d;padding:12px;overflow-y:auto}
        .pr-title{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
        .pr{margin-bottom:9px}
        .pr label{display:block;font-size:11px;color:#8b949e;margin-bottom:3px}
        .pr input[type=text],.pr input[type=number],.pr select{width:100%;padding:5px 8px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:13px;outline:none}
        .pr input:focus,.pr select:focus{border-color:#58a6ff}
        .pr input[type=color]{width:100%;height:28px;padding:2px 4px;background:#0d1117;border:1px solid #30363d;border-radius:4px;cursor:pointer}
        .pr2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
        .pr2 label{display:block;font-size:11px;color:#8b949e;margin-bottom:3px}
        .pr2 input{width:100%;padding:5px 7px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:13px;outline:none}
        .pr2 input:focus{border-color:#58a6ff}
        .pr-inline{display:flex;align-items:center;gap:7px;margin-bottom:9px}
        .pr-inline label{font-size:12px;color:#c9d1d9;cursor:pointer;margin:0}
        .pr-sep{height:1px;background:#21262d;margin:8px 0 11px}

        /* ── modal ── */
        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:200}
        .ctx-menu{position:fixed;background:#1c2333;border:1px solid #30363d;border-radius:6px;padding:4px 0;min-width:186px;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.6)}
        .ctx-item{padding:7px 14px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;color:#c9d1d9}
        .ctx-item:hover{background:#243047;color:#e6edf3}
        .ctx-sep{height:1px;background:#30363d;margin:3px 0}
        .overlay.open{display:flex}
        .modal{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;width:340px}
        .modal h2{font-size:15px;margin-bottom:18px;color:#e6edf3}
        .modal-err{padding:7px 10px;background:#3d1c1c;border:1px solid #6e2c2c;border-radius:5px;color:#f47067;font-size:12px;margin-bottom:12px;display:none}
        .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

        /* ── status ── */
        .status{height:24px;background:#0d1117;border-top:1px solid #21262d;display:flex;align-items:center;padding:0 14px;flex-shrink:0}
        .status span{font-size:11px;color:#8b949e}
        .status .ok{color:#56d364}
        .status .err{color:#f47067}
    </style>
</head>
<body x-data="app()" x-cloak @mousemove.window="onMove" @mouseup.window="onUp">

<!-- toolbar -->
<div class="tb">
    <button class="btn" onclick="window.location.href='/constructor'">← Конструктор</button>
    <div class="tb-sep"></div>
    <span class="mode-badge" x-show="mode === 'elements'">✏ Елементи</span>

    <!-- structure mode tools -->
    <template x-if="mode === 'structure'">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="tb-sep"></div>
            <button class="btn" :class="structView==='table'?'btn-active':''"
                    @click="structView = structView==='table'?'canvas':'table'">
                <span x-text="structView==='table'?'◫ Граф':'⊞ Таблиця'"></span>
            </button>
            <div class="tb-sep"></div>
            <button class="btn" @click="saveAll">💾 Зберегти</button>
        </div>
    </template>

    <!-- elements mode tools -->
    <template x-if="mode === 'elements'">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="tb-sep"></div>
            <button class="btn" @click="mode='structure';sel=null">← Структура</button>
            <span class="sc-title" x-text="sc.title"></span>
            <span class="sc-badge" x-text="sc.id"></span>
            <div class="tb-sep"></div>
            <button class="btn" @click="saveAll">💾 Зберегти</button>
        </div>
    </template>

    <div style="flex:1"></div>
    <button class="btn" @click="downloadBackup"
            title="Завантажити архів усіх екранів на свій ПК">⬇ Резервна копія</button>
</div>

<div class="main">

    <!-- ═══════════ STRUCTURE MODE ═══════════ -->
    <template x-if="mode === 'structure'">
        <div style="display:flex;flex:1;overflow:hidden">

            <!-- structure left panel -->
            <div class="struct-pal">
                <div class="pal-title">Екрани</div>
                <button class="btn btn-pc"  style="width:100%;margin-bottom:4px" @click="openCreate('pc')">+ PC</button>
                <button class="btn btn-rnd" style="width:100%;margin-bottom:4px" @click="openCreate('render')">+ Render</button>
                <button class="btn btn-mob" style="width:100%;margin-bottom:10px" @click="openCreate('mobile')">+ Mobile</button>
                <div class="pal-title">Оформлення</div>
                <template x-for="item in structPalette" :key="item.type">
                    <div class="pal-item" draggable="true" @dragstart="decodrag($event,item.type)">
                        <span class="pal-icon" x-text="item.icon"></span>
                        <span x-text="item.label"></span>
                    </div>
                </template>
                <div class="pal-title" style="margin-top:10px">Сітка</div>
                <div class="pr-inline" style="margin-bottom:4px">
                    <input type="checkbox" x-model="sgrid.snap" id="sgSnap">
                    <label for="sgSnap" style="font-size:12px;color:#c9d1d9;cursor:pointer">Snap</label>
                </div>
                <div style="font-size:11px;color:#8b949e;margin-bottom:3px">Крок</div>
                <input type="number" x-model.number="sgrid.step" min="10" max="200"
                       style="width:100%;padding:4px 7px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:13px;outline:none">
            </div>

            <!-- structure canvas (graph view) -->
            <div x-show="structView==='canvas'" class="struct-area" id="structArea"
                 @dragover.prevent @drop.prevent="decoDrop" @wheel.prevent="sZoom($event)">
                <div class="struct-canvas" id="structCanvas"
                     :style="`width:${CANVAS_W}px;height:${CANVAS_H}px;
                              transform:scale(${_sScale});transform-origin:top left;
                              background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                                               linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
                              background-size:${sgrid.step}px ${sgrid.step}px;`"
                     @click.self="selNodeId=null;selDecoId=null">

                    <!-- SVG for deco arrows -->
                    <svg :width="CANVAS_W" :height="CANVAS_H">
                        <defs>
                            <marker id="arr-deco" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                                <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
                            </marker>
                        </defs>
                    </svg>

                    <!-- deco elements (groups behind nodes, labels/arrows above) -->
                    <template x-for="d in decos" :key="d.id">
                        <div class="deco" :class="{'sel-deco': selDecoId===d.id}"
                             :style="`left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h||1}px;
                                      z-index:${d.type==='group'?1:12}`"
                             @mousedown.stop="decoDown($event,d)" @click.stop="selDecoId=d.id;selNodeId=null">
                            <!-- group -->
                            <template x-if="d.type==='group'">
                                <div class="deco-group"
                                     :style="`background:${d.fill};border:${d.borderWidth}px solid ${d.borderColor};border-radius:${d.radius}px`"></div>
                            </template>
                            <!-- label -->
                            <template x-if="d.type==='label'">
                                <div class="deco-label"
                                     :style="`font-size:${d.fontSize}px;color:${d.color};padding:0 8px`"
                                     x-text="d.text"></div>
                            </template>
                            <!-- arrow (CSS) -->
                            <template x-if="d.type==='arrow'">
                                <div style="width:100%;height:100%;position:relative;overflow:visible">
                                    <div :style="`
                                        position:absolute;top:50%;left:0;
                                        width:${Math.sqrt(d.w*d.w+d.h*d.h)}px;
                                        height:0;
                                        border-top:${d.strokeWidth}px solid ${d.color};
                                        transform:rotate(${Math.atan2(d.h,d.w)}rad);
                                        transform-origin:left center;
                                    `">
                                        <div :style="`
                                            position:absolute;right:-1px;
                                            top:-${d.strokeWidth*3 - 1}px;
                                            width:0;height:0;border-style:solid;
                                            border-width:${d.strokeWidth*3}px 0 ${d.strokeWidth*3}px ${d.strokeWidth*5}px;
                                            border-color:transparent transparent transparent ${d.color};
                                        `"></div>
                                    </div>
                                </div>
                            </template>
                            <!-- resize handles (group only) -->
                            <template x-if="selDecoId===d.id && d.type==='group'">
                                <div>
                                    <div class="rh rh-br" @mousedown.stop="resizeDown($event,d,'br')"></div>
                                    <div class="rh rh-bm" @mousedown.stop="resizeDown($event,d,'bm')"></div>
                                    <div class="rh rh-mr" @mousedown.stop="resizeDown($event,d,'mr')"></div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- nodes -->
                    <template x-for="node in project.screens" :key="node.id">
                        <div class="snode"
                             :class="{sel: selNodeId===node.id}"
                             :style="`left:${node.x||0}px;top:${node.y||0}px`"
                             @mousedown.stop="nodeDown($event,node)"
                             @click.stop="selNodeId=node.id"
                             @dblclick.stop="openElements(node.id)">
                            <div class="snode-inner"
                                 :style="`border-color:${selNodeId===node.id ? screenColor(node) : screenTypeCfg(node).dimColor}`">
                                <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
                                    <div class="snode-title" x-text="node.title"></div>
                                    <span class="snode-type"
                                          :style="`background:${screenTypeCfg(node).bg};color:${screenColor(node)}`"
                                          x-text="screenTypeCfg(node).prefix"></span>
                                </div>
                                <div class="snode-id">
                                    <span x-text="node.id"></span>
                                    <span style="color:#484f58"> · D<span x-text="node.deviceType||1"></span></span>
                                </div>
                            </div>
                        </div>
                    </template>

                </div>
            </div>

            <!-- structure table (table view) -->
            <div x-show="structView==='table'"
                 style="flex:1;overflow:auto;padding:20px;background:#0a0e14">
                <template x-if="project.screens.length === 0">
                    <div style="color:#8b949e;font-size:13px">Немає екранів</div>
                </template>
                <template x-if="project.screens.length > 0">
                    <table class="sc-table">
                        <thead>
                            <!-- row 1: type group headers -->
                            <tr>
                                <th rowspan="2" style="width:44px">№</th>
                                <template x-for="st in screenTypeList" :key="'h1-'+st.key">
                                    <th :colspan="allDeviceTypes.length"
                                        :style="`color:${st.color};border-bottom:2px solid ${st.color}`"
                                        x-text="st.label"></th>
                                </template>
                            </tr>
                            <!-- row 2: device sub-headers -->
                            <tr>
                                <template x-for="col in tableColumns" :key="'h2-'+col.key">
                                    <th style="color:#484f58;font-weight:500"
                                        x-text="'D'+col.dt"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="num in allScreenNums" :key="'row-'+num">
                                <tr>
                                    <td class="num-col" x-text="num"></td>
                                    <template x-for="col in tableColumns" :key="'td-'+num+'-'+col.key">
                                        <td>
                                            <div x-show="!!tableCell(num,col.stKey,col.dt)"
                                                 class="sc-cell"
                                                 :class="{'sc-cell-sel': selNodeId===tableCell(num,col.stKey,col.dt)?.id}"
                                                 :style="selNodeId===tableCell(num,col.stKey,col.dt)?.id ? `border-color:${col.color}` : ''"
                                                 @click.stop="selNodeId=tableCell(num,col.stKey,col.dt)?.id"
                                                 @dblclick.stop="openElements(tableCell(num,col.stKey,col.dt)?.id)">
                                                <div class="sc-cell-title" x-text="tableCell(num,col.stKey,col.dt)?.title||''"></div>
                                                <div class="sc-cell-id" x-text="tableCell(num,col.stKey,col.dt)?.id||''"></div>
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
            </div>

            <!-- node/deco props -->
            <div class="props">
                <!-- nothing selected -->
                <template x-if="!selNodeId && !selDecoId">
                    <div>
                        <div style="color:#8b949e;font-size:12px;line-height:1.6">
                            Клікніть на екран або елемент.<br><br>
                            Подвійний клік — відкрити екран.
                        </div>
                    </div>
                </template>
                <!-- node selected -->
                <template x-if="selNodeId && !selDecoId">
                    <div>
                        <div class="pr-title">Екран</div>
                        <div class="pr"><label>Назва</label>
                            <input type="text"
                                :value="selNode.title"
                                @input="project.screens.find(s=>s.id===selNodeId).title = $event.target.value"></div>
                        <div class="pr"><label>ID</label>
                            <input type="text" :value="selNode.id" disabled style="color:#8b949e"></div>
                        <div class="pr2">
                            <div><label>Тип</label>
                                <input type="text" :value="screenTypeCfg(selNode).label" disabled style="color:#8b949e"></div>
                            <div><label>Номер</label>
                                <input type="number" min="1" max="999"
                                    :value="selNode.screenNum"
                                    @change="project.screens.find(s=>s.id===selNodeId).screenNum = +$event.target.value">
                            </div>
                        </div>
                        <div class="pr"><label>Пристрій відображення</label>
                            <input type="number" min="1" max="99"
                                :value="selNode.deviceType||1"
                                @change="project.screens.find(s=>s.id===selNodeId).deviceType = +$event.target.value">
                        </div>
                        <div class="pr-sep"></div>
                        <button class="btn btn-red" style="width:100%" @click="confirmDeleteNode()">🗑 Видалити екран</button>
                    </div>
                </template>
                <!-- deco selected -->
                <template x-if="selDeco">
                    <div>
                        <div class="pr-title" x-text="selDeco.type==='group'?'Група':selDeco.type==='label'?'Підпис':'Стрілка'"></div>
                        <div class="pr2">
                            <div><label>X</label><input type="number" x-model.number="selDeco.x"></div>
                            <div><label>Y</label><input type="number" x-model.number="selDeco.y"></div>
                        </div>
                        <template x-if="selDeco.type==='arrow'">
                            <div>
                                <div class="pr2">
                                    <div><label>dX</label><input type="number" x-model.number="selDeco.w"></div>
                                    <div><label>dY</label><input type="number" x-model.number="selDeco.h"></div>
                                </div>
                                <div class="pr"><label>Колір</label><input type="color" x-model="selDeco.color"></div>
                                <div class="pr"><label>Товщина</label><input type="number" x-model.number="selDeco.strokeWidth" min="1" max="10"></div>
                            </div>
                        </template>
                        <template x-if="selDeco.type!=='arrow'">
                            <div>
                                <div class="pr2">
                                    <div><label>W</label><input type="number" x-model.number="selDeco.w"></div>
                                    <div><label>H</label><input type="number" x-model.number="selDeco.h"></div>
                                </div>
                            </div>
                        </template>
                        <template x-if="selDeco.type==='group'">
                            <div>
                                <div class="pr"><label>Заливка</label><input type="color" x-model="selDeco.fill"></div>
                                <div class="pr"><label>Колір рамки</label><input type="color" x-model="selDeco.borderColor"></div>
                                <div class="pr"><label>Товщина рамки</label><input type="number" x-model.number="selDeco.borderWidth" min="0" max="10"></div>
                                <div class="pr"><label>Скруглення</label><input type="number" x-model.number="selDeco.radius" min="0" max="100"></div>
                            </div>
                        </template>
                        <template x-if="selDeco.type==='label'">
                            <div>
                                <div class="pr"><label>Текст</label><input type="text" x-model="selDeco.text"></div>
                                <div class="pr"><label>Розмір шрифту</label><input type="number" x-model.number="selDeco.fontSize" min="8" max="72"></div>
                                <div class="pr"><label>Колір</label><input type="color" x-model="selDeco.color"></div>
                            </div>
                        </template>
                        <div class="pr-sep"></div>
                        <button class="btn btn-red" style="width:100%" @click="delDeco">🗑 Видалити</button>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- ═══════════ ELEMENTS MODE ═══════════ -->
    <template x-if="mode === 'elements'">
        <div style="display:flex;flex:1;overflow:hidden">

            <!-- palette -->
            <div class="palette">
                <template x-for="group in paletteGroups" :key="group.group">
                    <div class="pal-group">
                        <div class="pal-title" :class="{ collapsed: !isPalOpen(group.group) }"
                             @click="togglePalGroup(group.group)">
                            <span class="pal-title-arrow">▾</span>
                            <span x-text="group.group" style="flex:1"></span>
                            <span style="font-size:10px;color:#484f58" x-text="group.items.length"></span>
                        </div>
                        <div class="pal-items" x-show="isPalOpen(group.group)">
                            <template x-for="item in group.items" :key="item.type">
                                <div class="pal-item" draggable="true" @dragstart="palDrag($event,item.type)">
                                    <span class="pal-icon" x-text="item.icon"></span>
                                    <span x-text="item.label"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- elements canvas + layer panel -->
            <div class="canvas-col">
            <div class="canvas-area" id="ca" @dragover.prevent @drop.prevent="drop">
                <div id="cs" :style="`transform:scale(${_scale});transform-origin:top left;`">
                    <div id="cv"
                         :style="`position:relative;width:${sc.width}px;height:${sc.height}px;background-color:${sc.bg};
                                  background-image:${cvBgImage()};background-size:${cvBgSize()};
                                  box-shadow:0 0 0 1px #333;`"
                         @click.self="selectEl(null); ctxClose()">
                        <template x-for="el in els" :key="el.id">
                            <div class="c-el" :class="{sel:sel===el.id}" draggable="false"
                                 :style="`left:${el.x*100}%;top:${el.y*100}%;width:${el.w*sc.width}px;height:${el.h*sc.height}px;z-index:${sel===el.id?10:el.onTop?8:el.type==='group_box'?2:3};${(el.type||'').startsWith('bi_')||el.type==='calc_box'||el.type==='ctrl_opmode'||el.type==='ctrl_signal'||el.type==='ctrl_btn'||el.type==='timer_elapsed'||el.type==='timer_countdown'||el.type==='timer_bar'||el.type==='countdown_bar'||el.type==='multi_timer'||el.type==='line'||el.type==='arrow'||el.type==='active_line'||el.type==='active_arc'||el.type==='value'?'overflow:visible;':''}`"
                                 @mousedown.stop="down($event,el)" @click.stop="selectEl(el.id)" @dragstart.prevent
                                 @contextmenu.prevent.stop="ctxOpen($event,el.id)">
                                <template x-if="el.type==='group_box'">
                                    <div style="position:absolute;inset:0">
                                        <!-- фон окремо, щоб opacity не впливала на текст -->
                                        <div :style="`position:absolute;inset:0;
                                                      background:${el.fill};
                                                      border:${el.borderWidth}px solid ${el.borderColor};
                                                      border-radius:${el.radius}px;
                                                      opacity:${el.opacity??0.75}`"></div>
                                        <!-- текст поверх, повна непрозорість -->
                                        <div :style="`position:absolute;top:5px;
                                                      left:${el.borderWidth+6}px;right:${el.borderWidth+6}px;
                                                      font-size:${el.fontSize||12}px;color:${el.color||'#8b949e'};
                                                      font-weight:500;white-space:nowrap;overflow:hidden;
                                                      text-overflow:ellipsis;text-align:${el.textAlign||'left'}`"
                                             x-text="el.title||'Група'"></div>
                                    </div>
                                </template>
                                <template x-if="el.type==='label'">
                                    <div class="r-label"
                                         :style="`font-size:${el.fontSize*fScale()}px;color:${el.color};font-weight:${el.bold?'bold':'normal'};
                                                  justify-content:${el.align==='center'?'center':el.align==='right'?'flex-end':'flex-start'};`"
                                         x-text="el.text"></div>
                                </template>
                                <template x-if="el.type==='value'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div class="r-value">
                                            <span :style="`font-size:${(el.fontSize||22)*fScale()}px;color:${el.color};font-weight:600;`"
                                                  x-text="`P:${el.point_id} ···`"></span>
                                        </div>
                                        <div x-show="el.showLabel"
                                             :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${(el.labelFontSize||11)*fScale()}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                             x-text="el.label"></div>
                                    </div>
                                </template>
                                <template x-if="el.type==='nav_btn'">
                                    <div class="r-navbtn"
                                         :style="`background:${el.bg};color:${el.color};font-size:${el.fontSize*fScale()}px;`"
                                         x-text="el.text"></div>
                                </template>
                                <template x-if="el.type==='indicator'">
                                    <div class="r-indicator"
                                         :style="`background:${el.color};border:2px solid ${el.borderColor};`"></div>
                                </template>
                                <template x-if="el.type==='rect'">
                                    <div class="r-rect"
                                         :style="`background:${el.fill};border:${el.borderWidth}px solid ${el.borderColor};border-radius:${el.radius}px;opacity:${el.opacity??1};`"></div>
                                </template>
                                <template x-if="el.type==='ellipse'">
                                    <div class="r-shape" x-html="cEllipseSVGHtml(el)"></div>
                                </template>
                                <template x-if="el.type==='line'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div class="r-shape" x-html="cLineSVGHtml(el)"></div>
                                        <div x-show="sel===el.id"
                                             :style="`position:absolute;left:${el.x1??0}%;top:${el.y1??0}%;width:10px;height:10px;background:#58a6ff;border:2px solid #0d1117;border-radius:50%;transform:translate(-50%,-50%);cursor:crosshair;z-index:25`"
                                             @mousedown.stop="endpointDown($event,el,'start')"></div>
                                        <div x-show="sel===el.id"
                                             :style="`position:absolute;left:${el.x2??100}%;top:${el.y2??100}%;width:10px;height:10px;background:#e3b341;border:2px solid #0d1117;border-radius:50%;transform:translate(-50%,-50%);cursor:crosshair;z-index:25`"
                                             @mousedown.stop="endpointDown($event,el,'end')"></div>
                                    </div>
                                </template>
                                <template x-if="el.type==='active_line'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div class="r-shape" x-html="cActiveLineSVGHtml(el)"></div>
                                        <div x-show="sel===el.id"
                                             :style="`position:absolute;left:${el.x1??0}%;top:${el.y1??50}%;width:10px;height:10px;background:#56d364;border:2px solid #0d1117;border-radius:50%;transform:translate(-50%,-50%);cursor:crosshair;z-index:25`"
                                             @mousedown.stop="endpointDown($event,el,'start')"></div>
                                        <div x-show="sel===el.id"
                                             :style="`position:absolute;left:${el.x2??100}%;top:${el.y2??50}%;width:10px;height:10px;background:#e3b341;border:2px solid #0d1117;border-radius:50%;transform:translate(-50%,-50%);cursor:crosshair;z-index:25`"
                                             @mousedown.stop="endpointDown($event,el,'end')"></div>
                                    </div>
                                </template>
                                <template x-if="el.type==='active_arc'">
                                    <div class="r-shape" x-html="cActiveArcSVGHtml(el)"></div>
                                </template>
                                <template x-if="el.type==='arrow'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div class="r-shape" x-html="cArrowSVGHtml(el)"></div>
                                        <div x-show="sel===el.id"
                                             :style="`position:absolute;left:${el.x1??0}%;top:${el.y1??50}%;width:10px;height:10px;background:#58a6ff;border:2px solid #0d1117;border-radius:50%;transform:translate(-50%,-50%);cursor:crosshair;z-index:25`"
                                             @mousedown.stop="endpointDown($event,el,'start')"></div>
                                        <div x-show="sel===el.id"
                                             :style="`position:absolute;left:${el.x2??100}%;top:${el.y2??50}%;width:10px;height:10px;background:#e3b341;border:2px solid #0d1117;border-radius:50%;transform:translate(-50%,-50%);cursor:crosshair;z-index:25`"
                                             @mousedown.stop="endpointDown($event,el,'end')"></div>
                                    </div>
                                </template>
                                <template x-if="el.type==='triangle'">
                                    <div class="r-shape" x-html="cTriangleSVGHtml(el)"></div>
                                </template>
                                <template x-if="el.type==='arc'">
                                    <div class="r-shape" x-html="cArcSVGHtml(el)"></div>
                                </template>
                                <template x-if="el.type==='ibox_screen'">
                                    <div class="r-ibox" :style="`border-width:${el.borderWidth??2}px`">
                                        <div class="r-ibox-bg" :style="el.svgImage?`background-image:url(${el.svgImage})`:'background:rgba(88,166,255,.07)'"></div>
                                        <div class="r-ibox-foot">
                                            <div class="r-ibox-dot"></div>
                                            <span class="r-ibox-title" :style="`font-size:${el.fontSize*fScale()}px;color:${el.color}`" x-text="el.title||'Підсистема'"></span>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="el.type==='ibox_link'">
                                    <div class="r-ibox" :style="`border-color:${el.point_id?'rgba(86,211,100,.6)':'rgba(255,255,255,.18)'};border-width:${el.borderWidth??2}px`">
                                        <div class="r-ibox-bg" :style="el.svgImage?`background-image:url(${el.svgImage})`:'background:rgba(80,255,160,.05)'"></div>
                                        <div class="r-ibox-foot">
                                            <div class="r-ibox-dot" x-show="el.point_id"></div>
                                            <span style="font-size:10px;color:#8b949e;flex-shrink:0">⇗</span>
                                            <span class="r-ibox-title" :style="`font-size:${el.fontSize*fScale()}px;color:${el.color}`" x-text="el.title||'Веб-лінк'"></span>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="el.type==='level_v' || el.type==='level_h'">
                                    <div class="r-level" :style="`background:${el.bgColor};border:${el.borderWidth||1}px solid ${el.borderColor||'#30363d'};border-radius:${el.borderRadius??4}px`">
                                        <div :style="cLevelFill(el, 60)"></div>
                                        <div class="r-level-val" x-show="el.showValue"
                                             :style="`font-size:${(el.fontSize||12)*fScale()}px;color:${el.color||'#fff'}`">60%</div>
                                    </div>
                                </template>
                                <template x-if="el.type==='gauge'">
                                    <div class="r-gauge"
                                         :style="`background:${el.bgColor};border:${el.borderWidth||0}px solid ${el.borderColor||'#30363d'};border-radius:${el.borderRadius??8}px`"
                                         x-html="cGaugeSVGHtml(el)">
                                    </div>
                                </template>

                                <!-- bistable: pump / motor / valve / relay / reed / optical / image -->
                                <template x-if="el.type && el.type.startsWith('bi_')">
                                    <div class="r-bistable" style="position:absolute;inset:0">
                                        <div :style="`position:absolute;inset:0;background-color:${el.bgColor||'transparent'};border:${el.borderWidth||0}px solid ${el.colorBorder||'#8b949e'};border-radius:${el.borderRadius||0}px;box-sizing:border-box;overflow:hidden;${el.type==='bi_image' ? biImageBgStyle(biImagePreview(el)) : ''}`"
                                             x-html="el.type==='bi_image' ? '' : bistableSvgPreview(el)"></div>
                                        <div x-show="el.showLabel && bistableLabel(el)"
                                             :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${(el.fontSize||11)*fScale()}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                             x-text="bistableLabel(el)"></div>
                                    </div>
                                </template>

                                <!-- calc_box: formula-driven calculated element -->
                                <template x-if="el.type === 'calc_box'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div :style="`position:absolute;inset:0;border:${el.borderWidth||0}px solid ${el.colorBorder||'#58a6ff'};border-radius:${el.borderRadius||0}px;box-sizing:border-box;overflow:hidden;${biImageBgStyle(el.imageGood || el.imageWarn || el.imageAlarm || el.imageUncert || el.imageInit || '')}`">
                                            <template x-if="!el.imageGood && !el.imageWarn && !el.imageAlarm && !el.imageUncert && !el.imageInit">
                                                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                                                    <span style="font-size:20px;color:#8b949e">∑</span>
                                                </div>
                                            </template>
                                        </div>
                                        <div x-show="el.showLabel"
                                             :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${(el.fontSize||11)*fScale()}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                             x-text="el.label || 'Розрахунок'"></div>
                                    </div>
                                </template>

                                <!-- ctrl_opmode: operation mode control element -->
                                <template x-if="el.type === 'ctrl_opmode'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div :style="`position:absolute;inset:0;border:${el.borderWidth||2}px solid ${el.colorInit||'#484f58'};border-radius:${el.borderRadius||8}px;box-sizing:border-box;overflow:hidden;${biImageBgStyle(el.image0 || el.image1 || '')}`">
                                            <template x-if="!el.image0 && !el.image1">
                                                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                                                    <span style="font-size:20px;color:#8b949e">⊙</span>
                                                </div>
                                            </template>
                                        </div>
                                        <div x-show="el.showLabel"
                                             :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${(el.fontSize||11)*fScale()}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                             x-text="el.label || 'Режим'"></div>
                                    </div>
                                </template>

                                <!-- ctrl_signal: control signal element, border by ctrl_status -->
                                <template x-if="el.type === 'ctrl_signal'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div :style="`position:absolute;inset:0;border:${el.borderWidth||2}px solid ${el.colorInit||'#484f58'};border-radius:${el.borderRadius||8}px;box-sizing:border-box;overflow:hidden;${biImageBgStyle(el.image0 || el.image1 || '')}`">
                                            <template x-if="!el.image0 && !el.image1">
                                                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                                                    <span style="font-size:20px;color:#8b949e">⚡</span>
                                                </div>
                                            </template>
                                        </div>
                                        <div x-show="el.showLabel"
                                             :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${(el.fontSize||11)*fScale()}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                             x-text="el.label || 'Команда'"></div>
                                    </div>
                                </template>
                                <!-- ctrl_btn: control button, active/inactive by system mode -->
                                <template x-if="el.type === 'ctrl_btn'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div :style="`position:absolute;inset:0;border:${el.borderWidth||2}px solid ${el.colorInactive||'#484f58'};border-radius:${el.borderRadius||8}px;box-sizing:border-box;overflow:hidden;${biImageBgStyle(el.imageInactive||el.imageActive||'')}`">
                                            <template x-if="!el.imageActive && !el.imageInactive">
                                                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                                                    <span :style="`font-size:${(el.fontSize||14)*fScale()}px;color:${el.color||'#e6edf3'}`"
                                                          x-text="el.text||'CMD'"></span>
                                                </div>
                                            </template>
                                        </div>
                                        <div x-show="el.showLabel"
                                             :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${(el.labelFontSize||11)*fScale()}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                             x-text="el.label"></div>
                                    </div>
                                </template>

                                <!-- timer_elapsed / timer_countdown / timer_bar: preview -->
                                <template x-if="el.type === 'timer_elapsed' || el.type === 'timer_countdown'">
                                    <div style="position:absolute;inset:0;overflow:visible">
                                        <div :style="`position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:4px 8px;background:${el.bgColor||'rgba(0,0,0,.25)'};border:${el.borderWidth??1}px solid ${el.borderColor||'#30363d'};border-radius:${el.borderRadius??4}px;overflow:hidden`">
                                            <span :style="`font-size:${(el.fontSize||22)*fScale()}px;font-weight:600;color:${el.color||'#e6edf3'};font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis`"
                                                  x-text="el.type==='timer_elapsed' ? '00:00:23' : '00:59:37'"></span>
                                            <span x-show="el.showCaption"
                                                  :style="`font-size:${(el.labelFontSize||11)*fScale()}px;color:#8b949e;margin-top:1px`"
                                                  x-text="el.caption||(el.type==='timer_elapsed'?'в роботі':'до завершення')"></span>

                                        <div x-show="el.showLabel"

                                            <div :style="`position:absolute;top:0;left:0;bottom:0;width:65%;background:${el.colorFill||'#3fb950'}`"></div>
                                            <div x-show="el.showValue"

                                        </div>
                                        <div x-show="el.showLabel"

                                <template x-if="el.type === 'multi_timer'">

            <!-- elements layer panel -->
            <div class="el-layer" x-show="_showLayer">
                <template x-for="el in els" :key="el.id">

                        <span x-text="(elTypeMeta[el.type]||{}).label||el.type"></span>

            </div>
            </div><!-- /canvas-col -->

            <div class="props">
                <template x-if="sel === null">

                                <input type="number" :value="sc.width" @change="resizeByWidth(+$event.target.value)">

                            <div><label>Висота</label>
                                <input type="number" :value="sc.height" @change="resizeByHeight(+$event.target.value)">

                        </div>
                        <div class="pr"><label>Фон (колір)</label><input type="color" x-model="sc.bg"></div>

                                </div>
                            </template>
                        </div>
                        <div class="pr-sep"></div>
                        <div class="pr-inline">
                            <input type="checkbox" x-model="sc.snap" id="snCb">
                            <label for="snCb">Grid snap</label>
                        </div>
                        <div class="pr"><label>Крок сітки (px)</label>
                            <input type="number" x-model.number="sc.grid" min="4" max="100"></div>
                    </div>
                </template>
                <template x-if="sel !== null">
                    <div>
                        <div class="pr-title" x-text="typeName(selEl.type)"></div>
                        <!-- endpoint coords for line/arrow (replaces X/Y/W/H/Scale) -->
                        <template x-if="selEl.type==='line' || selEl.type==='arrow'">
                            <div>
                                <div class="pr2">
                                    <div><label>X1 (px)</label><input type="number" :value="epPx(selEl,'start','x')" @change="setEndpointPx(selEl,'start','x',+$event.target.value)" min="0" :max="sc.width"></div>
                                    <div><label>Y1 (px)</label><input type="number" :value="epPx(selEl,'start','y')" @change="setEndpointPx(selEl,'start','y',+$event.target.value)" min="0" :max="sc.height"></div>
                                </div>
                                <div class="pr2">
                                    <div><label>X2 (px)</label><input type="number" :value="epPx(selEl,'end','x')" @change="setEndpointPx(selEl,'end','x',+$event.target.value)" min="0" :max="sc.width"></div>
                                    <div><label>Y2 (px)</label><input type="number" :value="epPx(selEl,'end','y')" @change="setEndpointPx(selEl,'end','y',+$event.target.value)" min="0" :max="sc.height"></div>
                                </div>
                                <div class="pr-sep"></div>
                            </div>
                        </template>
                        <div class="pr2" x-show="selEl.type!=='line' && selEl.type!=='arrow'">
                            <div><label>X</label><input type="number" :value="Math.round(selEl.x*sc.width)" @change="selEl.x=+$event.target.value/sc.width"></div>
                            <div><label>Y</label><input type="number" :value="Math.round(selEl.y*sc.height)" @change="selEl.y=+$event.target.value/sc.height"></div>
                        </div>
                        <div class="pr2" x-show="selEl.type!=='line' && selEl.type!=='arrow'">
                            <div>
                                <label>W</label>
                                <input type="number" :value="Math.round(selEl.w*sc.width)"
                                       @change="setElW(+$event.target.value)">

                            <div>
                                <label>H</label>
                                <input type="number" :value="Math.round(selEl.h*sc.height)"
                                       @change="setElH(+$event.target.value)">

                        <div class="pr" x-show="selEl.type!=='line' && selEl.type!=='arrow'">

                        </div>
                        <div class="pr-inline">
                            <input type="checkbox" x-model="selEl.onTop" id="elOnTop">

                        </div>
                        <div class="pr-sep"></div>
                        <template x-if="selEl.type==='label'">
                            <div>
                                <div class="pr"><label>Текст</label><input type="text" x-model="selEl.text"></div>
                                <div class="pr"><label>Розмір шрифту</label><input type="number" x-model.number="selEl.fontSize" min="8" max="120"></div>
                                <div class="pr"><label>Колір</label><input type="color" x-model="selEl.color"></div>
                                <div class="pr"><label>Вирівнювання</label>
                                    <select x-model="selEl.align">
                                        <option value="left">Ліво</option>
                                        <option value="center">Центр</option>
                                        <option value="right">Право</option>
                                    </select>
                                </div>
                                <div class="pr-inline"><input type="checkbox" x-model="selEl.bold" id="bCb"><label for="bCb">Жирний</label></div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='value'">
                            <div>
                                <div class="pr"><label>Point ID</label><input type="number" x-model.number="selEl.point_id" min="1"></div>
                                <div class="pr"><label>Розмір шрифту</label><input type="number" x-model.number="selEl.fontSize" min="8" max="120"></div>
                                <div class="pr"><label>Колір значення</label><input type="color" x-model="selEl.color"></div>
                                <div class="pr-inline"><input type="checkbox" x-model="selEl.showLabel" id="slCb"><label for="slCb">Показати підпис</label></div>
                                <div class="pr" x-show="selEl.showLabel"><label>Підпис</label><input type="text" x-model="selEl.label"></div>
                                <div class="pr" x-show="selEl.showLabel"><label>Розмір підпису</label><input type="number" x-model.number="selEl.labelFontSize" min="8" max="60"></div>
                                <div class="pr" x-show="selEl.showLabel"><label>Колір підпису</label><input type="color" x-model="selEl.labelColor"></div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='nav_btn'">
                            <div>
                                <div class="pr"><label>Текст</label><input type="text" x-model="selEl.text"></div>
                                <div class="pr"><label>Цільовий екран</label>
                                    <select @change="setElTarget($event.target.value)">
                                        <option value="" :selected="!selEl.target">— не обрано —</option>
                                        <template x-for="s in sameTypeScreens(curScreenType)" :key="s.id">
                                            <option :value="s.id"
                                                    :selected="selEl.target === s.id"
                                                    x-text="s.title+' ('+s.id+')'"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="pr"><label>Розмір шрифту</label><input type="number" x-model.number="selEl.fontSize" min="8" max="60"></div>
                                <div class="pr"><label>Фон</label><input type="color" x-model="selEl.bg"></div>
                                <div class="pr"><label>Колір тексту</label><input type="color" x-model="selEl.color"></div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='indicator'">
                            <div>
                                <div class="pr"><label>Point ID</label><input type="number" x-model.number="selEl.point_id" min="1"></div>
                                <div class="pr-sep"></div>
                                <div class="pr"><label>Статус</label>
                                    <select x-model="selIndQ">
                                        <option value="GOOD">● GOOD</option>
                                        <option value="WARN">● WARN</option>
                                        <option value="ALARM">● ALARM</option>
                                        <option value="UNCERT">● UNCERT</option>
                                    </select>
                                </div>
                                <div class="pr"><label>Колір</label>
                                    <input type="color"
                                        :value="indFill(selEl, selIndQ)"
                                        @input="setIndFill(selEl, selIndQ, $event.target.value)">
                                </div>
                                <div class="pr"><label>Рамка</label>
                                    <input type="color"
                                        :value="indBorder(selEl, selIndQ)"
                                        @input="setIndBorder(selEl, selIndQ, $event.target.value)">
                                </div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='rect'">
                            <div>
                                <div class="pr"><label>Заливка</label><input type="color" x-model="selEl.fill"></div>
                                <div class="pr"><label>Колір рамки</label><input type="color" x-model="selEl.borderColor"></div>
                                <div class="pr"><label>Товщина рамки</label><input type="number" x-model.number="selEl.borderWidth" min="0" max="20"></div>
                                <div class="pr"><label>Скруглення (px)</label><input type="number" x-model.number="selEl.radius" min="0" max="200"></div>
                                <div class="pr"><label>Прозорість</label><input type="range" x-model.number="selEl.opacity" min="0" max="1" step="0.05"
                                    style="flex:1"> <span style="width:30px;text-align:right;flex-shrink:0" x-text="Math.round((selEl.opacity??1)*100)+'%'"></span></div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='group_box'">
                            <div>
                                <div class="pr"><label>Назва групи</label><input type="text" x-model="selEl.title"></div>
                                <div class="pr"><label>Розмір шрифту</label><input type="number" x-model.number="selEl.fontSize" min="8" max="32"></div>
                                <div class="pr"><label>Вирівнювання</label>
                                    <select x-model="selEl.textAlign">
                                        <option value="left">Ліво</option>
                                        <option value="center">Центр</option>
                                        <option value="right">Право</option>
                                    </select>
                                </div>
                                <div class="pr"><label>Колір підпису</label><input type="color" x-model="selEl.color"></div>
                                <div class="pr-sep"></div>
                                <div class="pr"><label>Заливка</label><input type="color" x-model="selEl.fill"></div>
                                <div class="pr"><label>Колір рамки</label><input type="color" x-model="selEl.borderColor"></div>
                                <div class="pr"><label>Товщина рамки</label><input type="number" x-model.number="selEl.borderWidth" min="0" max="10"></div>
                                <div class="pr"><label>Скруглення (px)</label><input type="number" x-model.number="selEl.radius" min="0" max="100"></div>
                                <div class="pr" style="display:flex;align-items:center;gap:8px">
                                    <label style="flex:1">Прозорість</label>
                                    <input type="range" x-model.number="selEl.opacity" min="0" max="1" step="0.05" style="flex:2">
                                    <span style="width:30px;text-align:right" x-text="Math.round((selEl.opacity??0.75)*100)+'%'"></span>
                                </div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='ellipse'">
                            <div>
                                <div class="pr"><label>Заливка</label><input type="color" x-model="selEl.fill"></div>
                                <div class="pr"><label>Колір обводки</label><input type="color" x-model="selEl.strokeColor"></div>
                                <div class="pr"><label>Товщина обводки</label><input type="number" x-model.number="selEl.strokeWidth" min="0" max="20"></div>
                                <div class="pr" style="display:flex;align-items:center;gap:8px">
                                    <label style="flex:1">Прозорість</label>
                                    <input type="range" x-model.number="selEl.opacity" min="0" max="1" step="0.05" style="flex:2">
                                    <span style="width:30px;text-align:right" x-text="Math.round((selEl.opacity??1)*100)+'%'"></span>
                                </div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='line'">
                            <div>
                                <div class="pr"><label>Колір</label><input type="color" x-model="selEl.color"></div>

                                <div class="pr-inline">
                                    <input type="checkbox" x-model="selEl.dashed" id="lineDash">

                                </div>

                                    <div class="pr2">
                                        <div><label>Штрих</label><input type="number" x-model.number="selEl.dashLen" min="1" max="50"></div>
                                        <div><label>Пропуск</label><input type="number" x-model.number="selEl.dashGap" min="1" max="50"></div>
                                    </div>
                                </template>
                                <div class="pr" style="display:flex;align-items:center;gap:8px">
                                    <label style="flex:1">Прозорість</label>
                                    <input type="range" x-model.number="selEl.opacity" min="0" max="1" step="0.05" style="flex:2">
                                    <span style="width:30px;text-align:right" x-text="Math.round((selEl.opacity??1)*100)+'%'"></span>
                                </div>
                            </div>
                        </template>
                        <template x-if="selEl.type==='active_line'">
                            <div>
                                <div class="pr">

                                            x-effect="void allTimerPoints.length; void selEl.point_id; $nextTick(() => { $el.value = String(selEl.point_id || 0); })">

                                    </select>
                                </div>
                                <div class="pr"><label>Товщина</label><input type="number" x-model.number="selEl.strokeWidth" min="1" max="40"></div>

                                <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
                                    <span style="font-size:11px;color:#8b949e;flex:1">Значення:</span>
                                    <button @click="alState=1"
                                            :style="alState===1?'background:#238636;color:#fff;border-color:#238636':''"
                                            style="padding:2px 12px;font-size:11px;border:1px solid #444;border-radius:4px;cursor:pointer;background:#161b22;color:#8b949e">1</button>
                                    <button @click="alState=0"
                                            :style="alState===0?'background:#484f58;color:#fff;border-color:#6e7681':''"
                                            style="padding:2px 12px;font-size:11px;border:1px solid #444;border-radius:4px;cursor:pointer;background:#161b22;color:#8b949e">0</button>

                                    <input type="checkbox" id="alDashedCk"
                                           :checked="alState===1 ? !!selEl.dashed1 : !!selEl.dashed0"
                                           @change="alState===1 ? (selEl.dashed1=$event.target.checked) : (selEl.dashed0=$event.target.checked)">

                                    <div class="pr2">
                                        <div><label>Штрих</label>
                                            <input type="number" min="2" max="80"
                                                   :value="alState===1 ? selEl.dashLen1 : selEl.dashLen0"
                                                   @change="alState===1 ? (selEl.dashLen1=+$event.target.value) : (selEl.dashLen0=+$event.target.value)">

                                        <div><label>Пропуск</label>
                                            <input type="number" min="1" max="80"
                                                   :value="alState===1 ? selEl.dashGap1 : selEl.dashGap0"

                                        </div>
                                    </div>
                                </template>
                                <div class="pr">
                                    <label>Ефект</label>

                                        <option value="flow_right">Потік →</option>
                                        <option value="flow_left">Потік ←</option>
                                        <option value="blink">Миготіння</option>
                                        <option value="pulse">Пульсація</option>
                                        <option value="glow">Свічення</option>
                                        <option value="none">Прихований</option>
                                    </select>
                                </div>
                                <template x-if="['flow_right','flow_left'].includes(alState===1 ? selEl.effect1 : selEl.effect0)">
                                    <div class="pr2">
                                        <div><label>Штрих</label>
                                            <input type="number" min="2" max="80"
                                                   :value="alState===1 ? selEl.dashLen1 : selEl.dashLen0"
                                                   @change="alState===1 ? (selEl.dashLen1=+$event.target.value) : (selEl.dashLen0=+$event.target.value)">

<script>
function app() {
    return {
        CANVAS_W: 3000,
        CANVAS_H: 2000,

        mode: "structure",   // "structure" | "elements"
        project: { screens: [] },
        screenCache: {},

        // structure
        sgrid: { snap: true, step: 20 },
        decos: [],
        selNodeId: null,
        selDecoId: null,
        selIndQ:      'GOOD',
        selLevelColor:'colorGood',
        selGaugeColor:'colorGood',
        selBiColor:     'colorOn',
        selCtrlColor:   'colorManual',
        selOpmodeColor: 'colorGood',

        // elements
        sc:  { id:"", title:"", width:1280, height:720, grid:20, snap:true, bg:"#1a1a2e", bgImage:"" },
        els: [],
        sel: null,
        alState: 1,  /* active_line: редагований стан 1 або 0 */

        status: { msg:"Готово", ok:true },
        createModal: { open:false },
        deleteModal:  { open:false, node:null },
        _ctxMenu:     { open:false, x:0, y:0, elId:null },
        _showLayer:   false,
        _createType: 'pc',
        _createDevType: 1,
        structView: 'canvas',   // 'canvas' | 'table'

        SCREEN_TYPES: {
            pc:     { prefix:'P', label:'PC',     color:'#58a6ff', dimColor:'#2d5a8e', bg:'#1a2533' },
            render: { prefix:'R', label:'Render', color:'#56d364', dimColor:'#2d6e2d', bg:'#1a2e1a' },
            mobile: { prefix:'M', label:'Mobile', color:'#e3b341', dimColor:'#6e5a2d', bg:'#2e2a1a' },
        },

        _scale: 1,
        _bgAspect: null,
        _refW: 0, _refH: 0,
        _selIdx: -1,   // індекс виділеного елементу в els (для точної реактивності)
        _sScale: 1,   // structure zoom
        _drag:  null,
        _off:   { x:0, y:0 },
        _ndrag: null,
        _noff:  { x:0, y:0 },
        _ddrag: null,
        _doff:  { x:0, y:0 },
        _rdrag: null,  // resize: { deco, handle, startX, startY, startW, startH }
        _groupChildren: [],  // nodes+decos inside dragged group (structure)
        _groupEls: [],       // elements inside dragged group_box (elements mode)
        _epdrag: null,       // { el, point:'start'|'end' } — endpoint drag for line/arrow

        // Cached points list — used to populate point_id selectors (especially
        // bistable elements which can only bind to type=discrete points).
        allPoints: [],
        // Collapsed/expanded state for palette groups (persisted in localStorage)
        _palOpen: (() => {
            try { return JSON.parse(localStorage.getItem('ib-pal-open') || '{}'); }
            catch { return {}; }
        })(),
        isPalOpen(g) { return this._palOpen[g] === true; },       // default closed
        togglePalGroup(g) {
            this._palOpen[g] = !this.isPalOpen(g);
            try { localStorage.setItem('ib-pal-open', JSON.stringify(this._palOpen)); } catch {}
        },
        get elTypeMeta() {
            const map = {};
            for (const g of this.paletteGroups)
                for (const item of g.items)
                    map[item.type] = { icon: item.icon, label: item.label };
            return map;
        },
        get discretePoints() {
            return this.allPoints.filter(p => p.type === "discrete");
        },
        get calculatedPoints() {
            return this.allPoints.filter(p => p.type === "calculated");
        },
        get operationModePoints() {
            return this.allPoints.filter(p => p.type === "operation_mode");
        },
        get controlPoints() {
            return this.allPoints.filter(p => p.type === "control");
        },
        get allTimerPoints() {
            return this.allPoints.filter(p => ["discrete","control","operation_mode"].includes(p.type));
        },
        // Severity of the discrete point currently bound to selEl, or null when
        // unbound. Drives which colour-state options are offered.
        get _biSeverity() {
            const pid = this.selEl?.point_id;
            if (!pid) return null;
            const p = this.allPoints.find(x => x.id === pid);
            return p?.severity ?? "none";
        },
        get bistableColorOptions() {
            // bi_image uses uploaded SVGs for state visualization — only the
            // frame border and label colour are configurable
            if (this.selEl?.type === 'bi_image') {
                return [
                    { value: 'bgColor',     label: '▪ Фон' },
                    { value: 'colorBorder', label: '□ Рамка' },
                    { value: 'color',       label: 'T Текст підпису' },
                ];
            }
            const sev = this._biSeverity;
            const opts = [
