<!DOCTYPE html>
<html lang="uk" x-data="app()" :class="theme" x-cloak>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrabox</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>
        [x-cloak]{display:none!important}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

        /* ── CSS variables ── */
        :root {
            --bg:       #0d1117;
            --bg2:      #161b22;
            --bg3:      #21262d;
            --border:   #30363d;
            --text:     #c9d1d9;
            --text-dim: #8b949e;
            --accent:   #58a6ff;
            --hdr-h:    52px;
            --ftr-h:    28px;
        }
        html.light {
            --bg:       #f6f8fa;
            --bg2:      #ffffff;
            --bg3:      #eaeef2;
            --border:   #d0d7de;
            --text:     #1f2328;
            --text-dim: #57606a;
            --accent:   #0969da;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            font-size: 13px;
        }
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ── header ── */
        header {
            height: var(--hdr-h);
            flex-shrink: 0;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            position: relative;
            z-index: 100;
        }
        .hdr-logo {
            font-size: 17px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -.3px;
            white-space: nowrap;
            text-decoration: none;
        }
        .hdr-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
        .hdr-breadcrumb {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 0;
            overflow: hidden;
        }
        .hdr-back {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg3);
            color: var(--text);
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
            transition: background .12s;
        }
        .hdr-back:hover { background: var(--border); }
        .hdr-screen {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hdr-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .hdr-clock {
            text-align: right;
            line-height: 1.3;
        }
        .hdr-clock .time {
            font-size: 16px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            letter-spacing: .5px;
        }
        .hdr-clock .date {
            font-size: 11px;
            color: var(--text-dim);
        }
        .btn {
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background .12s;
        }
        .btn:hover { background: var(--border); }

        /* ── user menu ── */
        .user-wrap { position: relative; }
        .hdr-user {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-dim);
            white-space: nowrap;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: background .12s, border-color .12s;
        }
        .hdr-user:hover { background: var(--bg3); border-color: var(--border); }
        .hdr-user .u-icon {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--bg3);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
        }
        .hdr-user .u-name { color: var(--text); font-weight: 500; }

        /* ── settings menu ── */
        .settings-wrap { position: relative; }
        .settings-btn {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg3);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            transition: background .12s, color .12s;
        }
        .settings-btn:hover { background: var(--border); color: var(--text); }
        .settings-drop {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 190px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
            padding: 6px 0;
            z-index: 200;
        }
        .sdrop-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            transition: background .1s;
        }
        .sdrop-item:hover { background: var(--bg3); }
        .sdrop-icon { font-size: 15px; width: 18px; text-align: center; color: var(--text-dim); }
        .sdrop-sep { height: 1px; background: var(--border); margin: 5px 0; }
        .toggle-wrap {
            display: flex; align-items: center; gap: 9px;
            padding: 8px 14px; cursor: pointer;
            color: var(--text); font-size: 13px;
        }
        .toggle-wrap:hover { background: var(--bg3); }
        .toggle {
            position: relative;
            width: 34px; height: 18px;
            flex-shrink: 0;
        }
        .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
        .toggle-track {
            position: absolute; inset: 0;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 9px;
            transition: background .2s;
        }
        .toggle input:checked ~ .toggle-track { background: var(--accent); border-color: var(--accent); }
        .toggle-thumb {
            position: absolute;
            top: 2px; left: 2px;
            width: 12px; height: 12px;
            background: var(--text-dim);
            border-radius: 50%;
            transition: transform .2s, background .2s;
        }
        .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); background: #fff; }

        /* ── main ── */
        main {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }
        #canvas-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* ── canvas ── */
        .cv-wrap { position: relative; flex-shrink: 0; }
        #cv {
            position: relative;
            transform-origin: top left;
            box-shadow: 0 4px 24px rgba(0,0,0,.5);
            will-change: transform;
        }
        /* element styles (same as constructor) */
        .c-el { position: absolute; }
        .r-label { position: absolute; inset: 0; display: flex; align-items: center; overflow: hidden; }
        .r-value {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: stretch;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 4px;
            background: rgba(0,0,0,.25);
            overflow: hidden;
        }
        .r-value .vl { font-size: 11px; color: var(--text-dim); flex-shrink: 0; margin-top: 2px; }
        .r-value .vrow { display: flex; align-items: baseline; gap: 4px; min-width: 0; flex: 1; }
        .r-value .vv  { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
        .r-value .vu  { flex-shrink: 0; color: var(--text-dim); text-align: right; }
        .r-navbtn {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,.15);
            font-weight: 600;
            overflow: hidden;
            cursor: pointer;
            transition: filter .15s;
        }
        .r-navbtn:hover { filter: brightness(1.2); }
        .r-indicator { position: absolute; inset: 0; border-radius: 50%; transition: background .3s; }
        .r-rect  { position: absolute; inset: 0; }
        .r-level { position: absolute; inset: 0; overflow: hidden; border-radius: 4px; }
        .r-level-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.9); pointer-events: none; font-variant-numeric: tabular-nums; }
        .r-gauge { position: absolute; inset: 0; overflow: hidden; }
        .r-timer { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: stretch; padding: 4px 8px; border: 1px solid rgba(255,255,255,.08); border-radius: 4px; background: rgba(0,0,0,.25); overflow: hidden; }
        .r-timer .tv  { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .r-timer .tcd { font-size: 10px; color: var(--text-dim); margin-top: 1px; white-space: nowrap; }
        .r-tbar { position: absolute; inset: 0; overflow: hidden; border-radius: 4px; }
        .r-ibox { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; border: 2px solid rgba(255,255,255,.12); transition: border-color .3s, filter .15s; }
        .r-ibox:hover { filter: brightness(1.12); }
        .r-ibox-bg { flex: 1; background-size: contain; background-repeat: no-repeat; background-position: center; }
        .r-ibox-foot { padding: 3px 8px; background: rgba(0,0,0,.55); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .r-ibox-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: background .3s; }
        .r-ibox-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .r-shape { position: absolute; inset: 0; overflow: visible; }

        /* ── active_line: global animation keyframes ── */
        @keyframes al-fwd   { to { stroke-dashoffset: var(--al-end);  } }
        @keyframes al-rev   { to { stroke-dashoffset: var(--al-endr); } }
        @keyframes al-blink { 0%,49%{opacity:var(--al-op)} 50%,100%{opacity:0} }
        @keyframes al-pulse { 0%,100%{opacity:var(--al-op)} 50%{opacity:.03} }
        @keyframes al-glow  { 0%,100%{opacity:var(--al-op)} 50%{opacity:.2} }

        /* ── empty / loading states ── */
        .state-msg {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            color: var(--text-dim);
        }
        .state-msg .icon { font-size: 48px; opacity: .3; }
        .state-msg p { font-size: 15px; }

        /* ── footer ── */
        footer {
            height: var(--ftr-h);
            flex-shrink: 0;
            background: var(--bg2);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 12px;
        }
        .ws-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .ws-live    { background: #56d364; box-shadow: 0 0 6px #56d364; }
        .ws-conn    { background: #f0ad4e; }
        .ws-error   { background: #f47067; }
        .ftr-text   { font-size: 11px; color: var(--text-dim); }
        .ftr-right  { margin-left: auto; font-size: 11px; color: var(--text-dim); }

        /* ── responsive (≤ 768px) ──────────────────────────────────────────
           Compact header so everything fits in a phone viewport. */
        @media (max-width: 768px) {
            header { padding: 0 8px; gap: 6px; }
            .hdr-sep { display: none; }
            .hdr-logo { font-size: 0; }
            .hdr-logo::before { content: "⬡"; font-size: 22px; }
            .hdr-breadcrumb { flex: 1 1 auto; min-width: 0; }
            .hdr-screen { font-size: 13px; }
            .hdr-user .u-name { display: none; }
            .hdr-user { padding: 4px 6px; gap: 0; }
            .hdr-clock .date { display: none; }
            .hdr-clock .time { font-size: 13px; }
            .hdr-right { gap: 6px; }
            .btn { padding: 5px 8px; }
            .btn-menu-label { display: none; }
            #canvas-area { padding: 6px; }
            footer { padding: 0 8px; gap: 8px; }
            .ftr-right { font-size: 10px; }
        }
    </style>
</head>

<body @click="menuOpen && (menuOpen=false, menuPage='main'); userMenuOpen && (userMenuOpen=false)">

<!-- ═══════════ HEADER ═══════════ -->
<header>
    <a class="hdr-logo" href="/">⬡ Infrabox</a>
    <div class="hdr-sep"></div>

    <!-- back button (always left) -->
    <button class="hdr-back" x-show="history.length > 0"
            @click.stop="goBack()" title="Назад">←</button>

    <!-- title centered in remaining space -->
    <div class="hdr-breadcrumb">
        <span class="hdr-screen" x-text="screenTitle()"></span>
    </div>

    <!-- right side -->
    <div class="hdr-right">

        <!-- user -->
        <div class="user-wrap" @click.stop>
            <div class="hdr-user" @click="menuOpen=false; menuPage='main'; userMenuOpen=!userMenuOpen">
                <div class="u-icon">👤</div>
                <span class="u-name" x-text="userName()"></span>
            </div>
            <div class="settings-drop" x-show="userMenuOpen" x-transition>
                <div class="sdrop-item" x-show="isLoggedIn" @click="logout(); userMenuOpen=false">
                    <span class="sdrop-icon">🚪</span> Вийти
                </div>
                <a class="sdrop-item" href="/login" x-show="!isLoggedIn">
                    <span class="sdrop-icon">🔑</span> Увійти
                </a>
            </div>
        </div>

        <div class="hdr-sep"></div>

        <!-- menu -->
        <div class="settings-wrap" @click.stop>
            <button class="btn btn-menu" @click="menuOpen ? (menuOpen=false, menuPage='main') : (menuOpen=true); userMenuOpen=false"
                    style="gap:5px;display:flex;align-items:center;">
                ☰<span class="btn-menu-label"> Меню</span>
            </button>
            <div class="settings-drop" x-show="menuOpen" x-transition style="min-width:200px">

                <!-- головна сторінка меню -->
                <template x-if="menuPage==='main'">
                    <div>
                        <div class="sdrop-item" @click="menuPage='device'">
                            <span class="sdrop-icon">🖥</span> Пристрій відображення
                            <span style="margin-left:auto;color:var(--accent);font-size:12px;font-weight:600" x-text="'#'+deviceType"></span>
                            <span style="color:var(--text-dim);font-size:12px;margin-left:4px">›</span>
                        </div>
                        <div class="sdrop-item" @click="menuPage='settings'">
                            <span class="sdrop-icon">⚙</span> Налаштування
                            <span style="margin-left:auto;color:var(--text-dim);font-size:12px">›</span>
                        </div>
                        <div class="sdrop-sep"></div>
                        <div class="sdrop-item" @click="_menuGo('/admin', 'admin')">
                            <span class="sdrop-icon">🛡</span> Адміністрування
                        </div>
                        <div class="sdrop-item" @click="_menuGo('/constructor', 'constructor')">
                            <span class="sdrop-icon">🔧</span> Конструктор
                        </div>
                        <div class="sdrop-sep"></div>
                        <label class="toggle-wrap" @click.stop>
                            <span class="sdrop-icon">☀</span>
                            Світла тема
                            <div class="toggle" style="margin-left:auto">
                                <input type="checkbox" :checked="theme==='light'" @change="toggleTheme()">
                                <div class="toggle-track"></div>
                                <div class="toggle-thumb"></div>
                            </div>
                        </label>
                        <div class="sdrop-sep"></div>
                        <a class="sdrop-item" href="/docs">
                            <span class="sdrop-icon">📄</span> Документація
                        </a>
                    </div>
                </template>

                <!-- пристрій відображення -->
                <template x-if="menuPage==='device'">
                    <div>
                        <div class="sdrop-item" @click="menuPage='main'" style="color:var(--text-dim)">
                            <span class="sdrop-icon" style="font-size:13px">‹</span> Назад
                        </div>
                        <div class="sdrop-sep"></div>
                        <template x-if="deviceTypes.length === 0">
                            <div style="padding:10px 14px;font-size:12px;color:var(--text-dim)">Немає даних</div>
                        </template>
                        <template x-for="dt in deviceTypes" :key="dt">
                            <div class="sdrop-item" @click="setDeviceType(dt)">
                                <span class="sdrop-icon" :style="deviceType===dt?'color:var(--accent)':''" x-text="deviceType===dt?'●':'○'"></span>
                                <span x-text="'Пристрій #'+dt"></span>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- сторінка налаштувань -->
                <template x-if="menuPage==='settings'">
                    <div>
                        <div class="sdrop-item" @click="menuPage='main'" style="color:var(--text-dim)">
                            <span class="sdrop-icon" style="font-size:13px">‹</span> Назад
                        </div>
                        <div class="sdrop-sep"></div>
                        <a class="sdrop-item" href="/dashboard">
                            <span class="sdrop-icon">📊</span> Всі параметри
                        </a>
                    </div>
                </template>

            </div>
        </div>

        <div class="hdr-sep"></div>

        <!-- clock (far right) -->
        <div class="hdr-clock">
            <div class="time" x-text="clock"></div>
            <div class="date" x-text="clockDate"></div>
        </div>
    </div>
</header>

<!-- ═══════════ MAIN ═══════════ -->
<main>
    <div id="canvas-area">

        <!-- loading -->
        <div class="state-msg" x-show="loading">
            <div class="icon">⏳</div>
            <p>Завантаження...</p>
        </div>

        <!-- no screens -->
        <div class="state-msg" x-show="!loading && !sc">
            <div class="icon">📋</div>
            <p>Екрани не налаштовані</p>
        </div>

        <!-- canvas -->
        <template x-if="sc">
            <div class="cv-wrap"
                 :style="`width:${Math.round(sc.width*viewScale)}px;height:${Math.round(sc.height*viewScale)}px;`">
                <div id="cv"
                     :style="`width:${sc.width}px;height:${sc.height}px;
                              background-color:${sc.bg};
                              background-image:${cvBgImage()};
                              background-size:100% 100%;
                              transform:scale(${Math.round(sc.width*viewScale)/sc.width},${Math.round(sc.height*viewScale)/sc.height});transform-origin:top left;`">

                    <template x-for="el in els" :key="el.id">
                        <div class="c-el"
                             :style="`left:${el.x*100}%;top:${el.y*100}%;
                                      width:${el.w*sc.width}px;height:${el.h*sc.height}px;
                                      z-index:${el.onTop?8:el.type==='group_box'?1:2};`">

                            <!-- label -->
                            <template x-if="el.type==='label'">
                                <div class="r-label"
                                     :style="`font-size:${el.fontSize}px;color:${el.color};
                                              font-weight:${el.bold?'bold':'normal'};
                                              justify-content:${el.align==='center'?'center':el.align==='right'?'flex-end':'flex-start'};`"
                                     x-text="el.text"></div>
                            </template>

                            <!-- value -->
                            <template x-if="el.type==='value'">
                                <div style="position:absolute;inset:0;overflow:visible">
                                    <div class="r-value">
                                        <div class="vrow">
                                            <span class="vv"
                                                  :style="`font-size:${el.fontSize}px;color:${valueColor(el)};`"
                                                  x-text="ptValue(el.point_id)"></span>
                                            <span class="vu" x-show="ptUnit(el.point_id)"
                                                  :style="`font-size:${el.fontSize}px;`"
                                                  x-text="ptUnit(el.point_id)"></span>
                                        </div>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.labelFontSize||11}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label || (points[el.point_id]?.pointname || '')"></div>
                                </div>
                            </template>

                            <!-- nav_btn -->
                            <template x-if="el.type==='nav_btn'">
                                <div class="r-navbtn"
                                     :style="`background:${el.bg};color:${el.color};font-size:${el.fontSize}px;`"
                                     @click="navigate(el.target)"
                                     x-text="el.text"></div>
                            </template>

                            <!-- indicator -->
                            <template x-if="el.type==='indicator'">
                                <div class="r-indicator"
                                     :style="`background:${indicatorColor(el)};
                                              border:2px solid ${indicatorBorder(el)};`"></div>
                            </template>

                            <!-- rect -->
                            <template x-if="el.type==='rect'">
                                <div class="r-rect"
                                     :style="`background:${el.fill};
                                              border:${el.borderWidth}px solid ${el.borderColor};
                                              border-radius:${el.radius}px;
                                              opacity:${el.opacity??1};`"></div>
                            </template>

                            <!-- ibox_screen: підсистема зі станом параметра -->
                            <template x-if="el.type==='ibox_screen'">
                                <div class="r-ibox"
                                     :style="`border-color:${iboxBorderColor(el)};border-width:${el.borderWidth??2}px`"
                                     @click="navigate(el.target)">
                                    <div class="r-ibox-bg"
                                         :style="el.svgImage ? `background-image:url(${el.svgImage})` : 'background:rgba(88,166,255,.07)'"></div>
                                    <div class="r-ibox-foot">
                                        <div class="r-ibox-dot" :style="`background:${iboxDotColor(el)}`"></div>
                                        <span class="r-ibox-title"
                                              :style="`font-size:${el.fontSize}px;color:${el.color}`"
                                              x-text="el.title"></span>
                                    </div>
                                </div>
                            </template>

                            <!-- ibox_link: посилання на веб-сторінку -->
                            <template x-if="el.type==='ibox_link'">
                                <div class="r-ibox"
                                     :style="`border-color:rgba(255,255,255,.2);border-width:${el.borderWidth??2}px`"
                                     @click="openHref(el.href)">
                                    <div class="r-ibox-bg"
                                         :style="el.svgImage ? `background-image:url(${el.svgImage})` : 'background:rgba(80,255,160,.05)'"></div>
                                    <div class="r-ibox-foot">
                                        <span style="font-size:10px;color:#8b949e;flex-shrink:0">⇗</span>
                                        <span class="r-ibox-title"
                                              :style="`font-size:${el.fontSize}px;color:${el.color}`"
                                              x-text="el.title"></span>
                                    </div>
                                </div>
                            </template>

                            <!-- level_v / level_h: індикатор рівня рідини -->
                            <template x-if="el.type==='level_v'">
                                <div class="r-level" :style="`background:${el.bgColor};border:${el.borderWidth||1}px solid ${el.borderColor||'#30363d'};border-radius:${el.borderRadius??4}px`">
                                    <div :style="levelFillStyle(el)"></div>
                                    <div class="r-level-val" x-show="el.showValue"
                                         :style="`font-size:${el.fontSize||12}px;color:${el.color||'#fff'}`"
                                         x-text="ptValue(el.point_id) + (ptUnit(el.point_id) ? ' '+ptUnit(el.point_id) : '')"></div>
                                </div>
                            </template>
                            <template x-if="el.type==='level_h'">
                                <div class="r-level" :style="`background:${el.bgColor};border:${el.borderWidth||1}px solid ${el.borderColor||'#30363d'};border-radius:${el.borderRadius??4}px`">
                                    <div :style="levelFillStyle(el)"></div>
                                    <div class="r-level-val" x-show="el.showValue"
                                         :style="`font-size:${el.fontSize||12}px;color:${el.color||'#fff'}`"
                                         x-text="ptValue(el.point_id) + (ptUnit(el.point_id) ? ' '+ptUnit(el.point_id) : '')"></div>
                                </div>
                            </template>
                            <template x-if="el.type==='gauge'">
                                <div class="r-gauge"
                                     :style="`background:${el.bgColor};border:${el.borderWidth||0}px solid ${el.borderColor||'#30363d'};border-radius:${el.borderRadius??8}px`">
                                    <svg width="100%" height="100%" viewBox="0 0 100 100">
                                        <path :d="_gaugeArcPath(50,56,36,135,405)||''" fill="none" stroke="#21262d" :stroke-width="el.arcWidth||10" stroke-linecap="butt"/>
                                        <path :d="gaugeZoneD(el,0)" fill="none" :stroke="gaugeZoneC(el,0)" :stroke-width="el.arcWidth||10" stroke-linecap="butt"/>
                                        <path :d="gaugeZoneD(el,1)" fill="none" :stroke="gaugeZoneC(el,1)" :stroke-width="el.arcWidth||10" stroke-linecap="butt"/>
                                        <path :d="gaugeZoneD(el,2)" fill="none" :stroke="gaugeZoneC(el,2)" :stroke-width="el.arcWidth||10" stroke-linecap="butt"/>
                                        <path :d="gaugeZoneD(el,3)" fill="none" :stroke="gaugeZoneC(el,3)" :stroke-width="el.arcWidth||10" stroke-linecap="butt"/>
                                        <path :d="gaugeZoneD(el,4)" fill="none" :stroke="gaugeZoneC(el,4)" :stroke-width="el.arcWidth||10" stroke-linecap="butt"/>
                                        <line :x1="gaugeNeedleCoord(el,0)" :y1="gaugeNeedleCoord(el,1)"
                                              :x2="gaugeNeedleCoord(el,2)" :y2="gaugeNeedleCoord(el,3)"
                                              :stroke="gaugeNeedleColor(el)" stroke-width="2" stroke-linecap="round"/>
                                        <circle cx="50" cy="56" r="3.5" :fill="gaugeNeedleColor(el)"/>
                                        <text x="50" y="88" text-anchor="middle" font-weight="600"
                                              font-family="system-ui,sans-serif" font-variant-numeric="tabular-nums"
                                              :fill="gaugeTextColor(el)" :font-size="el.fontSize||13"
                                              x-show="el.showValue" x-text="gaugeValueText(el)"></text>
                                        <text x="50" y="8" text-anchor="middle"
                                              font-family="system-ui,sans-serif"
                                              :fill="el.labelColor||'#8b949e'" :font-size="el.labelFontSize||11"
                                              x-show="!!el.label" x-text="el.label||''"></text>
                                    </svg>
                                </div>
                            </template>

                            <!-- group_box -->
                            <template x-if="el.type==='group_box'">
                                <div style="position:absolute;inset:0">
                                    <div :style="`position:absolute;inset:0;
                                                  background:${el.fill};
                                                  border:${el.borderWidth}px solid ${el.borderColor};
                                                  border-radius:${el.radius}px;
                                                  opacity:${el.opacity??0.75}`"></div>
                                    <div :style="`position:absolute;top:5px;
                                                  left:${el.borderWidth+6}px;right:${el.borderWidth+6}px;
                                                  font-size:${el.fontSize||12}px;color:${el.color||'#8b949e'};
                                                  font-weight:500;white-space:nowrap;overflow:hidden;
                                                  text-overflow:ellipsis;text-align:${el.textAlign||'left'}`"
                                         x-text="el.title||'Група'"></div>
                                </div>
                            </template>

                            <!-- ellipse -->
                            <template x-if="el.type==='ellipse'">
                                <div class="r-shape" x-html="svgEllipse(el)"></div>
                            </template>

                            <!-- line -->
                            <template x-if="el.type==='line'">
                                <div class="r-shape" x-html="svgLine(el)"></div>
                            </template>

                            <!-- active_line: persistent SVG — no x-html, prevents animation restart -->
                            <template x-if="el.type==='active_line'">
                                <div class="r-shape">
                                    <svg :viewBox="`0 0 ${Math.round(el.w*sc.width)} ${Math.round(el.h*sc.height)}`"
                                         width="100%" height="100%" overflow="visible" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <filter :id="`al_gf${el.id}`" x="-60%" y="-60%" width="220%" height="220%">
                                                <feGaussianBlur :stdDeviation="((el.strokeWidth||4)*1.8).toFixed(1)" result="b"/>
                                                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                                            </filter>
                                        </defs>
                                        <line
                                            :x1="((el.x1??0)  /100*Math.round(el.w*sc.width)).toFixed(1)"
                                            :y1="((el.y1??50) /100*Math.round(el.h*sc.height)).toFixed(1)"
                                            :x2="((el.x2??100)/100*Math.round(el.w*sc.width)).toFixed(1)"
                                            :y2="((el.y2??50) /100*Math.round(el.h*sc.height)).toFixed(1)"
                                            :stroke="_alColor(el)"
                                            :stroke-width="el.strokeWidth||4"
                                            stroke-linecap="round"
                                            :stroke-dasharray="_alDash(el)"
                                            :style="_alStyle(el)"
                                        />
                                    </svg>
                                </div>
                            </template>

                            <!-- active_arc: persistent SVG — no x-html, prevents animation restart -->
                            <template x-if="el.type==='active_arc'">
                                <div class="r-shape">
                                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                                        <defs>
                                            <filter :id="`aa_gf${el.id}`" x="-60%" y="-60%" width="220%" height="220%">
                                                <feGaussianBlur :stdDeviation="((el.strokeWidth||4)*1.8).toFixed(1)" result="b"/>
                                                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                                            </filter>
                                        </defs>
                                        <path
                                            :d="_aaD(el)"
                                            fill="none"
                                            :stroke="_alColor(el)"
                                            :stroke-width="el.strokeWidth||4"
                                            stroke-linecap="round"
                                            :stroke-dasharray="_alDash(el)"
                                            :style="_aaStyle(el)"
                                        />
                                    </svg>
                                </div>
                            </template>

                            <!-- arrow -->
                            <template x-if="el.type==='arrow'">
                                <div class="r-shape" x-html="svgArrow(el)"></div>
                            </template>

                            <!-- triangle -->
                            <template x-if="el.type==='triangle'">
                                <div class="r-shape" x-html="svgTriangle(el)"></div>
                            </template>

                            <!-- arc -->
                            <template x-if="el.type==='arc'">
                                <div class="r-shape" x-html="svgArc(el)"></div>
                            </template>

                            <!-- bistable: pump / motor / valve / relay / reed / optical / image -->
                            <template x-if="el.type && el.type.startsWith('bi_')">
                                <div style="position:absolute;inset:0">
                                    <div :style="`position:absolute;inset:0;border:${el.borderWidth??0}px solid ${el.colorBorder||'#8b949e'};border-radius:${el.borderRadius||0}px;box-sizing:border-box;overflow:hidden;${el.type==='bi_image' ? biImageBgStyle(biImageSrcEl(el)) : ''}`"
                                         x-html="el.type==='bi_image' ? '' : bistableSvgEl(el)"></div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.fontSize||11}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label || (points[el.point_id]?.pointname || '')"></div>
                                </div>
                            </template>

                            <!-- calc_box: formula-driven calculated element -->
                            <template x-if="el.type === 'calc_box'">
                                <div style="position:absolute;inset:0;overflow:visible">
                                    <div :style="`position:absolute;inset:0;border:${el.borderWidth||0}px solid ${el.colorBorder||'#58a6ff'};border-radius:${el.borderRadius||0}px;box-sizing:border-box;overflow:hidden;${biImageBgStyle(calcBoxImageSrc(el))}`"></div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.fontSize||11}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label || '∑'"></div>
                                </div>
                            </template>

                            <!-- ctrl_opmode: operation mode element, border color by state/value -->
                            <template x-if="el.type === 'ctrl_opmode'">
                                <div style="position:absolute;inset:0;overflow:visible;cursor:pointer"
                                     @click.stop="ctrlOpmodeClick(el)">
                                    <div :style="`position:absolute;inset:0;border:${el.borderWidth??2}px solid ${ctrlOpmodeColor(el)};border-radius:${el.borderRadius||8}px;box-sizing:border-box;overflow:hidden;${biImageBgStyle(ctrlOpmodeImageSrc(el))}`"></div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.fontSize||11}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label || 'Режим'"></div>
                                </div>
                            </template>

                            <!-- ctrl_signal: control signal element, border color by ctrl_status quality -->
                            <template x-if="el.type === 'ctrl_signal'">
                                <div style="position:absolute;inset:0;overflow:visible"
                                     :style="sysIsManual(points[el.point_id]?.system) ? 'cursor:pointer' : 'cursor:default'"
                                     @click.stop="sysIsManual(points[el.point_id]?.system) && ctrlBtnClick(el)">
                                    <div :style="`position:absolute;inset:0;border:${el.borderWidth??2}px solid ${ctrlSignalColor(el)};border-radius:${el.borderRadius||8}px;box-sizing:border-box;overflow:hidden;${biImageBgStyle(ctrlSignalImageSrc(el))}`">
                                        <template x-if="!el.image0 && !el.image1">
                                            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                                                <span style="font-size:20px;color:#8b949e">⚡</span>
                                            </div>
                                        </template>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.fontSize||11}px;color:${el.color||'#e6edf3'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label || 'Команда'"></div>
                                </div>
                            </template>

                            <!-- ctrl_btn: control button, active/inactive by system mode -->
                            <template x-if="el.type === 'ctrl_btn'">
                                <div style="position:absolute;inset:0;overflow:visible"
                                     :style="sysIsManual(points[el.point_id]?.system) ? 'cursor:pointer' : 'cursor:default'"
                                     @click.stop="sysIsManual(points[el.point_id]?.system) && ctrlBtnClick(el)">
                                    <div :style="`position:absolute;inset:0;border:${el.borderWidth||2}px solid ${sysIsManual(points[el.point_id]?.system)?(el.colorActive||'#3fb950'):(el.colorInactive||'#484f58')};border-radius:${el.borderRadius||8}px;box-sizing:border-box;overflow:hidden;opacity:${sysIsManual(points[el.point_id]?.system)?1:0.45};${biImageBgStyle(sysIsManual(points[el.point_id]?.system)?(el.imageActive||''):(el.imageInactive||''))}`">
                                        <template x-if="!el.imageActive && !el.imageInactive">
                                            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                                                <span :style="`font-size:${el.fontSize||14}px;color:${sysIsManual(points[el.point_id]?.system)?(el.color||'#e6edf3'):(el.colorInactiveText||el.color||'#8b949e')}`"
                                                      x-text="el.text||'CMD'"></span>
                                            </div>
                                        </template>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.labelFontSize||11}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label"></div>
                                </div>
                            </template>

                            <!-- timer_elapsed: elapsed time since point last changed to trigger_value -->
                            <template x-if="el.type === 'timer_elapsed'">
                                <div style="position:absolute;inset:0;overflow:visible">
                                    <div class="r-timer"
                                         :style="`background:${el.bgColor||'rgba(0,0,0,.25)'};border:${el.borderWidth??1}px solid ${el.borderColor||'rgba(255,255,255,.08)'};border-radius:${el.borderRadius??4}px`">
                                        <span class="tv"
                                              :style="`font-size:${el.fontSize||22}px;color:${timerElapsedColor(el)}`"
                                              x-text="fmtHMS(timerElapsedS(el))"></span>
                                        <span class="tcd" x-show="el.showCaption"
                                              x-text="el.caption||'в роботі'"></span>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.labelFontSize||11}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label"></div>
                                </div>
                            </template>

                            <!-- timer_countdown: countdown + shrinking progress bar -->
                            <template x-if="el.type === 'timer_countdown'">
                                <div style="position:absolute;inset:0;overflow:visible">
                                    <div class="r-timer"
                                         :style="`background:${el.bgColor||'rgba(0,0,0,.25)'};border:${el.borderWidth??1}px solid ${el.borderColor||'rgba(255,255,255,.08)'};border-radius:${el.borderRadius??4}px`">
                                        <span class="tv"
                                              :style="`font-size:${el.fontSize||22}px;color:${timerCountdownColor(el)}`"
                                              x-text="fmtHMS(timerCountdownS(el))"></span>
                                        <span class="tcd" x-show="el.showCaption"
                                              x-text="el.caption||'до завершення'"></span>
                                        <!-- shrinking bar at bottom -->
                                        <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);border-radius:0 0 3px 3px;overflow:hidden">
                                            <div :style="`height:100%;width:${timerCountdownBarPct(el)}%;background:${timerCountdownColor(el)};transition:width 1s linear`"></div>
                                        </div>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.labelFontSize||11}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label"></div>
                                </div>
                            </template>

                            <!-- timer_bar: elapsed-time progress bar -->
                            <template x-if="el.type === 'timer_bar'">
                                <div style="position:absolute;inset:0;overflow:visible">
                                    <div class="r-tbar"
                                         :style="`background:${el.bgColor||'#21262d'};border:${el.borderWidth??1}px solid ${el.borderColor||'#30363d'}`">
                                        <div :style="`position:absolute;top:0;left:0;bottom:0;width:${timerBarPct(el)}%;background:${timerBarColor(el)};transition:width .9s linear`"></div>
                                        <div x-show="el.showValue"
                                             style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                                            <span :style="`font-size:${el.fontSize||11}px;color:${timerElapsedColor(el)};font-weight:600;font-variant-numeric:tabular-nums`"
                                                  x-text="fmtHMS(timerElapsedS(el))"></span>
                                        </div>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.labelFontSize||11}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label"></div>
                                </div>
                            </template>

                            <!-- countdown_bar: shrinking bar, fires setPointValue when empty -->
                            <template x-if="el.type === 'countdown_bar'">
                                <div style="position:absolute;inset:0;overflow:visible">
                                    <div class="r-tbar"
                                         :style="`background:${el.bgColor||'#21262d'};border:${el.borderWidth??1}px solid ${el.borderColor||'#30363d'};border-radius:${el.borderRadius??4}px`">
                                        <div :style="`position:absolute;top:0;left:0;bottom:0;width:${countdownBarPct(el)}%;background:${countdownBarColor(el)};transition:width 1s linear`"></div>
                                        <div x-show="el.showValue"
                                             style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                                            <span :style="`font-size:${el.fontSize||11}px;color:${el.color||'#e6edf3'};font-weight:600;font-variant-numeric:tabular-nums`"
                                                  x-text="fmtHMS(countdownBarS(el))"></span>
                                        </div>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.labelFontSize||11}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label"></div>
                                </div>
                            </template>

                            <!-- multi_timer: schedule-based ON/OFF display with SVG images -->
                            <template x-if="el.type === 'multi_timer'">
                                <div style="position:absolute;inset:0;overflow:visible">
                                    <div :style="`position:absolute;inset:0;border:${el.borderWidth??2}px solid ${multiTimerIsOn(el) ? (el.colorOn||'#3fb950') : (el.colorOff||'#484f58')};border-radius:${el.borderRadius??8}px;overflow:hidden;box-sizing:border-box;cursor:${sysIsManual(points[el.point_id]?.system)?'pointer':'default'};opacity:${sysIsManual(points[el.point_id]?.system)?1:0.75}`"
                                         @click.stop="sysIsManual(points[el.point_id]?.system) && openSchedModal(el)">
                                        <img x-show="multiTimerIsOn(el) && el.imageOn"
                                             :src="el.imageOn"
                                             style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none">
                                        <img x-show="!multiTimerIsOn(el) && el.imageOff"
                                             :src="el.imageOff"
                                             style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none">
                                        <div x-show="!(multiTimerIsOn(el) ? el.imageOn : el.imageOff)"
                                             style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                                            <span :style="`font-size:${el.fontSize||14}px;font-weight:600;color:${multiTimerIsOn(el) ? (el.colorOn||'#3fb950') : (el.colorOff||'#484f58')}`"
                                                  x-text="multiTimerIsOn(el) ? 'ВКЛ' : 'ВИКЛ'"></span>
                                        </div>
                                        <!-- manual-mode indicator -->
                                        <div x-show="sysIsManual(points[el.point_id]?.system)"
                                             style="position:absolute;top:3px;right:4px;font-size:9px;color:rgba(255,255,255,.45);pointer-events:none">✎</div>
                                    </div>
                                    <div x-show="el.showLabel"
                                         :style="`position:absolute;left:50%;top:100%;transform:translateX(-50%);padding-top:4px;text-align:center;font-size:${el.labelFontSize||11}px;color:${el.labelColor||'#8b949e'};white-space:nowrap;line-height:1.1;pointer-events:none`"
                                         x-text="el.label"></div>
                                </div>
                            </template>

                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</main>

<!-- ═══════════ OPMODE CONFIRM MODAL ═══════════ -->
<div x-show="opmodeModal.show"
     @click.self="opmodeModal.show=false"
     style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.65)">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px 28px;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.5)">
        <div style="color:#e6edf3;font-size:15px;line-height:1.55;margin-bottom:22px"
             x-text="`Ви дійсно бажаєте перевести систему «${opmodeModal.sysName}» в режим управління «${opmodeModal.modeName}»?`"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
            <button @click="opmodeModal.show=false"
                    style="padding:7px 18px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#8b949e;cursor:pointer;font-size:13px">
                Скасувати
            </button>
            <button @click="ctrlOpmodeConfirm()"
                    style="padding:7px 18px;background:#238636;border:1px solid #2ea043;border-radius:6px;color:#fff;cursor:pointer;font-size:13px">
                Підтвердити
            </button>
        </div>
    </div>
</div>

<!-- ═══════════ CTRL SIGNAL CONFIRM MODAL ═══════════ -->
<div x-show="ctrlBtnModal.show"
     @click.self="ctrlBtnModal.show=false"
     style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.65)">
