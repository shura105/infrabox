<!-- ═══════════ FOOTER ═══════════ -->
<footer>
    <div class="ws-dot" :class="{'ws-live':wsStatus==='live','ws-conn':wsStatus==='connecting','ws-error':wsStatus==='error'}"></div>
    <span class="ftr-text" x-text="wsStatus==='live'?'Live':'Підключення...'"></span>
    <span class="ftr-text" x-show="lastUpdate" x-text="`Оновлено: ${lastUpdate}`"></span>
    <span class="ftr-right" x-show="sc" x-text="`${sc?.width}×${sc?.height}`"></span>
</footer>

<script>
// Per-element memo for gauge data — keyed by el (WeakMap, GC-safe).
// Bypasses Alpine reactivity, so storing here doesn't trigger re-renders.
const _gaugeMemo = new WeakMap();

// Frozen elapsed_s per timer element: saved when active, returned when inactive.
// Plain Map (not reactive) — updates here never trigger Alpine re-renders.
const _timerFrozen = new Map();

// Validate JWT in localStorage; clear stale entries so we don't show a
// previous login (e.g. expired admin token) as still active.
function _readAuth() {
    const t = localStorage.getItem('token');
    const clear = () => ['token','role','display_name','permissions']
                          .forEach(k => localStorage.removeItem(k));
    if (!t) return { isLoggedIn: false, role: '', name: '' };
    try {
        const payload = JSON.parse(atob(t.split('.')[1]));
        if (payload.exp && payload.exp * 1000 < Date.now()) {
            clear();
            return { isLoggedIn: false, role: '', name: '' };
        }
        return {
            isLoggedIn: true,
            role: localStorage.getItem('role') || payload.role || '',
            name: localStorage.getItem('display_name') || payload.display_name || '',
        };
    } catch {
        clear();
        return { isLoggedIn: false, role: '', name: '' };
    }
}

function app() {
    const _auth = _readAuth();
    return {
        theme:       localStorage.getItem('ib-theme') || 'dark',
        isLoggedIn:  _auth.isLoggedIn,
        project:     { screens: [] },
        sc:          null,
        els:         [],
        points:      {},
        screenId:    null,
        history:     [],
        wsStatus:    'connecting',
        wsRetry:     0,
        loading:     true,
        clock:       '--:--:--',
        clockDate:   '',
        menuOpen:    false,
        menuPage:    'main',
        userMenuOpen: false,
        deviceType:  parseInt(localStorage.getItem('ib-device-type') || '1'),

        viewScale:   1,
        lastUpdate:  '',
        _ws:         null,
        systemsMap:   {},
        systemsFull:  {},
        _cntdExpired: {},
        _barFired:    {},
        userPerms:    {},
        userRole:     _auth.role || '',
        opmodeModal:  { show: false, el: null, targetValue: 0, sysName: '', modeName: '' },
        ctrlBtnModal: { show: false, el: null },
        schedModal:   { show: false, elId: '', schedule: [], saving: false },
        opmodeDeny:   { show: false },
        permsDeny:   { show: false },

        async init() {
            this._startClock();
            this._connectWS();
            await this._loadProject();
            this._loadSystems();
            this._loadMe();

            this.$nextTick(() => this._updateScale());
            window.addEventListener('resize', () => this._updateScale());
            window.addEventListener('beforeunload', () => {
                if (this._ws) { this._ws.onclose = null; this._ws.close(); }
            });
        },

        _startClock() {
            const tick = () => {
                const now = new Date();
                this.clock = now.toLocaleTimeString('uk-UA');
                this.clockDate = now.toLocaleDateString('uk-UA',
                    { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
            };
            tick();
            setInterval(tick, 1000);
        },

        async _loadProject() {
            try {
                const r = await fetch('/api/pub/project');
                if (r.ok) this.project = await r.json();
                // try mobile/desktop preference, fall back across candidates
                const candidates = [];
                const seen = new Set();
                const add = id => { if (id && !seen.has(id)) { seen.add(id); candidates.push(id); } };
                add(this._pickStartScreen());
                add(this._rootForDevice(this.deviceType));
                add('root');
                for (const id of candidates) {
                    if (await this.loadScreen(id)) break;
                }
            } catch(e) { console.error(e); }
            this.loading = false;
        },

        _isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        },

        _pickStartScreen() {
            // First-load only: pick lowest-screenNum screen matching the
            // current viewport (mobile vs desktop). After this, user navigates
            // via buttons; nav code blocks cross-type so we won't drift.
            const wantMobile = this._isMobile();
            const dt = this.deviceType;
            const matches = (this.project.screens || []).filter(s => {
                const isMob = (s.screenType || 'pc') === 'mobile';
                return wantMobile === isMob && (s.deviceType || 1) === dt;
            });
            if (!matches.length) return null;
            matches.sort((a, b) => (a.screenNum || 0) - (b.screenNum || 0));
            return matches[0].id;
        },

        _rootForDevice(dt) {
            // find lowest screenNum for this device type
            const matches = this.project.screens.filter(s => (s.deviceType||1) === dt);
            if (!matches.length) return null;
            matches.sort((a,b) => (a.screenNum||0) - (b.screenNum||0));
            return matches[0].id;
        },

        get deviceTypes() {
            const curType = this.project.screens.find(s => s.id === this.screenId)?.screenType || 'pc';
            const s = new Set(
                this.project.screens
                    .filter(s => (s.screenType || 'pc') === curType)
                    .map(s => s.deviceType || 1)
            );
            return [...s].sort((a,b) => a-b);
        },

        setDeviceType(dt) {
            this.deviceType = dt;
            localStorage.setItem('ib-device-type', String(dt));
            this.history = [];
            const startId = this._rootForDevice(dt);
            if (startId) this.loadScreen(startId);
            this.menuOpen = false;
            this.menuPage = 'main';
        },

        getScreenPath(id) {
            return id;  // плоска структура: screens/{id}/screen.json
        },

        async loadScreen(id) {
            if (!id) return false;
            try {
                const path = this.getScreenPath(id);
                const r = await fetch(`/api/pub/screens/${path}`);
                if (!r.ok) return false;
                const data = await r.json();
                this.sc  = data.screen;
                this.els = data.elements || [];
                this.screenId = id;
                this.$nextTick(() => this._updateScale());
                return true;
            } catch(e) { console.error(e); return false; }
        },

        _canPage(slug) {
            if (this.userRole === 'admin') return true;
            const pages = this.userPerms.pages;
            if (!pages) return true;          // обмежень не задано → дозволено
            return pages.includes(slug);
        },

        _menuGo(url, slug) {
            this.menuOpen = false;
            this.menuPage = 'main';
            if (!this._canPage(slug)) { this.permsDeny.show = true; return; }
            window.location.href = url;
        },

        async navigate(targetId) {
            if (!targetId) return;
            if (!this._canPage(targetId)) {
                this.permsDeny.show = true;
                return;
            }
            const target = this.project.screens.find(s => s.id === targetId);
            if (!target) return;
            // block cross-type and cross-device navigation
            const cur = this.project.screens.find(s => s.id === this.screenId);
            const curType   = cur?.screenType   || 'pc';
            const tgtType   = target.screenType  || 'pc';
            const curDevice = cur?.deviceType    || 1;
            const tgtDevice = target.deviceType  || 1;
            if (curType !== tgtType || curDevice !== tgtDevice) return;
            this.history.push(this.screenId);
            await this.loadScreen(targetId);
        },

        async goBack() {
            if (!this.history.length) return;
            await this.loadScreen(this.history.pop());
        },

        _connectWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws`);
            this._ws = ws;
            this.wsStatus = 'connecting';

            ws.onopen  = () => { this.wsStatus = 'live'; this.wsRetry = 0; };
            ws.onclose = () => {
                this.wsStatus = 'error';
                const delay = Math.min(1000 * Math.pow(2, this.wsRetry++), 30000);
                setTimeout(() => this._connectWS(), delay);
            };
            ws.onerror = () => { this.wsStatus = 'error'; };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'snapshot') {
                    const pts = {};
                    msg.data.forEach(p => {
                        pts[p.id] = p;
                        if (p.type === 'operation_mode' && p.system && this.systemsFull[p.system])
                            this.systemsFull[p.system] = { ...this.systemsFull[p.system], operation_mode: parseInt(p.value) === 1 ? 'auto' : 'manual' };
                    });
                    this.points = pts;
                } else if (msg.type === 'update') {
                    msg.data.forEach(p => {
                        this.points[p.id] = p;
                        if (p.type === 'operation_mode' && p.system && this.systemsFull[p.system])
                            this.systemsFull[p.system] = { ...this.systemsFull[p.system], operation_mode: parseInt(p.value) === 1 ? 'auto' : 'manual' };
                    });
                }
                const now = new Date();
                this.lastUpdate = now.toLocaleTimeString('uk-UA');
            };
        },

        _updateScale() {
            if (!this.sc) return;
            const area = document.getElementById('canvas-area');
            if (!area) return;
            const pad = 32;
            const aw = area.clientWidth  - pad;
            const ah = area.clientHeight - pad;
            this.viewScale = Math.min(aw / this.sc.width, ah / this.sc.height);
        },

        logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            localStorage.removeItem('display_name');
            localStorage.removeItem('permissions');
            this.isLoggedIn = false;
            this.userRole   = '';
            this.userPerms  = {};
        },

        userName() {
            return this.isLoggedIn ? (_auth.name || _auth.role || 'user') : 'operator';
        },

        toggleTheme() {
            this.theme = this.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('ib-theme', this.theme);
        },

        screenTitle() {
            if (!this.screenId) return 'Немає екранів';
            const s = this.project.screens.find(s => s.id === this.screenId);
            return s?.title || this.sc?.title || 'Екран';
        },

        cvBgImage() {
            return this.sc?.bgImage ? `url(${this.sc.bgImage})` : 'none';
        },

        // ── live data ──
        ptValue(id) {
            const p = this.points[id];
            if (!p || p.value == null) return '···';
            // discrete: prefer human label if configured, otherwise show 0/1
            if (p.type === 'discrete') {
                const v = parseInt(p.value);
                if (v === 0) return p.label_0 || '0';
                if (v === 1) return p.label_1 || '1';
                return p.value;
            }
            const v = parseFloat(p.value);
            return isNaN(v) ? p.value : v.toLocaleString('uk-UA', { maximumFractionDigits: 3 });
        },
        ptUnit(id) {
            const p = this.points[id];
            // discrete points have no unit (label is the unit)
            if (p?.type === 'discrete') return '';
            return p?.unit || '';
        },
        ptQuality(id) { return this.points[id]?.quality || 'NODATA'; },

        _qColor(q, good) {
            return ({ GOOD:good, WARN:'#f0ad4e', ALARM:'#f47067',
                      UNCERT:'#8b949e', INIT:'#58a6ff', NODATA:'#484f58' })[q] || '#484f58';
        },
        valueColor(el)      { return this._qColor(this.ptQuality(el.point_id), el.color); },
        indicatorColor(el) {
            const q = this.ptQuality(el.point_id);
            return ({ GOOD: el.color,        WARN:  el.colorWarn  ||'#f0ad4e',
                      ALARM: el.colorAlarm  ||'#f47067', UNCERT: el.colorUncert||'#8b949e',
                      INIT: '#58a6ff', NODATA: '#484f58' })[q] || '#484f58';
        },
        indicatorBorder(el) {
            const q = this.ptQuality(el.point_id);
            return ({ GOOD: el.borderColor,            WARN:  el.borderColorWarn  ||el.colorWarn  ||'#f0ad4e',
                      ALARM: el.borderColorAlarm||el.colorAlarm||'#f47067', UNCERT: el.borderColorUncert||el.colorUncert||'#8b949e',
                      INIT: '#58a6ff', NODATA: '#333a42' })[q] || '#333a42';
        },
        _ptLim(pt, el, key) {
            // prefer Redis limits (written by core), fall back to element config
            const v = parseFloat(pt?.[key]);
            return isNaN(v) ? el[key] : v;
        },
        levelFillStyle(el) {
            const pt = this.points[String(el.point_id)];
            const v = parseFloat(pt?.value ?? NaN);
            const mn = this._ptLim(pt, el, 'min'), mx = this._ptLim(pt, el, 'max');
            const scale = isNaN(v) ? 0 : Math.min(1, Math.max(0, (v - mn) / ((mx - mn) || 1)));
            const q = this.ptQuality(el.point_id);
            const color = ({ GOOD: el.colorGood||'#56d364', WARN: el.colorWarn||'#f0ad4e',
                             ALARM: el.colorAlarm||'#f47067', UNCERT: el.colorWarn||'#f0ad4e',
                             INIT: '#58a6ff' })[q] || (el.colorGood||'#56d364');
            return el.type === 'level_v'
                ? `position:absolute;bottom:0;left:0;right:0;height:100%;background:${color};transform:scaleY(${scale});transform-origin:bottom center;transition:transform .4s`
                : `position:absolute;top:0;left:0;bottom:0;width:100%;background:${color};transform:scaleX(${scale});transform-origin:left center;transition:transform .4s`;
        },
        // ── gauge ─────────────────────────────────────────────────────────────
        _gaugeArcPath(cx, cy, r, a1, a2) {
            if (Math.abs(a2 - a1) < 0.1) return null;
            const rd = Math.PI / 180;
            const x1 = cx + r*Math.cos(a1*rd), y1 = cy + r*Math.sin(a1*rd);
            const x2 = cx + r*Math.cos(a2*rd), y2 = cy + r*Math.sin(a2*rd);
            const sw = ((a2 - a1) % 360 + 360) % 360;
            return `M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${sw>180?1:0} 1 ${x2.toFixed(2)},${y2.toFixed(2)}`;
        },
        _gaugeValAngle(mn, mx, v) {
            return 135 + Math.min(1, Math.max(0, (v - mn) / ((mx - mn) || 1))) * 270;
        },
        // Computes ALL gauge-related data for `el` in one pass and memoizes by
        // (value, quality, limits, colors) signature. Re-rendering bindings hit
        // the WeakMap cache instead of recomputing 11x per gauge.
        gaugeData(el) {
            const pt = this.points[String(el.point_id)];
            const sig = `${pt?.value}|${pt?.quality}|${pt?.unit}|${pt?.min}|${pt?.max}|${pt?.warn_min}|${pt?.warn_max}|${pt?.alarm_min}|${pt?.alarm_max}|${el.min}|${el.max}|${el.warn_min}|${el.warn_max}|${el.alarm_min}|${el.alarm_max}|${el.colorGood}|${el.colorWarn}|${el.colorAlarm}|${el.color}|${el.needleColor}|${el.arcWidth}`;
            const cached = _gaugeMemo.get(el);
            if (cached && cached.sig === sig) return cached.data;

            const mn = this._ptLim(pt, el, 'min'),  mx = this._ptLim(pt, el, 'max');
            const cG = el.colorGood||'#56d364', cW = el.colorWarn||'#f0ad4e', cA = el.colorAlarm||'#f47067';
            const aMin = Math.max(mn,   this._ptLim(pt, el, 'alarm_min'));
            const wMin = Math.max(aMin, this._ptLim(pt, el, 'warn_min'));
            const wMax = Math.min(mx,   this._ptLim(pt, el, 'warn_max'));
            const aMax = Math.min(mx,   this._ptLim(pt, el, 'alarm_max'));
            const raw = [];
            if (aMin > mn)   raw.push([mn, aMin, cA]);
            if (wMin > aMin) raw.push([aMin, wMin, cW]);
            raw.push([wMin, wMax, cG]);
            if (aMax > wMax) raw.push([wMax, aMax, cW]);
            if (mx > aMax)   raw.push([aMax, mx, cA]);

            const d = ['', '', '', '', ''];
            const c = ['none', 'none', 'none', 'none', 'none'];
            for (let i = 0; i < raw.length && i < 5; i++) {
                d[i] = this._gaugeArcPath(50, 56, 36,
                    this._gaugeValAngle(mn, mx, raw[i][0]),
                    this._gaugeValAngle(mn, mx, raw[i][1])) || '';
                c[i] = raw[i][2];
            }

            const v = pt ? parseFloat(pt.value) : NaN;
            const ang = this._gaugeValAngle(mn, mx, isNaN(v) ? mn : v) * Math.PI / 180;
            const nLen = 36 - (el.arcWidth||10)/2 - 2;
            const cosA = Math.cos(ang), sinA = Math.sin(ang);

            const q = this.ptQuality(el.point_id);
            const data = {
                d, c,
                nx1: (50 - 5*cosA).toFixed(2),
                ny1: (56 - 5*sinA).toFixed(2),
                nx2: (50 + nLen*cosA).toFixed(2),
                ny2: (56 + nLen*sinA).toFixed(2),
                needleColor: this._qColor(q, el.needleColor || '#e6edf3'),
                textColor:   this._qColor(q, el.color       || '#e6edf3'),
                valueText: pt
                    ? (isNaN(v) ? '—' : String(parseFloat(v.toFixed(2)))) + (pt.unit ? ' '+pt.unit : '')
                    : '—',
            };
            _gaugeMemo.set(el, { sig, data });
            return data;
        },
        gaugeZoneD(el, i)       { return this.gaugeData(el).d[i]; },
        gaugeZoneC(el, i)       { return this.gaugeData(el).c[i]; },
        gaugeNeedleCoord(el, i) {
            const g = this.gaugeData(el);
            return [g.nx1, g.ny1, g.nx2, g.ny2][i];
        },
        gaugeNeedleColor(el) { return this.gaugeData(el).needleColor; },
        gaugeTextColor(el)   { return this.gaugeData(el).textColor; },
        gaugeValueText(el)   { return this.gaugeData(el).valueText; },
        // ── shape SVG helpers ──────────────────────────────────────────────────
        svgEllipse(el) {
            const sw = el.strokeWidth || 0, h = sw / 2;
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%">
                <ellipse cx="50" cy="50" rx="${50-h}" ry="${50-h}"
                         fill="${el.fill||'transparent'}" stroke="${el.strokeColor||'#58a6ff'}"
                         stroke-width="${sw}" opacity="${el.opacity??1}"/></svg>`;
        },
        svgLine(el) {
            const sw = el.strokeWidth || 2;
            const W  = Math.round(el.w * this.sc.width);
            const H  = Math.round(el.h * this.sc.height);
            const x1 = (el.x1??0)   / 100 * W, y1 = (el.y1??0)   / 100 * H;
            const x2 = (el.x2??100) / 100 * W, y2 = (el.y2??100) / 100 * H;
            const dash = el.dashed ? `stroke-dasharray="${el.dashLen||8},${el.dashGap||4}"` : '';
            return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" overflow="visible">
                <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
                      stroke="${el.color||'#58a6ff'}" stroke-width="${sw}"
                      stroke-linecap="round" ${dash} opacity="${el.opacity??1}"/></svg>`;
        },
        /* ── active_line helpers: persistent DOM, no innerHTML replacement ── */
        _alIsOn(el) {
            const pt = this.points[el.point_id];
            return pt ? parseFloat(pt.value) !== 0 : false;
        },
        _alColor(el) {
            const isOn = this._alIsOn(el);
            return isOn ? (el.color1 || '#56d364') : (el.color0 || '#484f58');
        },
        _alDash(el) {
            const isOn  = this._alIsOn(el);
            const eff   = isOn ? (el.effect1 || 'static') : (el.effect0 || 'static');
            const dashed = isOn ? !!el.dashed1 : !!el.dashed0;
            // legacy compat: old elements stored dashed as effect='dashed'
            if (!dashed && eff !== 'dashed' && !['flow_right','flow_left'].includes(eff)) return null;
            const dLen = isOn ? (el.dashLen1 || 12) : (el.dashLen0 || 8);
            const dGap = isOn ? (el.dashGap1 || 6)  : (el.dashGap0 || 4);
            return `${dLen},${dGap}`;
        },
        _alStyle(el) {
            const isOn  = this._alIsOn(el);
            const _eff  = isOn ? (el.effect1 || 'static') : (el.effect0 || 'static');
            // legacy: effect='dashed' treated as static (dash handled by _alDash)
            const eff   = _eff === 'dashed' ? 'static' : _eff;
            const dLen  = isOn ? (el.dashLen1 || 12) : (el.dashLen0 || 8);
            const dGap  = isOn ? (el.dashGap1 || 6)  : (el.dashGap0 || 4);
            const speed = Math.max(0.1, isOn ? (el.speed1 || 1) : (el.speed0 || 1));
            const opac  = isOn ? 1 : (el.opacity0 ?? 0.4);
            const per   = dLen + dGap;
            // --al-end/endr used by global @keyframes al-fwd/al-rev
            let s = `--al-end:${-per};--al-endr:${per};--al-op:${opac};opacity:${eff==='none'?0:opac}`;
            switch (eff) {
                case 'flow_right': s += `;animation:al-fwd   ${(per/(speed*20)).toFixed(2)}s linear infinite`; break;
                case 'flow_left':  s += `;animation:al-rev   ${(per/(speed*20)).toFixed(2)}s linear infinite`; break;
                case 'blink':      s += `;animation:al-blink ${(1/speed).toFixed(2)}s step-end infinite`; break;
                case 'pulse':      s += `;animation:al-pulse ${(2/speed).toFixed(2)}s ease-in-out infinite`; break;
                case 'glow':       s += `;filter:url(#al_gf${el.id});animation:al-glow ${(2/speed).toFixed(2)}s ease-in-out infinite`; break;
            }
            return s;
        },
        /* ── active_arc helpers ── */
        _aaD(el) {
            const sw   = el.strokeWidth || 4;
            const r    = 50 - sw / 2;
            const rS   = r.toFixed(2);
            const span = ((el.endAngle||270) - (el.startAngle||0) + 360) % 360 || 360;
            if (span >= 360) {
                const rn = (50+r).toFixed(2), ln = (50-r).toFixed(2);
                return `M ${rn} 50 A ${rS} ${rS} 0 1 1 ${ln} 50 A ${rS} ${rS} 0 1 1 ${rn} 50`;
            }
            const sa  = ((el.startAngle||0) - 90) * Math.PI / 180;
            const ea  = ((el.endAngle||270)  - 90) * Math.PI / 180;
            const x1  = (50 + r * Math.cos(sa)).toFixed(2), y1 = (50 + r * Math.sin(sa)).toFixed(2);
            const x2  = (50 + r * Math.cos(ea)).toFixed(2), y2 = (50 + r * Math.sin(ea)).toFixed(2);
            return `M ${x1} ${y1} A ${rS} ${rS} 0 ${span>180?1:0} 1 ${x2} ${y2}`;
        },
        _aaStyle(el) {
            // same as _alStyle but glow filter references #aa_gf
            const isOn  = this._alIsOn(el);
            const _eff  = isOn ? (el.effect1||'static') : (el.effect0||'static');
            const eff   = _eff === 'dashed' ? 'static' : _eff;
            const dLen  = isOn ? (el.dashLen1||12) : (el.dashLen0||8);
            const dGap  = isOn ? (el.dashGap1||6)  : (el.dashGap0||4);
            const speed = Math.max(0.1, isOn ? (el.speed1||1) : (el.speed0||1));
            const opac  = isOn ? 1 : (el.opacity0??0.4);
            const per   = dLen + dGap;
            let s = `--al-end:${-per};--al-endr:${per};--al-op:${opac};opacity:${eff==='none'?0:opac}`;
            switch (eff) {
                case 'flow_right': s += `;animation:al-fwd   ${(per/(speed*20)).toFixed(2)}s linear infinite`; break;
                case 'flow_left':  s += `;animation:al-rev   ${(per/(speed*20)).toFixed(2)}s linear infinite`; break;
                case 'blink':      s += `;animation:al-blink ${(1/speed).toFixed(2)}s step-end infinite`; break;
                case 'pulse':      s += `;animation:al-pulse ${(2/speed).toFixed(2)}s ease-in-out infinite`; break;
                case 'glow':       s += `;filter:url(#aa_gf${el.id});animation:al-glow ${(2/speed).toFixed(2)}s ease-in-out infinite`; break;
            }
            return s;
        },
        svgArrow(el) {
            const sw = el.strokeWidth || 2;
            const W  = Math.round(el.w * this.sc.width);
            const H  = Math.round(el.h * this.sc.height);
            const x1 = (el.x1??0)   / 100 * W, y1 = (el.y1??50)  / 100 * H;
            const x2 = (el.x2??100) / 100 * W, y2 = (el.y2??50)  / 100 * H;
            const col = el.color || '#58a6ff';
            const aLen = el.arrowSize || 12, aW = aLen * 0.45;
            const dx = x2-x1, dy = y2-y1, len = Math.sqrt(dx*dx+dy*dy);
            if (len < 1) return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%"></svg>`;
            const nx = dx/len, ny = dy/len;
            const bx = x2 - aLen*nx, by = y2 - aLen*ny;
            const p1 = `${(bx+aW*ny).toFixed(1)},${(by-aW*nx).toFixed(1)}`;
            const p2 = `${(bx-aW*ny).toFixed(1)},${(by+aW*nx).toFixed(1)}`;
            const tip = `${x2.toFixed(1)},${y2.toFixed(1)}`;
            const dash = el.dashed ? `stroke-dasharray="${el.dashLen||8},${el.dashGap||4}"` : '';
            return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" overflow="visible">
                <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"
                      stroke="${col}" stroke-width="${sw}" stroke-linecap="round" ${dash} opacity="${el.opacity??1}"/>
                <polygon points="${p1} ${tip} ${p2}" fill="${col}" opacity="${el.opacity??1}"/></svg>`;
        },
        svgTriangle(el) {
            const sw = el.strokeWidth || 0, h = sw / 2;
            const pts = { up:`50,${h} ${100-h},${100-h} ${h},${100-h}`,
                          down:`${h},${h} ${100-h},${h} 50,${100-h}`,
                          right:`${h},${h} ${100-h},50 ${h},${100-h}`,
                          left:`${100-h},${h} ${h},50 ${100-h},${100-h}` }[el.direction||'up']||`50,0 100,100 0,100`;
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%">
                <polygon points="${pts}" fill="${el.fill||'#1e2130'}"
                         stroke="${el.strokeColor||'#58a6ff'}" stroke-width="${sw}"
                         stroke-linejoin="round" opacity="${el.opacity??1}"/></svg>`;
        },

        svgArc(el) {
            const sw = el.strokeWidth || 4;
            const r  = 50 - sw / 2;
            const sa = ((el.startAngle || 0)   - 90) * Math.PI / 180;
            const ea = ((el.endAngle   || 270) - 90) * Math.PI / 180;
            const span = ((el.endAngle || 270) - (el.startAngle || 0) + 360) % 360 || 360;
            if (span >= 360) {
                return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="50" cy="50" rx="${r.toFixed(2)}" ry="${r.toFixed(2)}"
                             fill="none" stroke="${el.strokeColor||'#58a6ff'}"
                             stroke-width="${sw}" opacity="${el.opacity??1}"/></svg>`;
            }
            const x1 = (50 + r * Math.cos(sa)).toFixed(2);
            const y1 = (50 + r * Math.sin(sa)).toFixed(2);
            const x2 = (50 + r * Math.cos(ea)).toFixed(2);
            const y2 = (50 + r * Math.sin(ea)).toFixed(2);
            const large = span > 180 ? 1 : 0;
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <path d="M ${x1} ${y1} A ${r.toFixed(2)} ${r.toFixed(2)} 0 ${large} 1 ${x2} ${y2}"
                      fill="none" stroke="${el.strokeColor||'#58a6ff'}" stroke-width="${sw}"
                      stroke-linecap="round" opacity="${el.opacity??1}"/></svg>`;
        },

        // ── bistable elements (pump, motor, valve, relay, reed, optical) ─────
        bistableSvg(el, value, quality) {
            const isOn = value === 1;
            const valid = (value === 0 || value === 1);
            const isAlarm = quality === "ALARM";
            const isWarn  = quality === "WARN";
            const noData  = !valid || quality === "NODATA" || quality === "UNCERT" || quality === "INIT";

            const cOn     = el.colorOn     || "#56d364";
            const cOff    = el.colorOff    || "#484f58";
            const cWarn   = el.colorWarn   || "#f0ad4e";
            const cAlarm  = el.colorAlarm  || "#f47067";
            const cUncert = el.colorUncert || "#8b949e";
            const cStroke = el.colorBorder || "#8b949e";

            const accent = noData    ? cUncert
                         : isAlarm   ? cAlarm
                         : isWarn    ? cWarn
                         : isOn      ? cOn
                                     : cOff;
            const stroke = noData ? cUncert : cStroke;
            const bg = "#161b22";
            const pipe = "#6e7681";
            const dash = noData ? `stroke-dasharray="3,3"` : ``;

            switch (el.type) {
                case "bi_pump": return `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <line x1="0" y1="50" x2="18" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <line x1="82" y1="50" x2="100" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <circle cx="50" cy="50" r="32" fill="${bg}" stroke="${accent}" stroke-width="3" ${dash}/>
                        <path d="M50,22 Q70,50 50,78" stroke="${accent}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <path d="M22,50 Q50,30 78,50" stroke="${accent}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="4" fill="${accent}"/>
                    </svg>`;
                case "bi_motor": return `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <line x1="0" y1="50" x2="22" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <line x1="78" y1="50" x2="100" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <rect x="22" y="22" width="56" height="56" rx="6" fill="${bg}" stroke="${accent}" stroke-width="3" ${dash}/>
                        <text x="50" y="62" text-anchor="middle" fill="${accent}" font-size="34" font-weight="700" font-family="system-ui">M</text>
                    </svg>`;
                case "bi_valve": {
                    const blade = isOn
                        ? `<polygon points="20,30 50,50 20,70" fill="none" stroke="${accent}" stroke-width="3"/>
                           <polygon points="80,30 50,50 80,70" fill="none" stroke="${accent}" stroke-width="3"/>`
                        : `<polygon points="20,30 50,50 20,70" fill="${accent}" stroke="${accent}" stroke-width="2"/>
                           <polygon points="80,30 50,50 80,70" fill="${accent}" stroke="${accent}" stroke-width="2"/>`;
                    return `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <line x1="0" y1="50" x2="20" y2="50" stroke="${pipe}" stroke-width="3"/>
                        <line x1="80" y1="50" x2="100" y2="50" stroke="${pipe}" stroke-width="3"/>
                        ${blade}
                        <line x1="50" y1="50" x2="50" y2="20" stroke="${accent}" stroke-width="2.5"/>
                        <rect x="38" y="6" width="24" height="14" rx="2" fill="${bg}" stroke="${accent}" stroke-width="2" ${dash}/>
                    </svg>`;
                }
                case "bi_relay": {
                    const contact = isOn
                        ? `<line x1="60" y1="35" x2="90" y2="35" stroke="${accent}" stroke-width="3"/>`
                        : `<line x1="60" y1="35" x2="90" y2="20" stroke="${accent}" stroke-width="3"/>`;
                    return `
                    <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <rect x="6" y="20" width="40" height="22" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <text x="26" y="36" text-anchor="middle" fill="${accent}" font-size="14" font-weight="600" font-family="system-ui">~</text>
                        <circle cx="60" cy="35" r="3" fill="${accent}"/>
                        <circle cx="90" cy="35" r="3" fill="${accent}"/>
                        ${contact}
                    </svg>`;
                }
                case "bi_reed": {
                    const reedR = isOn
                        ? `<line x1="55" y1="20" x2="80" y2="20" stroke="${accent}" stroke-width="3"/>`
                        : `<line x1="55" y1="20" x2="80" y2="14" stroke="${accent}" stroke-width="3"/>`;
                    return `
                    <svg viewBox="0 0 100 40" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <rect x="8" y="6" width="84" height="28" rx="14" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <line x1="0" y1="20" x2="20" y2="20" stroke="${pipe}" stroke-width="2.5"/>
                        <line x1="80" y1="20" x2="100" y2="20" stroke="${pipe}" stroke-width="2.5"/>
                        <line x1="20" y1="20" x2="45" y2="20" stroke="${accent}" stroke-width="3"/>
                        ${reedR}
                    </svg>`;
                }
                case "bi_optical": {
                    const beam = isOn
                        ? `<line x1="22" y1="25" x2="78" y2="25" stroke="${accent}" stroke-width="3" stroke-linecap="round"/>`
                        : `<line x1="22" y1="25" x2="48" y2="25" stroke="${accent}" stroke-width="2.5" stroke-dasharray="4,4"/>`;
                    return `
                    <svg viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
                        <rect x="0"  y="10" width="22" height="30" rx="3" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <rect x="78" y="10" width="22" height="30" rx="3" fill="${bg}" stroke="${accent}" stroke-width="2.5" ${dash}/>
                        <circle cx="20" cy="25" r="3" fill="${accent}"/>
                        <circle cx="80" cy="25" r="3" fill="${accent}"/>
                        ${beam}
                    </svg>`;
                }
            }
            return "";
        },
        // Render bistable element using live point data from WebSocket
        bistableSvgEl(el) {
            const p = this.points[el.point_id];
            const v = p ? parseInt(p.value) : null;
            const q = p?.quality || "NODATA";
            return this.bistableSvg(el, v, q);
        },
        // bi_image: pick configured image for current state
        biImageSrcEl(el) {
            const p = this.points[el.point_id];
            const v = p ? parseInt(p.value) : null;
            const q = p?.quality || "NODATA";
            if (q === "ALARM" && el.imageAlarm) return el.imageAlarm;
            if ((q === "UNCERT" || q === "NODATA" || q === "INIT") && el.imageUncert) return el.imageUncert;
            if (v === 1 && el.imageOn)  return el.imageOn;
            if (v === 0 && el.imageOff) return el.imageOff;
            return "";
        },
        biImageBgStyle(src) {
            if (!src) return "";
            return `background-image:url(${src});background-size:contain;background-repeat:no-repeat;background-position:center;`;
        },

        // ── calc_box: quality computed by core, image picked from Redis state ──
        calcBoxImageSrc(el) {
            const q = this.points[el.point_id]?.quality || "NODATA";
            switch (q) {
                case "ALARM":  return el.imageAlarm  || el.imageUncert || "";
                case "WARN":   return el.imageWarn   || el.imageGood   || "";
                case "INIT":   return el.imageInit   || el.imageUncert || "";
                case "GOOD":   return el.imageGood   || "";
                default:       return el.imageUncert || "";
            }
        },

        // ── ctrl_opmode: border color and image by quality/value ──
        ctrlOpmodeColor(el) {
            const pt = this.points[el.point_id];
            if (!pt) return el.colorInit || '#484f58';
            const q = pt.quality || "NODATA";
            if (q === "INIT")   return el.colorInit   || '#484f58';
            if (q === "NODATA") return el.colorUncert || '#6e7681';
            if (q === "UNCERT") return el.colorUncert || '#6e7681';
            return el.colorGood || '#3fb950';
        },
        ctrlOpmodeImageSrc(el) {
            const pt = this.points[el.point_id];
            const v = pt ? parseInt(pt.value) : 0;
            return v === 1 ? (el.image1 || "") : (el.image0 || "");
        },

        // ── ctrl_signal: border color ──
        // WARN/ALARM always show feedback state (both modes)
        // GOOD: manual→colorManual, auto→colorGood
        // everything else (INIT/NODATA/startup): dim color
        ctrlSignalColor(el) {
            const pt = this.points[el.point_id];
            if (!pt) return '#484f58';
            const q = pt.quality || "NODATA";
            if (q === "WARN")  return el.colorWarn  || '#f0ad4e';
            if (q === "ALARM") return el.colorAlarm || '#f47067';
            if (q === "GOOD") {
                const sysId = pt.system;
                const manual = sysId ? (this.systemsFull[sysId]?.operation_mode === 'manual') : false;
                return manual ? (el.colorManual || '#8b949e') : (el.colorGood || '#3fb950');
            }
            // INIT / NODATA / startup
            const sysId = pt.system;
            const manual = sysId ? (this.systemsFull[sysId]?.operation_mode === 'manual') : false;
            return manual ? (el.colorManual || '#8b949e') : '#484f58';
        },
        ctrlSignalImageSrc(el) {
            const pt = this.points[el.point_id];
            const v = pt ? parseInt(pt.value) : 0;
            return v === 1 ? (el.image1 || "") : (el.image0 || "");
        },

        openSchedModal(el) {
            this.schedModal = {
                show:     true,
                elId:     el.id,
                schedule: JSON.parse(JSON.stringify(el.schedule || [])),
                saving:   false,
            };
        },
        async saveSchedModal() {
            this.schedModal.saving = true;
            const token = localStorage.getItem('token');
            try {
                await fetch(`/api/scheduler/${this.schedModal.elId}`, {
                    method:  'PATCH',
                    headers: { 'Content-Type': 'application/json',
                               'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        schedule: this.schedModal.schedule,
                        screen:   this.screenId,
                    }),
                });
                // update local element so modal shows fresh data on next open
                const el = this.els.find(e => e.id === this.schedModal.elId);
                if (el) el.schedule = JSON.parse(JSON.stringify(this.schedModal.schedule));
            } finally {
                this.schedModal.saving = false;
                this.schedModal.show   = false;
            }
        },

        ctrlBtnClick(el) {
            if (!el.point_id) return;
            if (this.userRole !== 'admin' && !this.userPerms.ctrl_signal) {
                this.opmodeDeny.show = true;
                return;
            }
            this.ctrlBtnModal = { show: true, el };
        },
        async ctrlBtnConfirm() {
            const { el } = this.ctrlBtnModal;
            this.ctrlBtnModal.show = false;
            if (!this.sysIsManual(this.points[String(el.point_id)]?.system)) return;
            const id = String(el.point_id);
            const raw = this.points[id]?.value;
            const cur = (raw !== '' && raw != null) ? (parseInt(raw) || 0) : 0;
            const next = (cur === 1) ? 0 : 1;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/points/${el.point_id}/value`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ value: next })
                });
                if (res.ok) {
                    // optimistic: WARN immediately, core confirms via WS
                    if (this.points[id])
                        this.points[id] = { ...this.points[id], value: String(next), quality: 'WARN' };
                } else {
                    console.error('ctrl_signal send failed:', res.status);
                }
            } catch(e) { console.error('ctrl_signal send failed:', e); }
        },
        ctrlOpmodeClick(el) {
            if (!el.point_id) return;
            if (this.userRole !== 'admin' && !this.userPerms.ctrl_opmode) {
                this.opmodeDeny.show = true;
                return;
            }
            const pt = this.points[String(el.point_id)];
            const curValue = pt ? parseInt(pt.value) : 0;
            const targetValue = curValue === 1 ? 0 : 1;
            const sysName = pt?.system ? (this.systemsMap[pt.system] || pt.system) : (el.label || '');
            const modeName = targetValue === 1 ? 'Автоматичний' : 'Ручний';
            this.opmodeModal = { show: true, el, targetValue, sysName, modeName };
        },
        async ctrlOpmodeConfirm() {
            const { el, targetValue } = this.opmodeModal;
            this.opmodeModal.show = false;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/points/${el.point_id}/value`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ value: targetValue })
                });
                if (!res.ok) console.error('opmode set failed:', res.status);
            } catch(e) { console.error('opmode set failed:', e); }
        },
        async _loadSystems() {
            try {
                const r = await fetch('/adm/api/systems');
                if (r.ok) {
                    const data = await r.json();
                    const names = {}, full = {};
                    data.forEach(s => {
                        names[s.id] = s.name;
                        full[s.id] = s;
                    });
                    this.systemsMap  = names;
                    this.systemsFull = full;
                }
            } catch(e) {}
        },
        sysIsManual(sysId) {
            if (!sysId) return false;
            return this.systemsFull[sysId]?.operation_mode === 'manual';
        },

        // ── Timer helpers ──────────────────────────────────────────────────────
        // Format seconds → HH:MM:SS
        fmtHMS(s) {
            s = Math.max(0, Math.floor(s) || 0);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        },
        // Seconds elapsed. When active: saves to _timerFrozen and returns live value.
        // When inactive: returns the frozen value saved during last active period.
        timerElapsedS(el) {
            const pt = this.points[el.point_id];
            const tv = el.trigger_value;
            const isActive = pt && (tv == null || parseFloat(pt.value) === parseFloat(tv));
            if (isActive) {
                const s = parseInt(pt.elapsed_s) || 0;
                if (s > 0) _timerFrozen.set(el.id, s);
                return s;
            }
            return _timerFrozen.get(el.id) || 0;
        },
        // Text color for elapsed timer: colorOff when frozen/inactive, el.color when running.
        timerElapsedColor(el) {
            const pt = this.points[el.point_id];
            if (!pt) return el.colorOff || '#484f58';
            const tv = el.trigger_value;
            const isActive = tv == null || parseFloat(pt.value) === parseFloat(tv);
            return isActive ? (el.color || '#e6edf3') : (el.colorOff || '#484f58');
        },
        // Seconds remaining for countdown. Frozen at last remaining when inactive.
        timerCountdownS(el) {
            const pt = this.points[el.point_id];
            if (!pt) return _timerFrozen.get(el.id + '_cd') ?? 0;
            const dur = parseInt(el.duration_s) || 0;
            if (!dur) return 0;
            const tv = el.trigger_value;
            const isActive = tv == null || parseFloat(pt.value) === parseFloat(tv);
            if (!isActive) return _timerFrozen.get(el.id + '_cd') ?? 0;
            const elapsed = parseInt(pt.elapsed_s) || 0;
            const remaining = Math.max(0, dur - elapsed);
            // save remaining so inactive state shows the frozen value
            _timerFrozen.set(el.id + '_cd', remaining);
            const expired = (remaining === 0);
            if (this._cntdExpired[el.id] !== expired) this._cntdExpired[el.id] = expired;
            return remaining;
        },
        // Text/bar color for countdown: colorOff when frozen, colorExpired when expired, el.color otherwise.
        timerCountdownColor(el) {
            const pt = this.points[el.point_id];
            if (!pt) return el.colorOff || '#484f58';
            const tv = el.trigger_value;
            const isActive = tv == null || parseFloat(pt.value) === parseFloat(tv);
            if (!isActive) return el.colorOff || '#484f58';
            return this._cntdExpired[el.id]
                ? (el.colorExpired || '#f47067')
                : (el.color || '#e6edf3');
        },
        // Fill color for timer_bar: colorOff when frozen, colorFill when running.
        timerBarColor(el) {
            const pt = this.points[el.point_id];
            if (!pt) return el.colorOff || '#484f58';
            const tv = el.trigger_value;
            const isActive = tv == null || parseFloat(pt.value) === parseFloat(tv);
            return isActive ? (el.colorFill || el.color || '#3fb950') : (el.colorOff || '#484f58');
        },
        // Bar fill % for elapsed bar (timer_bar)
        timerBarPct(el) {
            const dur = parseInt(el.duration_s) || 0;
            if (!dur) return 0;
            return Math.min(100, (this.timerElapsedS(el) / dur) * 100);
        },
        // Bar fill % for countdown bar (shrinks from 100 → 0)
        timerCountdownBarPct(el) {
            const dur = parseInt(el.duration_s) || 0;
            if (!dur) return 100;
            return Math.min(100, Math.max(0, (this.timerCountdownS(el) / dur) * 100));
        },

        // ── countdown_bar helpers ──────────────────────────────────────────
        // Seconds remaining for the standalone countdown bar element.
        // Active: saves remaining to _timerFrozen, fires target point at 0.
        // Inactive: returns frozen value (bar freezes in place, color → colorOff).
        countdownBarS(el) {
            const pt = this.points[el.point_id];
            const key = el.id + '_cb';
            const tv = el.trigger_value;
            const isActive = pt && (tv == null || parseFloat(pt.value) === parseFloat(tv));
            if (!isActive) return _timerFrozen.get(key) ?? 0;
            const dur = parseInt(el.duration_s) || 0;
            if (!dur) return 0;
            const elapsed = parseInt(pt.elapsed_s) || 0;
            const remaining = Math.max(0, dur - elapsed);
            _timerFrozen.set(key, remaining);
            if (remaining === 0 && !this._barFired[el.id]) {
                this._barFired[el.id] = true;
                if (el.target_point_id && el.expire_value != null)
                    this._firePointValue(el.target_point_id, el.expire_value);
            } else if (remaining > 0 && this._barFired[el.id]) {
                this._barFired[el.id] = false;
            }
            return remaining;
        },
        countdownBarPct(el) {
            const dur = parseInt(el.duration_s) || 0;
            if (!dur) return 0;
            return Math.min(100, Math.max(0, (this.countdownBarS(el) / dur) * 100));
        },
        countdownBarColor(el) {
            const pt = this.points[el.point_id];
            const tv = el.trigger_value;
            const isActive = pt && (tv == null || parseFloat(pt.value) === parseFloat(tv));
            if (!isActive) return el.colorOff || '#484f58';
            return this._barFired[el.id]
                ? (el.colorExpired || '#f47067')
                : (el.colorFill   || '#3fb950');
        },
        async _firePointValue(pointId, value) {
            const token = localStorage.getItem('token');
            try {
                await fetch(`/api/points/${pointId}/value`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ value: parseInt(value) || 0 })
                });
            } catch(e) { console.error('[countdown_bar] fire failed:', e); }
        },

        // ── multi_timer helper ─────────────────────────────────────────────
        // Returns true if current wall-clock time falls within any schedule slot.
        // Reads this.clock to create reactive dependency (re-evaluates every second).
        multiTimerIsOn(el) {
            void this.clock; // reactive dependency
            if (!el.schedule || !el.schedule.length) return false;
            const d = new Date();
            const hms = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
            return el.schedule.some(({ on, off }) => {
                if (!on || !off) return false;
                if (on < off) return hms >= on && hms < off;
                if (on > off) return hms >= on || hms < off; // cross-midnight
                return false;
            });
        },
        async _loadMe() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const r = await fetch('/auth/me', { headers: { Authorization: `Bearer ${token}` } });
                if (r.ok) {
                    const me = await r.json();
                    this.userPerms = me.permissions || {};
                    this.userRole  = me.role || '';
                }
            } catch(e) {}
        },

        openHref(href) {
            if (!href) return;
            if (this._ws) { this._ws.onclose = null; this._ws.close(); }
            window.location.assign(href);
        },
        iboxDotColor(el)    { return this._qColor(this.ptQuality(el.point_id), '#56d364'); },
        iboxBorderColor(el) {
            const q = this.ptQuality(el.point_id);
            return this._qColor(q, 'rgba(86,211,100,.6)');
        },
    };
}
</script>
